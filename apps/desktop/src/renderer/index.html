<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FreeFrame Desktop (name TBD)</title>
  <!-- Canonical colors from packages/design-tokens, copied here by
       scripts/sync-tokens.js on predev/prebuild. Generated + gitignored —
       edit the package, not this copy. Same for icons.js (lucide@0.511.0,
       the exact release apps/web pins via lucide-react). -->
  <link rel="stylesheet" href="tokens.css" />
  <script src="icons.js"></script>
  <style>
    /* Colors come from tokens.css (linked above). Only the aliases this
       renderer needs on top of the shared set live here — the shared file
       names its border tokens --border-primary/--border-secondary, and this
       UI referred to a single --border throughout. */
    :root {
      --border: var(--border-primary);
      --accent-2: var(--status-turquoise);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; }
    header .spacer { flex: 1; }
    header .mode {
      font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-tertiary); border: 1px solid var(--border);
      padding: 3px 8px; border-radius: 999px;
    }

    button {
      -webkit-app-region: no-drag;
      background: var(--bg-elevated); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
      font-family: inherit;
    }
    button:hover:not(:disabled) { background: var(--bg-hover); }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #08080b; font-weight: 600; }
    button.primary:hover:not(:disabled) { filter: brightness(1.12); }

    /* ── Three-zone layout: Sources | volumes | Destinations ── */
    /* minmax(0,1fr), not 1fr: a plain 1fr column refuses to shrink below its
       content's min-content width, so one long volume path was blowing the
       center column out and pushing the Destinations zone off-screen
       entirely. min-width:0 down the chain is the other half of the same
       fix — without it the flex children re-introduce the same floor. */
    .columns { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) minmax(0,1fr); gap: 1px; background: var(--border); min-height: 0; }
    .col { background: var(--bg-primary); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .col-head {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .col-head h2 {
      margin: 0; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em; color: var(--text-secondary);
    }
    .col-head .spacer { flex: 1; }
    .col-head button { padding: 3px 7px; font-size: 11px; }
    .col-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px; min-width: 0; }

    /* Item 4 — overlay scrollbars.
       The default Chromium bar is a solid light track that fights the dark
       theme. This is the macOS overlay convention: nothing visible until
       you're actually in the scrolling area. No JS needed for "only when
       there's overflow" — overflow-y:auto already handles that; the :hover
       rule handles "only when you're looking at it". */
    .col-body::-webkit-scrollbar { width: 10px; }
    .col-body::-webkit-scrollbar-track { background: transparent; }
    .col-body::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 999px;
      /* Transparent border + background-clip is what makes the visible
         thumb narrower than the hit area — a 4px-wide bar you can't grab
         is worse than no bar. */
      border: 3px solid transparent;
      background-clip: content-box;
      transition: background-color 150ms;
    }
    .col-body:hover::-webkit-scrollbar-thumb { background-color: rgba(148, 148, 158, .45); }
    .col-body:hover::-webkit-scrollbar-thumb:hover { background-color: rgba(148, 148, 158, .75); }
    .col-body::-webkit-scrollbar-corner { background: transparent; }

    .zone { min-height: 100%; border-radius: 8px; }
    /* Drop affordance while a drag is in flight. */
    .zone.drop-ready { outline: 1px dashed var(--border); outline-offset: -4px; }
    .zone.drop-active { outline: 2px solid var(--accent); outline-offset: -4px; background: rgba(91,141,239,.06); }

    .hint { color: var(--text-tertiary); font-size: 11px; text-align: center; padding: 20px 8px; line-height: 1.5; }

    /* ── Cards ── */
    .card {
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg-elevated); padding: 8px 10px; margin-bottom: 8px;
      cursor: grab;
    }
    .card:active { cursor: grabbing; }
    .card .name { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta { color: var(--text-secondary); font-size: 10px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .card.assigned { opacity: .45; }

    /* A destination card that will accept a cascade drop — the blue outline
       from Hedge's documented mechanic. */
    .card.cascade-target { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(91,141,239,.14); }

    .badge {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      padding: 2px 6px; border-radius: 999px; border: 1px solid var(--border);
      color: var(--text-secondary); flex-shrink: 0;
    }
    .badge.src { color: var(--accent); border-color: var(--accent); background: rgba(91,141,239,.12); }
    .badge.dst { color: var(--accent-2); border-color: var(--accent-2); background: rgba(45,212,191,.12); }

    /* Status dot — semantic colors, mapped per the roadmap. */
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--status-draft); }
    .dot.copying, .dot.verifying { background: var(--status-info); animation: pulse 1s ease-in-out infinite; }
    .dot.verified { background: var(--status-success); }
    .dot.failed { background: var(--status-error); }
    .dot.skipped { background: var(--status-warning); }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

    .status-text { font-size: 10px; color: var(--text-secondary); }
    .status-text.verified { color: var(--status-success); }
    .status-text.failed { color: var(--status-error); }
    .status-text.skipped { color: var(--status-warning); }
    .status-text.copying, .status-text.verifying { color: var(--status-info); }

    /* ── Cascade chain rendering ── */
    .chain { margin-bottom: 10px; }
    .chain-from {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--text-tertiary); padding: 0 2px 4px;
    }
    .arrow { color: var(--accent); font-size: 13px; line-height: 1; }
    .cascaded { margin-left: 18px; border-left: 2px solid var(--accent); padding-left: 10px; position: relative; }
    .cascaded::before {
      content: "↳"; position: absolute; left: -10px; top: 6px;
      color: var(--accent); font-size: 12px;
    }

    /* Per-node progress bar inside a card. */
    .node-bar { height: 3px; border-radius: 999px; background: var(--bg-primary); overflow: hidden; margin-top: 6px; }
    .node-bar > div { height: 100%; width: 0%; background: var(--status-info); transition: width 120ms linear; }
    .node-bar > div.verified { background: var(--status-success); }
    .node-bar > div.failed { background: var(--status-error); }

    /* ── Square (grid) view for the Volumes column ──
       Deliberately matched to apps/web/components/projects/asset-card.tsx
       rather than approximated, so a desktop tile and a web asset tile read
       as the same component family:
         group flex flex-col rounded-lg overflow-hidden
         transition-all duration-150 cursor-pointer
         border-2 border-transparent hover:border-border-focus
         (selected → border-accent bg-accent/5 shadow-lg shadow-accent/10)
         image area: aspect-[16/10] bg-bg-tertiary, centered fallback tile
                     h-14 w-14 rounded-2xl bg-bg-hover text-text-secondary
                     with a h-7 w-7 icon
         info: px-2 pt-2 pb-1.5, gap-1, title text-sm font-medium leading-tight
       Tailwind values translated to plain CSS: rounded-lg = 8px,
       rounded-2xl = 16px, border-2 = 2px, h-14 = 56px, h-7 = 28px,
       text-sm = 14px, px-2 = 8px, pt-2 = 8px, pb-1.5 = 6px, gap-1 = 4px. */
    .grid-view {
      display: grid;
      /* 118px, not 150px: this column is only ~300px wide, and two 150px
         tracks plus the gap overflow it — auto-fill then collapses to a
         single full-width tile whose 16:10 media area is enormous. At 118px
         two tiles fit comfortably with room for the gap. */
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
      align-content: start;
    }
    .tile {
      display: flex; flex-direction: column;
      border-radius: 8px; overflow: hidden;
      border: 2px solid transparent;
      transition: all 150ms;
      cursor: grab;
      background: transparent;
    }
    .tile:hover { border-color: var(--border-focus); }
    .tile:active { cursor: grabbing; }
    .tile.assigned {
      border-color: var(--accent);
      background: rgba(91, 141, 239, .05);
      box-shadow: 0 10px 15px -3px rgba(91,141,239,.10), 0 4px 6px -4px rgba(91,141,239,.10);
    }
    /* Same blue-outline cascade affordance the list cards use. */
    .tile.cascade-target { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(91,141,239,.14); }

    .tile-media {
      position: relative; width: 100%;
      aspect-ratio: 16 / 10;
      background: var(--bg-tertiary);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .tile-icon {
      height: 56px; width: 56px;
      border-radius: 16px;
      background: var(--bg-hover);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: transform 200ms;
    }
    .tile:hover .tile-icon { transform: scale(1.02); }
    /* Two classes, not one: the generic `.icon svg { 14px }` rule below has
       equal specificity and is defined later, so a plain `.tile-icon svg`
       loses to it and these render at half size (asset-card.tsx's fallback
       glyph is h-7 w-7 = 28px). */
    .tile-icon .icon svg { height: 28px; width: 28px; }

    .tile-badge {
      position: absolute; top: 8px; right: 8px;
      border-radius: 4px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      font-size: 9px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: rgba(255,255,255,.85);
    }
    .tile-role {
      position: absolute; top: 8px; left: 8px;
      border-radius: 4px; padding: 2px 6px;
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    }
    .tile-role.src { background: var(--accent); color: var(--accent-foreground); }
    .tile-role.dst { background: var(--status-turquoise); color: var(--accent-foreground); }

    .tile-info { display: flex; flex-direction: column; gap: 4px; padding: 8px 8px 6px; }
    .tile-name {
      font-size: 14px; font-weight: 500; color: var(--text-primary);
      line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-meta { font-size: 10px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* View toggle in the Volumes column header. */
    .view-toggle { display: flex; gap: 2px; background: var(--bg-tertiary); border-radius: 6px; padding: 2px; }
    .view-toggle button {
      border: none; background: transparent; padding: 3px 6px; border-radius: 4px;
      color: var(--text-tertiary); display: flex; align-items: center;
    }
    .view-toggle button.active { background: var(--bg-elevated); color: var(--text-primary); }
    .view-toggle button svg { height: 14px; width: 14px; }

    /* Inline icons in list rows / buttons. */
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .icon svg { height: 14px; width: 14px; }
    .icon.sm svg { height: 12px; width: 12px; }
    .card-grip { color: var(--text-tertiary); flex-shrink: 0; opacity: .5; }
    .card:hover .card-grip { opacity: 1; }

    /* ── Drag ghost ── */
    #ghost {
      position: fixed; pointer-events: none; z-index: 999;
      background: var(--bg-elevated); border: 1px solid var(--accent);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600;
      opacity: .95; box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none;
    }

    /* ── Item 5: dual-role conflict modal ── */
    #modal-backdrop {
      position: fixed; inset: 0; z-index: 1100; display: none;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    #modal-backdrop.open { display: flex; }
    .modal {
      width: 420px; max-width: calc(100vw - 40px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }
    .modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .modal-head .icon svg { height: 18px; width: 18px; }
    .modal-head .icon { color: var(--status-warning); }
    .modal h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .modal p { margin: 0 0 14px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .modal p b { color: var(--text-primary); font-weight: 600; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .modal-actions .row2 { display: flex; gap: 8px; }
    .modal-actions .row2 button { flex: 1; justify-content: center; }
    .modal-actions button { display: flex; align-items: center; gap: 6px; }
    .modal-chosen { font-size: 11px; color: var(--status-success); }

    /* ── Context menu (non-drag fallback) ── */
    #menu {
      position: fixed; z-index: 1000; display: none;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px; min-width: 190px;
      box-shadow: 0 12px 32px rgba(0,0,0,.6);
    }
    #menu button {
      display: block; width: 100%; text-align: left; border: none;
      background: transparent; padding: 6px 10px; font-size: 12px; border-radius: 5px;
    }
    #menu button:hover:not(:disabled) { background: var(--bg-hover); }
    #menu .sep { height: 1px; background: var(--border); margin: 4px 0; }
    #menu .label { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-tertiary); padding: 5px 10px 3px; }

    /* ── Footer: progress + summary ── */
    footer { border-top: 1px solid var(--border); background: var(--bg-secondary); flex-shrink: 0; }
    .progress { padding: 10px 14px; display: none; }
    .progress-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; margin-bottom: 6px; }
    .bar { height: 5px; border-radius: 999px; background: var(--bg-primary); overflow: hidden; }
    .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 120ms linear; }
    .progress-file { color: var(--text-tertiary); font-size: 10px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .released {
      margin-top: 6px; font-size: 11px; color: var(--status-success);
      display: none;
    }

    .summary { padding: 10px 14px; display: none; max-height: 210px; overflow-y: auto; }
    .summary .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .summary h3 { margin: 0; font-size: 13px; }
    .summary h3.ok { color: var(--status-success); }
    .summary h3.bad { color: var(--status-error); }
    .summary .stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 11px; color: var(--text-secondary); }
    .summary .stats b { color: var(--text-primary); font-weight: 600; }
    .summary ul { margin: 6px 0 0; padding-left: 16px; font-size: 10px; color: var(--status-error); }
    .summary .verdict { margin-top: 8px; font-size: 11px; }
    .verdict.ok { color: var(--status-success); }
    .verdict.bad { color: var(--status-error); }
  </style>
</head>
<body>
  <header>
    <h1>Offload</h1>
    <span class="mode">SECURE · xxHash64</span>
    <span class="spacer"></span>
    <button id="refresh"><span class="icon" data-icon="refresh"></span> Refresh</button>
    <button id="clear">Clear</button>
    <button id="start" class="primary" disabled>Copy &amp; Verify</button>
  </header>

  <div class="columns">
    <div class="col">
      <div class="col-head">
        <h2>Sources</h2>
        <span class="spacer"></span>
        <button data-choose="source">Choose folder…</button>
      </div>
      <div class="col-body"><div class="zone" id="zone-source" data-zone="source"></div></div>
    </div>

    <div class="col">
      <div class="col-head">
        <h2>Volumes</h2>
        <span class="spacer"></span>
        <!-- Toggle applies to this column only — Sources and Destinations
             keep their list layout regardless. -->
        <div class="view-toggle" id="view-toggle">
          <button data-view="line" title="List view" aria-label="List view"><span data-icon="viewList"></span></button>
          <button data-view="square" title="Grid view" aria-label="Grid view"><span data-icon="viewGrid"></span></button>
        </div>
      </div>
      <div class="col-body"><div class="zone" id="zone-volumes" data-zone="volumes"></div></div>
    </div>

    <div class="col">
      <div class="col-head">
        <h2>Destinations</h2>
        <span class="spacer"></span>
        <button data-choose="dest">Choose folder…</button>
      </div>
      <div class="col-body"><div class="zone" id="zone-dest" data-zone="dest"></div></div>
    </div>
  </div>

  <footer>
    <div class="progress" id="progress">
      <div class="progress-line">
        <strong id="p-phase">Preparing…</strong>
        <span id="p-counts"></span>
      </div>
      <div class="bar"><div id="p-bar"></div></div>
      <div class="progress-file" id="p-file"></div>
      <div class="released" id="p-released"></div>
    </div>
    <div class="summary" id="summary"></div>
  </footer>

  <div id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <span class="icon" data-icon="warning"></span>
        <h3 id="modal-title">Same volume on both sides</h3>
      </div>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <div class="row2">
          <button id="modal-src">Choose Source Folder…</button>
          <button id="modal-dst">Choose Destination Folder…</button>
        </div>
        <div id="modal-chosen" class="modal-chosen"></div>
        <div class="row2">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-done" class="primary" disabled>Done</button>
        </div>
      </div>
    </div>
  </div>

  <div id="ghost"></div>
  <div id="menu"></div>

  <script>
    // No Node access here (contextIsolation + sandbox: true in main.js) —
    // window.freeframe is the only thing preload.js exposes.

    const $ = (id) => document.getElementById(id);
    const zoneSource = $("zone-source");
    const zoneVolumes = $("zone-volumes");
    const zoneDest = $("zone-dest");
    const ghost = $("ghost");
    const menu = $("menu");

    // ── State ──
    let volumes = [];            // from volumes:list
    let extraFolders = [];       // added via Choose folder…
    let sourcePath = null;
    /** Destination tree. parentId null = copies from the original source;
     *  a parentId = cascades from that node. Same shape the engine takes,
     *  so nothing has to be translated at the IPC boundary. */
    let destNodes = [];          // [{ id, path, parentId, status, copiedBytes }]
    let copying = false;
    let nodeStatus = new Map();  // id -> { status, copiedBytes, filesVerified }
    let sourceReleased = false;

    /** "line" | "square" — Volumes column only. */
    let volumesView = "line";

    /** Item 6 — recent folder per device, mirrored from the main process so
     *  it survives a restart. Keyed by mountPoint. */
    let recentFolders = {};

    let nextId = 1;
    const newId = () => `d${nextId++}`;

    // ── Icons ──
    // window.FF_ICONS comes from the generated icons.js (lucide@0.511.0,
    // the same release apps/web pins). Inserted as innerHTML deliberately:
    // the values are static markup from a build-time codegen step, never
    // user input — unlike volume names, which stay text nodes throughout.
    function icon(name) {
      const span = document.createElement("span");
      span.className = "icon";
      span.innerHTML = (window.FF_ICONS && window.FF_ICONS[name]) || "";
      return span;
    }
    function paintStaticIcons(root = document) {
      for (const holder of root.querySelectorAll("[data-icon]")) {
        const svg = window.FF_ICONS && window.FF_ICONS[holder.dataset.icon];
        if (svg) holder.innerHTML = svg;
      }
    }
    /** Volume type → icon key. Falls back to the generic drive icon rather
     *  than rendering an empty box for a type we don't recognize. */
    const typeIcon = (t) =>
      ({ removable: "removable", internal: "internal", external: "external", network: "network", folder: "folder" }[t] || "internal");

    // ── Helpers ──
    function formatBytes(bytes) {
      if (bytes == null) return "—";
      const u = ["B", "KB", "MB", "GB", "TB"];
      let i = 0, n = bytes;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i += 1; }
      return `${n.toFixed(1)} ${u[i]}`;
    }
    const baseName = (p) => p.split("/").filter(Boolean).pop() || p;

    // User-supplied volume and file names land in the DOM, and this renderer
    // is deliberately the untrusted side of the IPC boundary — build text
    // nodes, never innerHTML with interpolated names.
    function el(tag, opts = {}, children = []) {
      const n = document.createElement(tag);
      if (opts.class) n.className = opts.class;
      if (opts.text != null) n.textContent = opts.text;
      if (opts.title) n.title = opts.title;
      if (opts.dataset) for (const [k, v] of Object.entries(opts.dataset)) n.dataset[k] = v;
      if (opts.style) n.setAttribute("style", opts.style);
      if (opts.onClick) n.addEventListener("click", opts.onClick);
      if (opts.disabled) n.disabled = true;
      for (const c of children) if (c) n.appendChild(c);
      return n;
    }

    function allEntries() {
      return [
        ...volumes.map((v) => ({ ...v })),
        ...extraFolders.map((p) => ({
          name: baseName(p), mountPoint: p, type: "folder",
          totalBytes: null, freeBytes: null,
        })),
      ];
    }
    const entryFor = (p) => allEntries().find((e) => e.mountPoint === p) || { name: baseName(p), mountPoint: p, type: "folder", totalBytes: null, freeBytes: null };

    const isAssigned = (p) => sourcePath === p || destNodes.some((n) => n.path === p);

    // ── Assignment ──
    function setSource(p) {
      if (copying) return;
      const previous = sourcePath;
      sourcePath = p;
      // Item 5: holding both roles is legitimate — copying between two
      // folders on one big RAID is a real workflow. What's *not* legitimate
      // is the bare volume root on both sides, which would copy a folder
      // into itself. So don't silently evict it from Destinations any more;
      // surface the conflict and make the user resolve it with subfolders.
      if (destNodes.some((n) => n.path === p)) {
        openDualRoleModal(p, () => { sourcePath = previous; render(); });
      }
      render();
    }
    function addDest(p, parentId = null) {
      if (copying) return;
      if (destNodes.some((n) => n.path === p)) return;
      destNodes.push({ id: newId(), path: p, parentId });
      // Symmetric with setSource: same conflict, same modal, whichever side
      // triggered it.
      if (p === sourcePath) {
        openDualRoleModal(p, () => { removeDest(p, true); render(); });
      }
      render();
    }
    /** Item 6 — a manually-picked folder that no longer holds any role has
     *  no reason to sit in the center column forever. Real mounted volumes
     *  are never pruned; they're there because they're mounted. */
    function pruneExtraFolder(p) {
      if (!p) return;
      if (volumes.some((v) => v.mountPoint === p)) return;  // a real volume
      if (sourcePath === p) return;
      if (destNodes.some((n) => n.path === p)) return;
      extraFolders = extraFolders.filter((f) => f !== p);
    }

    function removeDest(p, silent = false) {
      const node = destNodes.find((n) => n.path === p);
      if (!node) return;
      // Removing a parent would orphan its children into an invalid tree —
      // promote them to copy from the original source instead of silently
      // dropping their data.
      for (const child of destNodes) if (child.parentId === node.id) child.parentId = null;
      destNodes = destNodes.filter((n) => n.id !== node.id);
      pruneExtraFolder(p);
      if (!silent) render();
    }
    function cascadeFrom(childPath, parentId) {
      if (copying) return;
      const child = destNodes.find((n) => n.path === childPath);
      if (!child) { addDest(childPath, parentId); return; }
      if (child.id === parentId) return;
      // v1 is single-chain: a node that already has children can't also
      // become a child, or the chain becomes a multi-level tree the UI
      // doesn't draw yet. The engine handles depth fine — this is a UI
      // limit, deliberately, and the guard says so.
      if (destNodes.some((n) => n.parentId === child.id)) return;
      child.parentId = parentId;
      render();
    }
    function clearAll() {
      if (copying) return;
      sourcePath = null; destNodes = []; nodeStatus = new Map(); sourceReleased = false;
      $("summary").style.display = "none";
      render();
    }

    // ── Item 3 + 6: folder picking, per-device and with recents ──

    /** Opens the native picker, optionally rooted inside `device`, and
     *  records the result as that device's recent folder. */
    async function pickFolder({ title, device = null }) {
      const folder = await window.freeframe.chooseFolder(title, device || undefined);
      if (!folder) return null;
      if (!extraFolders.includes(folder) && !volumes.some((v) => v.mountPoint === folder)) {
        extraFolders.push(folder);
      }
      if (device) {
        recentFolders[device] = folder;
        window.freeframe.rememberFolder(device, folder);
      }
      return folder;
    }

    /** The device a path belongs to, for recent-folder lookup: the volume
     *  whose mountPoint is the longest prefix of it. */
    function deviceFor(p) {
      let best = null;
      for (const v of volumes) {
        if (p === v.mountPoint || p.startsWith(v.mountPoint + "/")) {
          if (!best || v.mountPoint.length > best.length) best = v.mountPoint;
        }
      }
      return best;
    }

    // ── Item 5: dual-role conflict modal ──
    let modalState = null;

    function openDualRoleModal(volumePath, onCancel) {
      modalState = { volumePath, onCancel, src: null, dst: null };
      const name = entryFor(volumePath).name;
      const body = $("modal-body");
      body.replaceChildren(
        document.createTextNode("This volume is now both the source and a destination. Copying "),
        el("b", { text: name }),
        document.createTextNode(
          " into itself would recurse, so pick a subfolder for each role — a source folder to read from, and a separate destination folder to write into."
        )
      );
      $("modal-chosen").textContent = "";
      $("modal-done").disabled = true;
      $("modal-backdrop").classList.add("open");
    }

    function updateModalChosen() {
      if (!modalState) return;
      const bits = [];
      if (modalState.src) bits.push(`Source: ${modalState.src}`);
      if (modalState.dst) bits.push(`Destination: ${modalState.dst}`);
      $("modal-chosen").textContent = bits.join("   ·   ");
      // Both are required: resolving only one side leaves the volume root
      // still serving the other role, i.e. the same conflict.
      $("modal-done").disabled = !(modalState.src && modalState.dst);
    }

    function closeModal() {
      $("modal-backdrop").classList.remove("open");
      modalState = null;
    }

    // ── Drag (pointer-based, not HTML5 DnD) ──
    // HTML5 drag-and-drop can't be driven by synthetic events, which would
    // make the cascade interaction untestable, and it behaves inconsistently
    // in Electron. Pointer events give the same UX with full control over
    // the drop indicator — and are directly exercisable by the e2e test.
    let drag = null; // { path, fromRole }

    function beginDrag(e, path, fromRole) {
      if (copying) return;
      drag = { path, fromRole, moved: false };
      ghost.textContent = entryFor(path).name;
      ghost.style.display = "block";
      moveGhost(e.clientX, e.clientY);
      document.body.style.cursor = "grabbing";
      zoneSource.classList.add("drop-ready");
      zoneDest.classList.add("drop-ready");
      // Item 7: the middle column is a valid target (drop here to unassign),
      // so it needs the same affordance the other two already had.
      zoneVolumes.classList.add("drop-ready");
    }
    function moveGhost(x, y) {
      ghost.style.left = `${x + 12}px`;
      ghost.style.top = `${y + 12}px`;
    }
    function clearDropIndicators() {
      zoneSource.classList.remove("drop-active");
      zoneDest.classList.remove("drop-active");
      zoneVolumes.classList.remove("drop-active");
      for (const c of document.querySelectorAll(".cascade-target")) c.classList.remove("cascade-target");
    }
    /** What's under the cursor: a destination card (cascade), or a zone. */
    function dropTargetAt(x, y) {
      const stack = document.elementsFromPoint(x, y);
      for (const node of stack) {
        if (node.dataset && node.dataset.destId && drag && node.dataset.path !== drag.path) {
          return { kind: "cascade", parentId: node.dataset.destId, element: node };
        }
      }
      for (const node of stack) {
        if (node.dataset && node.dataset.zone) return { kind: "zone", zone: node.dataset.zone, element: node };
      }
      return null;
    }

    window.addEventListener("mousemove", (e) => {
      if (!drag) return;
      drag.moved = true;
      moveGhost(e.clientX, e.clientY);
      clearDropIndicators();
      const t = dropTargetAt(e.clientX, e.clientY);
      if (!t) return;
      if (t.kind === "cascade") t.element.classList.add("cascade-target");
      else t.element.classList.add("drop-active");
    });

    window.addEventListener("mouseup", (e) => {
      if (!drag) return;
      const t = dropTargetAt(e.clientX, e.clientY);
      const dragged = drag.path;
      const fromRole = drag.fromRole;
      drag = null;
      ghost.style.display = "none";
      document.body.style.cursor = "";
      zoneSource.classList.remove("drop-ready");
      zoneDest.classList.remove("drop-ready");
      zoneVolumes.classList.remove("drop-ready");
      clearDropIndicators();

      if (!t) return;
      if (t.kind === "cascade") {
        // Dropped onto an existing destination → cascading group.
        cascadeFrom(dragged, t.parentId);
      } else if (t.zone === "source") {
        setSource(dragged);
      } else if (t.zone === "volumes") {
        // Item 7: dragging an assigned card back to the middle unassigns it
        // — the drag equivalent of the context menu's Remove.
        if (fromRole === "source" && sourcePath === dragged) {
          sourcePath = null;
          pruneExtraFolder(dragged);
          render();
        } else if (fromRole === "dest") {
          removeDest(dragged);
        }
      } else if (t.zone === "dest") {
        if (fromRole === "dest") {
          // Dragged out of a cascade and into open space → back to copying
          // from the original source.
          const n = destNodes.find((x) => x.path === dragged);
          if (n && n.parentId !== null) { n.parentId = null; render(); }
        } else {
          addDest(dragged, null);
        }
      }
    });

    // ── Context menu (non-drag fallback) ──
    function openMenu(e, path, role) {
      e.preventDefault();
      if (copying) return;
      menu.replaceChildren();

      const add = (label, fn, disabled = false) =>
        menu.appendChild(el("button", { text: label, disabled, onClick: () => { closeMenu(); fn(); } }));

      add("Set as Source", () => setSource(path), sourcePath === path);
      add("Set as Destination", () => addDest(path, null), destNodes.some((n) => n.path === path));

      // Item 3 — per-device pickers. The general header buttons stay (they
      // are the right tool for a plain folder-to-folder move), but they
      // can't say *which* drive a folder is on, which matters the moment
      // more than one card is being offloaded at once.
      const isVolume = volumes.some((v) => v.mountPoint === path);
      if (isVolume) {
        menu.appendChild(el("div", { class: "sep" }));
        add("Choose folder here as Source…", async () => {
          const f = await pickFolder({ title: `Choose a source folder on ${entryFor(path).name}`, device: path });
          if (f) setSource(f);
        });
        add("Choose folder here as Destination…", async () => {
          const f = await pickFolder({ title: `Choose a destination folder on ${entryFor(path).name}`, device: path });
          if (f) addDest(f, null);
        });

        // Item 6 — offer the last folder used on this device, so picking the
        // same destination twice doesn't mean browsing to it twice.
        const recent = recentFolders[path];
        if (recent) {
          const short = recent.replace(path, "").replace(/^\//, "") || recent;
          menu.appendChild(el("div", { class: "sep" }));
          menu.appendChild(el("div", { class: "label", text: "Recent on this device" }));
          add(`Source: ${short}`, () => setSource(recent));
          add(`Destination: ${short}`, () => addDest(recent, null));
        }
      }

      // "Cascade from…" — Hedge's own non-drag path, mirrored here for the
      // same accessibility reason the drag fallback exists at all.
      const candidates = destNodes.filter(
        (n) => n.path !== path && n.parentId === null && !destNodes.some((c) => c.parentId === n.id)
      );
      if (candidates.length) {
        menu.appendChild(el("div", { class: "sep" }));
        menu.appendChild(el("div", { class: "label", text: "Cascade from…" }));
        for (const c of candidates) {
          add(`  ${entryFor(c.path).name}`, () => cascadeFrom(path, c.id));
        }
      }

      if (role === "dest" || role === "source") {
        menu.appendChild(el("div", { class: "sep" }));
        add("Remove", () => {
          if (role === "source") {
            sourcePath = null;
            pruneExtraFolder(path);
            render();
          } else removeDest(path);
        });
      }

      menu.style.display = "block";
      menu.style.left = `${Math.min(e.clientX, window.innerWidth - 210)}px`;
      menu.style.top = `${Math.min(e.clientY, window.innerHeight - menu.offsetHeight - 10)}px`;
    }
    const closeMenu = () => { menu.style.display = "none"; };
    window.addEventListener("mousedown", (e) => { if (!menu.contains(e.target)) closeMenu(); });

    // ── Rendering ──
    function statusLabel(s) {
      return { pending: "Waiting", copying: "Copying", verifying: "Verifying", verified: "Verified", failed: "Failed", skipped: "Skipped" }[s] || "Ready";
    }

    function makeCard(entry, { role, node } = {}) {
      const st = node ? (nodeStatus.get(node.id) || {}) : {};
      const status = st.status || (node ? "pending" : null);

      const left = el("div", { style: "min-width:0;flex:1" }, [
        el("div", { class: "name", text: entry.name }),
        el("div", {
          class: "meta",
          text: entry.totalBytes == null
            ? entry.mountPoint
            : `${formatBytes(entry.freeBytes)} free of ${formatBytes(entry.totalBytes)}`,
          title: entry.mountPoint,
        }),
      ]);

      // Type glyph sits beside the name/meta stack, not inside it — `left`
      // is a vertical block, so the icon needs its own row wrapper or the
      // two lines end up side by side.
      const typeGlyph = icon(typeIcon(entry.type));
      typeGlyph.classList.add("card-grip");
      const leftWithIcon = el("div", { class: "row", style: "min-width:0;flex:1;gap:8px" }, [typeGlyph, left]);

      const right = el("div", { class: "row", style: "flex-shrink:0;gap:6px" });
      if (role === "source") right.appendChild(el("span", { class: "badge src", text: "Source" }));
      if (role === "dest") right.appendChild(el("span", { class: "badge dst", text: "Dest" }));
      if (!role) right.appendChild(el("span", { class: "badge", text: entry.type }));
      if (status) {
        right.appendChild(el("span", { class: `status-text ${status}`, text: statusLabel(status) }));
        right.appendChild(el("span", { class: `dot ${status}` }));
      }

      const card = el("div", {
        class: `card${!role && isAssigned(entry.mountPoint) ? " assigned" : ""}`,
        dataset: node
          ? { destId: node.id, path: entry.mountPoint, role: role || "" }
          : { path: entry.mountPoint, role: role || "" },
        title: entry.mountPoint,
      }, [el("div", { class: "row" }, [leftWithIcon, right])]);

      if (node) {
        const pct = st.percent != null ? st.percent : 0;
        const bar = el("div", { class: "node-bar" }, [
          el("div", { class: status === "verified" ? "verified" : status === "failed" ? "failed" : "", style: `width:${pct}%` }),
        ]);
        card.appendChild(bar);
      }

      card.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        beginDrag(e, entry.mountPoint, role);
      });
      card.addEventListener("contextmenu", (e) => openMenu(e, entry.mountPoint, role));
      return card;
    }

    /** Square tile for the Volumes grid. Structure mirrors
     *  apps/web's asset-card.tsx: media area with a centered icon tile,
     *  then a compact info block. */
    function makeTile(entry) {
      const assigned = isAssigned(entry.mountPoint);
      const isSrc = sourcePath === entry.mountPoint;
      const node = destNodes.find((n) => n.path === entry.mountPoint);

      const iconTile = el("div", { class: "tile-icon" });
      iconTile.appendChild(icon(typeIcon(entry.type)));

      const media = el("div", { class: "tile-media" }, [iconTile]);
      if (isSrc) media.appendChild(el("span", { class: "tile-role src", text: "Source" }));
      else if (node) media.appendChild(el("span", { class: "tile-role dst", text: "Dest" }));
      media.appendChild(el("span", { class: "tile-badge", text: entry.type }));

      const info = el("div", { class: "tile-info" }, [
        el("div", { class: "tile-name", text: entry.name }),
        el("div", {
          class: "tile-meta",
          text: entry.totalBytes == null ? entry.mountPoint : `${formatBytes(entry.freeBytes)} free`,
          title: entry.mountPoint,
        }),
      ]);

      const tile = el("div", {
        class: `tile${assigned ? " assigned" : ""}`,
        dataset: { path: entry.mountPoint, role: "" },
        title: entry.mountPoint,
      }, [media, info]);

      tile.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        beginDrag(e, entry.mountPoint, undefined);
      });
      tile.addEventListener("contextmenu", (e) => openMenu(e, entry.mountPoint, undefined));
      return tile;
    }

    function render() {
      // Sources column
      zoneSource.replaceChildren();
      if (sourcePath) {
        zoneSource.appendChild(makeCard(entryFor(sourcePath), { role: "source" }));
        if (sourceReleased) {
          zoneSource.appendChild(el("div", {
            class: "hint",
            style: "color:var(--status-success);padding:6px 8px",
            text: "✓ Card can be ejected — the cascade now reads from the local copy.",
          }));
        }
      } else {
        zoneSource.appendChild(el("div", { class: "hint", text: "Drag a volume here, or right-click one → Set as Source." }));
      }

      // Center column — the only one with a view toggle.
      zoneVolumes.replaceChildren();
      zoneVolumes.className = `zone${volumesView === "square" ? " grid-view" : ""}`;
      const entries = allEntries();
      if (!entries.length) {
        zoneVolumes.appendChild(el("div", {
          class: "hint",
          text: "No volumes mounted. Use “Choose folder…” to pick one.",
          // The hint must not become a grid cell, or it renders as a narrow
          // column instead of centered text.
          style: volumesView === "square" ? "grid-column:1/-1" : "",
        }));
      } else if (volumesView === "square") {
        for (const e of entries) zoneVolumes.appendChild(makeTile(e));
      } else {
        for (const e of entries) zoneVolumes.appendChild(makeCard(e, {}));
      }

      for (const b of document.querySelectorAll("#view-toggle button")) {
        b.classList.toggle("active", b.dataset.view === volumesView);
      }

      // Destinations column, grouped into chains.
      zoneDest.replaceChildren();
      if (!destNodes.length) {
        zoneDest.appendChild(el("div", {
          class: "hint",
          text: "Drag volumes here to copy in parallel.\n\nDrop one onto another to cascade — it will copy from that destination instead of the card, once the first leg verifies.",
          style: "white-space:pre-line",
        }));
      } else {
        const roots = destNodes.filter((n) => n.parentId === null);
        for (const root of roots) {
          const chain = el("div", { class: "chain" });
          chain.appendChild(el("div", { class: "chain-from" }, [
            el("span", { text: sourcePath ? entryFor(sourcePath).name : "Source" }),
            el("span", { class: "arrow", text: "→" }),
            el("span", { text: entryFor(root.path).name }),
          ]));
          chain.appendChild(makeCard(entryFor(root.path), { role: "dest", node: root }));

          const kids = destNodes.filter((n) => n.parentId === root.id);
          for (const kid of kids) {
            const wrap = el("div", { class: "cascaded" });
            wrap.appendChild(el("div", { class: "chain-from" }, [
              el("span", { text: entryFor(root.path).name }),
              el("span", { class: "arrow", text: "→" }),
              el("span", { text: entryFor(kid.path).name }),
            ]));
            wrap.appendChild(makeCard(entryFor(kid.path), { role: "dest", node: kid }));
            chain.appendChild(wrap);
          }
          zoneDest.appendChild(chain);
        }
      }

      const ready = Boolean(sourcePath) && destNodes.length > 0 && !copying;
      $("start").disabled = !ready;
      const cascades = destNodes.filter((n) => n.parentId !== null).length;
      $("start").textContent = cascades
        ? `Copy & Verify (${destNodes.length}, ${cascades} cascaded)`
        : destNodes.length > 1
          ? `Copy & Verify → ${destNodes.length}`
          : "Copy & Verify";
      $("clear").disabled = copying || (!sourcePath && !destNodes.length);
      $("refresh").disabled = copying;
    }

    async function refresh() {
      try {
        volumes = await window.freeframe.listVolumes();
      } catch (err) {
        volumes = [];
        zoneVolumes.replaceChildren(el("div", { class: "hint", text: `Couldn't load volumes: ${String(err.message || err)}` }));
        return;
      }
      render();
    }

    // ── Progress ──
    function onProgress(p) {
      if (p.phase === "start") {
        $("progress").style.display = "block";
        $("p-phase").textContent = p.legCount > 1 ? `Copying · ${p.legCount} legs` : "Copying";
        $("p-counts").textContent = `${p.totalFiles} files · ${formatBytes(p.totalBytes)}`;
      } else if (p.phase === "scanning") {
        $("progress").style.display = "block";
        $("p-phase").textContent = "Scanning source…";
      } else if (p.phase === "node-status") {
        const prev = nodeStatus.get(p.node.id) || {};
        nodeStatus.set(p.node.id, { ...prev, status: p.node.status, filesVerified: p.node.filesVerified });
        if (p.node.status === "verified") nodeStatus.get(p.node.id).percent = 100;
        render();
      } else if (p.phase === "bytes") {
        if (typeof p.percent === "number") $("p-bar").style.width = `${p.percent.toFixed(1)}%`;
        $("p-file").textContent = p.file || "";
        // Per-node bars: every node in this leg shares the leg's progress.
        for (const id of p.nodeIds || []) {
          const prev = nodeStatus.get(id) || {};
          nodeStatus.set(id, { ...prev, percent: p.percent });
        }
        render();
      } else if (p.phase === "verifying") {
        $("p-phase").textContent = "Verifying checksums…";
        $("p-file").textContent = p.file || "";
      } else if (p.phase === "source-released") {
        // The actual payoff of cascading: the card is free before the whole
        // chain finishes.
        sourceReleased = true;
        $("p-released").style.display = "block";
        $("p-released").textContent = "✓ Source verified — the card can be ejected now; remaining legs read from the local copy.";
        render();
      }
    }

    function renderSummary(s) {
      const box = $("summary");
      box.replaceChildren();
      box.style.display = "block";
      const good = s.allVerified;

      box.appendChild(el("div", { class: "head" }, [
        el("h3", { class: good ? "ok" : "bad", text: good ? "Copy verified" : "Copy finished with problems" }),
      ]));

      const stats = el("div", { class: "stats" });
      const stat = (k, v) => stats.appendChild(el("span", {}, [
        document.createTextNode(`${k} `), el("b", { text: v }),
      ]));
      stat("Files", `${s.totalFiles}`);
      stat("Verified", `${s.fileCopiesVerified}/${s.totalFileCopies}`);
      stat("Destinations", `${s.nodes.length}`);
      stat("Legs", `${s.legCount}`);
      stat("Data", formatBytes(s.copiedBytes));
      stat("Duration", s.durationMs < 1000 ? `${s.durationMs} ms` : `${(s.durationMs / 1000).toFixed(1)}s`);
      if (s.mismatches.length) stat("Mismatches", `${s.mismatches.length}`);
      if (s.errors.length) stat("Errors", `${s.errors.length}`);
      box.appendChild(stats);

      // Per-node outcome, so a partially-failed cascade is legible at a
      // glance rather than hidden behind one aggregate number.
      for (const n of s.nodes) {
        const parent = n.parentId ? s.nodes.find((x) => x.id === n.parentId) : null;
        box.appendChild(el("div", { class: "stats", style: "margin-top:4px" }, [
          el("span", { class: `dot ${n.status}`, style: "display:inline-block;margin-right:6px" }),
          el("span", { text: `${baseName(n.path)}${parent ? ` (from ${baseName(parent.path)})` : ""} — ${statusLabel(n.status)}` }),
        ]));
      }

      const problems = [...s.mismatches, ...s.errors];
      if (problems.length) {
        const ul = el("ul");
        for (const p of problems.slice(0, 8)) {
          ul.appendChild(el("li", {
            text: p.destHash !== undefined
              ? `${p.file} → ${baseName(p.destRoot)}: expected ${p.sourceHash}, got ${p.destHash ?? "—"}`
              : `${p.file ? p.file + " " : ""}${p.destRoot ? "→ " + baseName(p.destRoot) : ""}: ${p.error}`,
          }));
        }
        if (problems.length > 8) ul.appendChild(el("li", { text: `…and ${problems.length - 8} more` }));
        box.appendChild(ul);
      }

      box.appendChild(el("div", {
        class: `verdict ${good ? "ok" : "bad"}`,
        text: good
          ? "Every file was re-read from each destination and matched the source. Safe to wipe the card."
          : "Not every destination verified — do NOT wipe the source until this is resolved.",
      }));
    }

    async function startCopy() {
      if (copying || !sourcePath || !destNodes.length) return;
      copying = true;
      sourceReleased = false;
      nodeStatus = new Map();
      $("summary").style.display = "none";
      $("p-released").style.display = "none";
      $("p-bar").style.width = "0%";
      render();

      try {
        const summary = await window.freeframe.startCopy(
          sourcePath,
          destNodes.map((n) => ({ id: n.id, path: n.path, parentId: n.parentId }))
        );
        renderSummary(summary);
      } catch (err) {
        const box = $("summary");
        box.replaceChildren(
          el("div", { class: "head" }, [el("h3", { class: "bad", text: "Copy failed to start" })]),
          el("div", { class: "verdict bad", text: String(err.message || err) })
        );
        box.style.display = "block";
      } finally {
        copying = false;
        $("progress").style.display = "none";
        render();
      }
    }

    // ── Wiring ──
    paintStaticIcons();
    for (const b of document.querySelectorAll("#view-toggle button")) {
      b.addEventListener("click", () => { volumesView = b.dataset.view; render(); });
    }

    window.freeframe.onCopyProgress(onProgress);
    $("refresh").addEventListener("click", refresh);
    $("clear").addEventListener("click", clearAll);
    $("start").addEventListener("click", startCopy);
    for (const btn of document.querySelectorAll("[data-choose]")) {
      btn.addEventListener("click", async () => {
        const which = btn.dataset.choose;
        const folder = await pickFolder({
          title: which === "source" ? "Choose a source folder" : "Choose a destination folder",
        });
        if (!folder) return;
        // The general picker can land anywhere, so attribute the result to
        // whichever device it turned out to be on — that's what makes it
        // show up under "Recent on this device" later.
        const dev = deviceFor(folder);
        if (dev) {
          recentFolders[dev] = folder;
          window.freeframe.rememberFolder(dev, folder);
        }
        if (which === "source") setSource(folder);
        else addDest(folder, null);
      });
    }

    // ── Item 5: modal buttons ──
    $("modal-src").addEventListener("click", async () => {
      if (!modalState) return;
      const f = await pickFolder({ title: "Choose a source folder", device: modalState.volumePath });
      if (!f) return;
      modalState.src = f;
      updateModalChosen();
    });
    $("modal-dst").addEventListener("click", async () => {
      if (!modalState) return;
      const f = await pickFolder({ title: "Choose a destination folder", device: modalState.volumePath });
      if (!f) return;
      modalState.dst = f;
      updateModalChosen();
    });
    $("modal-cancel").addEventListener("click", () => {
      // Reverts only the assignment that caused the conflict, leaving the
      // pre-existing one alone — cancelling shouldn't undo work the user
      // didn't just do.
      const revert = modalState?.onCancel;
      closeModal();
      revert?.();
    });
    $("modal-done").addEventListener("click", () => {
      if (!modalState || !modalState.src || !modalState.dst) return;
      const root = modalState.volumePath;
      const { src, dst } = modalState;
      closeModal();
      // Replace the bare volume root on both sides with the chosen
      // subfolders. Done as a swap rather than an add so the root doesn't
      // linger in either role.
      if (sourcePath === root) sourcePath = src;
      const node = destNodes.find((n) => n.path === root);
      if (node) node.path = dst;
      else destNodes.push({ id: newId(), path: dst, parentId: null });
      pruneExtraFolder(root);
      render();
    });

    // ── Item 1: live volume detection ──
    // No polling — the main process watches /Volumes and pushes. The
    // renderer just re-lists, rather than trusting a diff computed
    // elsewhere.
    window.freeframe.onVolumesChanged(() => { refresh(); });

    window.freeframe.getRecentFolders().then((r) => { recentFolders = r || {}; }).catch(() => {});
    refresh();
  </script>
</body>
</html>
