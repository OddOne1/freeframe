     *   caller's `null`, silently promoting it out of the chain. Fixing
     *   only the matching half would have swapped a duplicated node for a
     *   quietly-dropped cascade — different symptom, same loss.
     */
    function addDest(p, parentId = undefined) {
      // Adding a destination disturbs nothing already running, so this is
      // deliberately ungated.
      if (destNodes.some((n) => n.path === p)) return;
      // Same refusal as setSource, from the other side.
      if (isProject(p) && p === sourcePath) { showProjectConflict(p); return; }
      // A project can't be a cascade parent: cascading re-reads the parent
      // *from disk* to prove what landed there, and there is no local disk
      // to re-read for an upload. Silently accepting it would produce a
      // chain that fails at run time.
      if (parentId && isProject(destNodes.find((n) => n.id === parentId)?.path || "")) return;

      // §73 — picking a folder on a drive that is ALREADY a destination
      // narrows that destination; it does not add a second leg beside it.
      // This lives HERE rather than at the call sites because §69 fixed one
      // of nine and the identical bug resurfaced through another two weeks
      // later. Any entry point added later inherits the rule by
      // construction instead of having to remember it.
      //
      // Source has no equivalent bug because `sourcePath` is one scalar, so
      // picking always replaces. Destinations are a list on purpose
      // (parallel copies are a real feature), which is why this narrows per
      // DEVICE rather than always replacing: a folder on a genuinely
      // different drive is still a new destination, unchanged.
      // `undefined` asks narrowingTarget the same question `null` does —
      // the sentinel only decides where the REPLACEMENT lands, not whether
      // there is something to replace.
      const narrowed = narrowingTarget(p, parentId === undefined ? null : parentId);
      const resolvedParentId = parentId === undefined
        ? (narrowed ? narrowed.parentId : null)
        : parentId;
      destNodes.push({ id: newId(), path: p, parentId: resolvedParentId });
      // Order matters: add first, then drop the old one, so a failure
      // between the two leaves the destination populated rather than empty.
      if (narrowed) removeDest(narrowed.path);
      // Symmetric with setSource: same conflict, same modal, whichever side
      // triggered it.
      if (p === sourcePath) {
        openDualRoleModal(p, () => { removeDest(p, true); render(); });
      }
      render();
    }

    /** A project on both sides of one job. Not the dual-role modal: that
     *  offers native subfolder pickers, which a project has no equivalent
     *  of, so it would dead-end. */
    function showProjectConflict(p) {
      const box = $("summary");
      box.replaceChildren(
        el("div", { class: "head" }, [el("h3", { class: "bad", text: "Same project on both sides" })]),
        el("div", {
          class: "verdict bad",
          text: `“${entryFor(p).name}” is already on the other side of this job. ` +
            `Pulling a project down and pushing back into the same project in one pass ` +
            `isn't supported — run it as two jobs, or pick a different project.`,
        })
      );
      box.style.display = "block";
    }
    /** Item 6 — a manually-picked folder that no longer holds any role has
     *  no reason to sit in the center column forever. Real mounted volumes
     *  are never pruned; they're there because they're mounted. */
    function pruneExtraFolder(p) {
      if (!p) return;
      if (volumes.some((v) => v.mountPoint === p)) return;  // a real volume
      if (sourcePath === p) return;
      if (destNodes.some((n) => n.path === p)) return;
      extraFolders = extraFolders.filter((f) => f !== p);
    }

    function removeDest(p, silent = false) {
      const node = destNodes.find((n) => n.path === p);
      if (!node) return;
      // Removing a parent would orphan its children into an invalid tree —
      // promote them to copy from the original source instead of silently
      // dropping their data.
      for (const child of destNodes) if (child.parentId === node.id) child.parentId = null;
      destNodes = destNodes.filter((n) => n.id !== node.id);
      pruneExtraFolder(p);
      if (!silent) render();
    }
    function cascadeFrom(childPath, parentId) {
      // Restructuring a chain mid-flight would change where a running leg
      // reads from, so both ends have to be idle.
      if (isBusy(childPath)) return;
      const child = destNodes.find((n) => n.path === childPath);
      if (!child) { addDest(childPath, parentId); return; }
      if (child.id === parentId) return;
      // v1 is single-chain: a node that already has children can't also
      // become a child, or the chain becomes a multi-level tree the UI
      // doesn't draw yet. The engine handles depth fine — this is a UI
      // limit, deliberately, and the guard says so.
      if (destNodes.some((n) => n.parentId === child.id)) return;
      child.parentId = parentId;
      render();
    }
    function clearAll() {
      // Clears everything idle and keeps whatever a job is still holding,
      // rather than refusing outright because something somewhere is busy.
      const busy = busyPaths();
      if (sourcePath && !busy.has(sourcePath)) { sourcePath = null; sourceFiles = null; }
      for (const n of [...destNodes]) if (!busy.has(n.path)) removeDest(n.path, true);
      // Per-node progress and the eject hint describe assignments that are
      // gone, so they only survive if something was actually kept back.
      if (!sourcePath && !destNodes.length) {
        nodeStatus = new Map();
        sourceReleased = false;
      }
      $("summary").style.display = "none";
      render();
    }

    // ── Item 3 + 6: folder picking, per-device and with recents ──

    /** Opens the native picker, optionally rooted inside `device`, and
     *  records the result as that device's recent folder. */
    async function pickFolder({ title, device = null, role = null }) {
      const folder = await window.freeframe.chooseFolder(title, device || undefined);
      if (!folder) return null;
      if (!extraFolders.includes(folder) && !volumes.some((v) => v.mountPoint === folder)) {
        extraFolders.push(folder);
      }
      // `role` is required to record a recent: a folder filed under the
      // wrong heading is worse than one not remembered at all.
      if (device && role) rememberRecent(device, role, folder);
      return folder;
    }

    /**
     * The source picker — folders *or* individual files (item 5).
     *
     * Separate from pickFolder because only a source can be a file: a
     * destination has to be a directory to write into. Applies the result
     * itself, since "one directory" and "several files" are different
     * assignments.
     */
    async function pickSource({ title, device = null }) {
      const res = await window.freeframe.chooseSource(title, device || undefined);
      if (!res || !res.paths || !res.paths.length) return null;
      applySourceSelection(res, device);
      return res;
    }

    /** Shared by the picker and the OS drop, so both behave identically. */
    function applySourceSelection(sel, device = null) {
      if (sel.kind === "dir") {
        const folder = sel.paths[0];
        if (!extraFolders.includes(folder) && !volumes.some((v) => v.mountPoint === folder)) {
          extraFolders.push(folder);
        }
        const dev = device || deviceFor(folder);
        if (dev) rememberRecent(dev, "source", folder);
        setSource(folder);
      } else {
        setSourceFiles(sel.paths);
      }
    }

    /** Recents for one device and one role, newest first. Keyed by the
     *  volume's own mountPoint, so one drive's history can't appear under
     *  another — that scoping was already right and is carried through
     *  unchanged; only the role split is new. */
    function recentsFor(device, role) {
      const entry = recentFolders[device];
      return (entry && entry[role]) || [];
    }

    /** Identity of a recent entry: a path for a drive, a folder id for a
     *  project selection (§24a). A project folder's display name can change
     *  without it being a different folder. */
    function recentKey(f) {
      return typeof f === "string" ? f : (f && f.id);
    }

    function rememberRecent(device, role, folder) {
      const entry = recentFolders[device] || (recentFolders[device] = {});
      const key = recentKey(folder);
      entry[role] = [folder, ...(entry[role] || []).filter((f) => recentKey(f) !== key)].slice(0, 5);
      window.freeframe.rememberFolder(device, role, folder);
    }

    function clearRecents(device, role) {
      if (recentFolders[device]) delete recentFolders[device][role];
      window.freeframe.clearRecentFolders(device, role);
    }

    // ── Item 2: in-project folder picker ──────────────────────────────────
    //
    // The project equivalent of "Choose folder here as Destination…". A
    // project used to always mean its root, because freeframeUpload's
    // folderId argument was hardcoded to null at the one call site — the
    // IPC and the bridge already carried it.
    //
    // Renderer-side only, deliberately: main.js's freeframe:folder-tree
    // handler and preload's freeframeFolderTree already existed and are
    // used unchanged.

    /** projectId → { id, name, path } for the folder that project reads
     *  from / writes into. Absent means the project root. */
    /**
     * Which folder inside a project each ROLE uses (§24a).
     *
     * `{ [projectId]: { source, destination } }` — the same device→role
     * shape `recentFolders` already uses for drives, rather than a second
     * keying convention. Previously one selection per project served both
     * roles, which meant choosing a pull folder silently moved where an
     * upload would land.
     */
    let projectFolder = {};
    let folderPickerState = null;

    function projectFolderFor(projectId, role) {
      const entry = projectFolder[projectId];
      return (entry && entry[role]) || null;
    }

    /**
     * Put a project INTO the role its folder was just chosen for (§24c).
     *
     * A drive's role submenu assigns the drive the moment a folder is
     * picked; a project's only remembered the folder, so picking one
     * changed the tile's caption and nothing else. Both of the project's
     * paths need this — the recents list (which goes through `apply`) and
     * the folder picker's Save button (which does not).
     *
     * setSource/addDest carry the same-project-both-sides guard already,
     * so routing through them composes rather than duplicating it.
     */
    function assignProjectRole(projectId, role) {
      const mountPoint = `freeframe://${projectId}`;
      if (role === "source") setSource(mountPoint);
      else addDest(mountPoint, null);
    }

    function setProjectFolder(projectId, role, selection) {
      const entry = projectFolder[projectId] || (projectFolder[projectId] = {});
      if (selection) entry[role] = selection;
      else delete entry[role];
      if (!entry.source && !entry.destination) delete projectFolder[projectId];
    }

    /** The value that actually reaches the API's nullable folder_id.
     *  "root" and "no selection" both mean null on the wire — sending the
     *  string "root" would 422. */
    function uploadFolderIdFor(projectId, role) {
      const sel = projectFolderFor(projectId, role);
      if (!sel || !sel.id || sel.id === "root") return null;
      return sel.id;
    }

    async function openProjectFolders(projectId, role) {
      // Changing where a project's files land while that project is an
      // active destination would move the target mid-upload.
      if (isBusy(`freeframe://${projectId}`)) return;
      const res = await window.freeframe.freeframeFolderTree(projectId);
      if (!res || !res.ok) {
        showFolderPicker(projectId, [], role, (res && res.error) || "Couldn't load folders.");
        return;
      }
      showFolderPicker(projectId, res.tree || [], role);
    }

    /** Split from the fetch above so the tree rendering can be exercised
     *  without a live server. */
    function showFolderPicker(projectId, tree, role = "destination", error = null) {
      const project = ffProjects.find((p) => p.id === projectId);
      const current = projectFolderFor(projectId, role);
      folderPickerState = {
        projectId,
        role,
        selected: current ? { ...current } : { id: "root", name: "Project root", path: "" },
      };

      // Which role is being chosen for, since the two are independent now.
      $("ffdir-title").textContent =
        `${project ? project.name : "Choose a folder"} — ${role === "source" ? "Source" : "Destination"} folder`;
      const host = $("ffdir-tree");
      host.replaceChildren();

      if (error) {
        host.appendChild(el("div", { class: "ffdir-error", text: error }));
      }

      // The root is a real, selectable row rather than an implicit default,
      // so "upload to the top level" is something you can actively choose
      // (and choose *back* to) rather than only the absence of a choice.
      host.appendChild(folderRow({ id: "root", name: "Project root", item_count: project ? project.asset_count : null }, 0, ""));

      const walk = (nodes, depth, prefix) => {
        for (const n of nodes || []) {
          const p = `${prefix}/${n.name}`;
          host.appendChild(folderRow(n, depth, p));
          if (n.children && n.children.length) walk(n.children, depth + 1, p);
        }
      };
      walk(tree, 1, "");

      if (!error && (!tree || tree.length === 0)) {
        host.appendChild(el("div", { class: "ffdir-empty", text: "This project has no folders — assets go to the root." }));
      }

      updateFolderPickerChosen();
      $("ffdir-backdrop").classList.add("open");
    }

    function folderRow(node, depth, pathLabel) {
      const isRoot = node.id === "root";
      const row = el("div", {
        class: "ffdir-row",
        dataset: { folderId: String(node.id), path: pathLabel },
        style: `padding-left:${8 + depth * 16}px`,
      });
      const glyph = icon(isRoot ? "freeframe" : "folder");
      glyph.classList.add("ffdir-glyph");
      row.appendChild(glyph);
      row.appendChild(el("span", { class: "ffdir-name", text: node.name }));
      if (node.item_count != null) {
        row.appendChild(el("span", { class: "ffdir-count", text: `${node.item_count}` }));
      }
      row.addEventListener("click", () => {
        if (!folderPickerState) return;
        folderPickerState.selected = { id: String(node.id), name: node.name, path: pathLabel };
        updateFolderPickerChosen();
      });
      return row;
    }

    function updateFolderPickerChosen() {
      if (!folderPickerState) return;
      const sel = folderPickerState.selected;
      for (const r of document.querySelectorAll("#ffdir-tree .ffdir-row")) {
        r.classList.toggle("selected", r.dataset.folderId === sel.id);
      }
      $("ffdir-chosen").textContent = sel.id === "root" ? "Project root" : sel.path || sel.name;
    }

    function closeFolderPicker() {
      folderPickerState = null;
      $("ffdir-backdrop").classList.remove("open");
    }

    /** The device a path belongs to, for recent-folder lookup: the volume
     *  whose mountPoint is the longest prefix of it. */
    /**
     * The volume a path lives on.
     *
     * A prefix match against the mount points handles every external,
     * removable and network volume. It does NOT handle the boot volume
     * (§59): it mounts at /Volumes/Macintosh HD, but user folders resolve
     * through APFS firmlinks to canonical /Users/... paths, which never
     * carry that prefix. So ~/Downloads matched nothing, deviceFor returned
     * null, volumesColumnEntries stopped filtering it out, and picking two
     * folders on the boot drive produced two extra standalone tiles instead
     * of outlining the one real drive.
     *
     * The fix is the fallback, not another prefix. Anything not under an
     * external mount point IS internal storage by definition on macOS, so
     * "externals need the match, internal is what's left" is the correct
     * framing — and it keeps working for a boot volume named something
     * other than "Macintosh HD", which a /Users special case would not.
     */
    function deviceFor(p) {
      let best = null;
      let internal = null;
      for (const v of volumes) {
        // classify() in volumes.js marks the boot volume `internal`.
        if (v.type === "internal" && !internal) internal = v.mountPoint;
        if (p === v.mountPoint || p.startsWith(v.mountPoint + "/")) {
          if (!best || v.mountPoint.length > best.length) best = v.mountPoint;
        }
      }
      // Still null when no internal volume was enumerated at all — a folder
      // with no resolvable parent keeps its own tile rather than vanishing,
      // which volumesColumnEntries' own comment already relies on.
      return best || internal;
    }

    // ── Item 5: dual-role conflict modal ──
    let modalState = null;

    function openDualRoleModal(volumePath, onCancel) {
      modalState = { volumePath, onCancel, src: null, dst: null };
      const name = entryFor(volumePath).name;
      const body = $("modal-body");
      body.replaceChildren(
        document.createTextNode("This volume is now both the source and a destination. Copying "),
        el("b", { text: name }),
        document.createTextNode(
          " into itself would recurse, so pick a subfolder for each role — a source folder to read from, and a separate destination folder to write into."
        )
      );
      $("modal-chosen").textContent = "";
      $("modal-done").disabled = true;
      $("modal-backdrop").classList.add("open");
    }

    function updateModalChosen() {
      if (!modalState) return;
      const bits = [];
      if (modalState.src) bits.push(`Source: ${modalState.src}`);
      if (modalState.dst) bits.push(`Destination: ${modalState.dst}`);
      $("modal-chosen").textContent = bits.join("   ·   ");
      // Both are required: resolving only one side leaves the volume root
      // still serving the other role, i.e. the same conflict.
      $("modal-done").disabled = !(modalState.src && modalState.dst);
    }

    function closeModal() {
      $("modal-backdrop").classList.remove("open");
      modalState = null;
    }

    // ── Drag (pointer-based, not HTML5 DnD) ──
    // HTML5 drag-and-drop can't be driven by synthetic events, which would
    // make the cascade interaction untestable, and it behaves inconsistently
    // in Electron. Pointer events give the same UX with full control over
    // the drop indicator — and are directly exercisable by the e2e test.
    let drag = null; // { path, fromRole }

    function beginDrag(e, path, fromRole) {
      // Only the cards a job is actually using are pinned (§22b).
      if (isBusy(path)) return;
      drag = { path, fromRole, moved: false };
      ghost.textContent = entryFor(path).name;
      ghost.style.display = "block";
      moveGhost(e.clientX, e.clientY);
      document.body.style.cursor = "grabbing";
      zoneSource.classList.add("drop-ready");
      zoneDest.classList.add("drop-ready");
      // Item 7: the middle column is a valid target (drop here to unassign),
      // so it needs the same affordance the other two already had.
      zoneVolumes.classList.add("drop-ready");
    }
    function moveGhost(x, y) {
      ghost.style.left = `${x + 12}px`;
      ghost.style.top = `${y + 12}px`;
    }
    function clearDropIndicators() {
      zoneSource.classList.remove("drop-active");
      zoneDest.classList.remove("drop-active");
      zoneVolumes.classList.remove("drop-active");
      for (const c of document.querySelectorAll(".cascade-target")) c.classList.remove("cascade-target");
    }
    /** What's under the cursor: a destination card (cascade), or a zone. */
    function dropTargetAt(x, y) {
      const stack = document.elementsFromPoint(x, y);
      for (const node of stack) {
        if (node.dataset && node.dataset.destId && drag && node.dataset.path !== drag.path) {
          return { kind: "cascade", parentId: node.dataset.destId, element: node };
        }
      }
      for (const node of stack) {
        if (node.dataset && node.dataset.zone) return { kind: "zone", zone: node.dataset.zone, element: node };
      }
      return null;
    }

    window.addEventListener("mousemove", (e) => {
      if (!drag) return;
      drag.moved = true;
      moveGhost(e.clientX, e.clientY);
      clearDropIndicators();
      const t = dropTargetAt(e.clientX, e.clientY);
      if (!t) return;
      if (t.kind === "cascade") t.element.classList.add("cascade-target");
      else t.element.classList.add("drop-active");
    });

    window.addEventListener("mouseup", (e) => {
      if (!drag) return;
      const t = dropTargetAt(e.clientX, e.clientY);
      const dragged = drag.path;
      const fromRole = drag.fromRole;
      drag = null;
      ghost.style.display = "none";
      document.body.style.cursor = "";
      zoneSource.classList.remove("drop-ready");
      zoneDest.classList.remove("drop-ready");
      zoneVolumes.classList.remove("drop-ready");
      clearDropIndicators();

      if (!t) return;
      if (t.kind === "cascade") {
        // Dropped onto an existing destination → cascading group.
        cascadeFrom(dragged, t.parentId);
      } else if (t.zone === "source") {
        setSource(dragged);
      } else if (t.zone === "volumes") {
        // Item 7: dragging an assigned card back to the middle unassigns it
        // — the drag equivalent of the context menu's Remove.
        if (fromRole === "source" && sourcePath === dragged) {
          sourcePath = null; sourceFiles = null;
          pruneExtraFolder(dragged);
          render();
        } else if (fromRole === "dest") {
          removeDest(dragged);
        }
      } else if (t.zone === "source" && isProject(dragged)) {
        // Silently ignored above; nothing to do.
      } else if (t.zone === "dest") {
        if (fromRole === "dest") {
          // Dragged out of a cascade and into open space → back to copying
          // from the original source.
          const n = destNodes.find((x) => x.path === dragged);
          if (n && n.parentId !== null) { n.parentId = null; render(); }
        } else {
          // §89 — INHERIT, for the same reason as the OS drop below: one
          // rule for every entry point is what stops this bug returning
          // through a fifth one. §73 already made this narrow; all that
          // changes is that the replacement keeps its place in the chain.
          addDest(dragged);
        }
      }
    });

    // ── Context menu (non-drag fallback) ──
    function openMenu(e, path, role) {
      e.preventDefault();
      // Never gated as a whole: this is the only route to Rename, and
      // freezing it during any job was what made a safe, cosmetic action
      // unreachable for the length of an offload (§22b). Individual
      // entries below disable themselves when their own path is busy.
      menu.replaceChildren();

      const addTo = (host, label, fn, disabled = false) =>
        host.appendChild(el("button", { text: label, disabled, onClick: () => { closeMenu(); fn(); } }));
      const add = (label, fn, disabled = false) => addTo(menu, label, fn, disabled);

      /**
       * A "Label ▸" row whose panel opens beside the menu. Returns the
       * panel to fill.
       *
       * Opens on hover (matching the reference) and on click, because
       * hover-only submenus are unusable with a trackpad at the edge of a
       * row and undrivable by anything but a mouse — the same reason every
       * drag action in this app also has a menu path.
       */
      const addSubmenu = (label) => {
        const wrap = el("div", { class: "has-sub" });
        const trigger = el("button", { class: "sub-trigger" }, [
          el("span", { text: label }),
        ]);
        trigger.appendChild(icon("chevronRight"));
        const panel = el("div", { class: "submenu" });
        wrap.appendChild(trigger);
        wrap.appendChild(panel);

        const open = () => {
          for (const p of menu.querySelectorAll(".submenu.open")) {
            if (p !== panel) p.classList.remove("open");
          }
          panel.classList.add("open");
          // Measured after it's visible — a display:none panel has no box.
          panel.classList.remove("flip");
          panel.style.top = "";
          // Flip to the left rather than run off the right edge.
          if (panel.getBoundingClientRect().right > window.innerWidth - 8) {
            panel.classList.add("flip");
          }
          // And pull it up rather than off the bottom. Nudged relative to
          // its default -4px offset, so it stays anchored near its trigger
          // instead of jumping to the top of the window.
          const over = panel.getBoundingClientRect().bottom - (window.innerHeight - 8);
          if (over > 0) panel.style.top = `${-4 - over}px`;
        };
        wrap.addEventListener("mouseenter", open);
        wrap.addEventListener("mouseleave", () => panel.classList.remove("open"));
        trigger.addEventListener("click", (ev) => { ev.stopPropagation(); open(); });
        menu.appendChild(wrap);
        return panel;
      };

      // Which roles this exact path already holds. Deliberately an exact
      // match, not deviceFor(): a drive that merely *contains* a source
      // subfolder is still freely assignable itself, and hiding its
      // actions would be wrong.
      const heldSource = sourcePath === path;
      const heldDest = destNodes.some((n) => n.path === path);

      // Item 1 — the opposite role's plain actions are hidden once a card
      // holds a role. They were fully enabled and simply noise: nobody
      // right-clicks the card they just made the source in order to read
      // three destination-flavoured entries.
      //
      // isProject() used to hard-disable "Set as Source". It no longer
      // does — copy-engine has a FreeFrame source provider.
      //
      // §59: the tile's OWN role is now removed rather than shown disabled.
      // A source-column tile is a source by definition, so "Set as Source"
      // there was a permanently-greyed row explaining a fact the column
      // already states.
      if (!heldDest && !heldSource) add("Set as Source", () => setSource(path));
      // §89 — INHERIT, though the spec did not classify this one. The tile
      // holds no role, but its DEVICE may already hold a destination, and
      // if that one is cascaded, forcing root here drops the chain exactly
      // the way the reported bug did. Never silently losing a cascade beats
      // the weaker reading that this is always "a brand new destination".
      if (!heldSource && !heldDest) add("Set as Destination", () => addDest(path));

      /**
       * "Source Folder ▸" / "Destination Folder ▸" — one submenu per role,
       * each holding Browse…, that role's own recents, and Clear Recents.
       *
       * Shared by drives and FreeFrame projects (§24a). Only `browse` and
       * how a recent entry is labelled differ between them; the structure
       * is the same, and keeping it the same is the point — a project used
       * to get one generic action that served both roles, so choosing a
       * pull folder silently moved where an upload would land.
       */
      const roleSubmenu = (roleKey, label, apply, opts = {}) => {
        const panel = addSubmenu(label);
        addTo(panel, "Browse…", opts.browse);

        const recents = recentsFor(opts.device || path, roleKey);
        if (recents.length) {
          panel.appendChild(el("div", { class: "sep" }));
          panel.appendChild(el("div", { class: "label", text: "Recent Folders:" }));
          for (const r of recents) {
            addTo(panel, opts.labelOf ? opts.labelOf(r) : r, () => apply(r));
          }
          panel.appendChild(el("div", { class: "sep" }));
          addTo(panel, "Clear Recents", () => clearRecents(opts.device || path, roleKey));
        }
      };

      // Item 2 — the project counterpart of the per-device folder pickers
      // below. Offered for a project whichever role it holds: the same
      // selection scopes an upload's target folder and a pull's source
      // folder.
      if (isProject(path)) {
        const projectId = projectIdOf(path);
        menu.appendChild(el("div", { class: "sep" }));

        const projectRole = (roleKey, label) => {
          const chosen = projectFolderFor(projectId, roleKey);
          roleSubmenu(
            roleKey,
            // The current selection is named on the trigger, so both roles
            // are readable without opening either submenu.
            chosen ? `${label} (${chosen.name})` : label,
            (folder) => {
              setProjectFolder(projectId, roleKey, folder);
              // §24c — and actually take the role, matching the drive
              // submenus rather than leaving projects a two-step.
              assignProjectRole(projectId, roleKey);
              render();
            },
            {
              device: path,
              browse: () => openProjectFolders(projectId, roleKey),
              // Recents here are folder selections, not paths.
              labelOf: (f) => (typeof f === "string" ? f : (f.path || f.name)),
            },
          );
        };

        // Both offered regardless of which role the project currently
        // holds: the two selections are independent, and one is usually
        // chosen before the project is assigned at all.
        projectRole("source", "Source Folder");
        projectRole("destination", "Destination Folder");

        // Clearing one role must not touch the other (§24a).
        for (const roleKey of ["source", "destination"]) {
          const chosen = projectFolderFor(projectId, roleKey);
          if (!chosen) continue;
          add(`Use the project root for ${roleKey === "source" ? "Source" : "Destination"}`, () => {
            setProjectFolder(projectId, roleKey, null);
            render();
          });
        }
      }

      // Item 3 — per-device pickers. The general header buttons stay (they
      // are the right tool for a plain folder-to-folder move), but they
      // can't say *which* drive a folder is on, which matters the moment
      // more than one card is being offloaded at once.
      const isVolume = volumes.some((v) => v.mountPoint === path);
      if (isVolume) {
        // Item 2 — "Source Folder ▸" / "Destination Folder ▸", each holding
        // Browse…, that role's own recents, and Clear Recents. This
        // replaces both the flat "Choose folder here as…" pair and the
        // separate shared "Recent on this device" section: a recent
        // belongs to a role, so it belongs in that role's submenu.
        menu.appendChild(el("div", { class: "sep" }));
        const driveOpts = (roleKey, apply) => ({
          browse: async () => {
            // The source panel also accepts individual files; a
            // destination must stay a directory to write into.
            if (roleKey === "source") {
              await pickSource({
                title: `Choose a source folder or files on ${entryFor(path).name}`,
                device: path,
              });
              return;
            }
            const f = await pickFolder({
              title: `Choose a destination folder on ${entryFor(path).name}`,
              device: path,
              role: roleKey,
            });
            if (f) apply(f);
          },
          // Shown relative to the drive, since the mount point is already
          // the thing you right-clicked.
          labelOf: (r) => r.replace(path, "").replace(/^\//, "") || r,
        });
        if (!heldDest) roleSubmenu("source", "Source Folder", (f) => setSource(f), driveOpts("source", (f) => setSource(f)));
        // §89 — INHERIT. This is offered on a tile that may already be
        // assigned, and choosing a folder here means "this device's
        // destination is that folder", not "start a new root destination".
        // Passing null here is what put a third, independent LUMIX → Desktop
        // beside an existing cascade on video.
        if (!heldSource) roleSubmenu("destination", "Destination Folder", (f) => addDest(f), driveOpts("destination", (f) => addDest(f)));

        // Item 1's judgement call: one explicit, distinctly-worded entry
        // for the same-volume-both-roles case, rather than relying on drag
        // alone. Kept because this app states the principle twice already —
        // every drag action has a menu path, since drag-only is a real
        // precision and accessibility problem — and this would otherwise
        // have been the one capability reachable by drag and nothing else.
        // One entry, below a separator, instead of the three redundant
        // opposite-role items it replaces.
        //
        // Both route through the existing conflict modal, which is what
        // makes the user pick a subfolder per role; a bare volume root on
        // both sides would copy a folder into itself.
        if (heldSource || heldDest) {
          menu.appendChild(el("div", { class: "sep" }));
          // §89 — EXPLICITLY ROOT, per the spec, and the one call site
          // where I think that is arguable: this tile is held as SOURCE, so
          // the spec reasons there is no destination on the device to
          // narrow. On a single big RAID used for both roles (§59's
          // role-both case) there can be, and if it is cascaded this
          // promotes it. Left as instructed rather than changed quietly.
          if (heldSource) add("Also use as Destination…", () => addDest(path, null));
          else add("Also use as Source…", () => setSource(path));
        }
      }

      // §59 — swap a tile's path in place, for the columns' own tiles.
      //
      // Only for plain folders/files/volumes: a FreeFrame project already
      // has "Source Folder ▸"/"Destination Folder ▸" from §24a/§24c, and a
      // second entry doing almost-the-same would be the ambiguity those
      // submenus exist to remove.
      //
      // Replaces in place rather than clear-then-pick: the old path is
      // dropped as part of taking the new one, so the column is never
      // briefly empty and Remove is not a prerequisite — which is what
      // makes removing Remove from destination tiles (#5) workable.
      if ((role === "source" || role === "dest") && !isProject(path)) {
        menu.appendChild(el("div", { class: "sep" }));
        add("Choose a different folder/file…", async () => {
          if (role === "source") {
            // Source accepts individual files too, so it goes through the
            // source picker rather than the folder one.
            const res = await pickSource({ title: "Choose a source folder or files" });
            // applySourceSelection has already set the new source; the old
            // entry only lingers as a picked-folder tile.
            if (res) { pruneExtraFolder(path); render(); }
            return;
          }
          const f = await pickFolder({ title: "Choose a destination folder" });
          if (!f) return;
          // Order matters: add first, then drop the old one, so a failure
          // between the two leaves the destination populated rather than
          // empty.
          // §89 — INHERIT. This IS narrowing the tile that was
          // right-clicked, so the replacement belongs wherever that tile
          // sat. removeDest below still promotes any CHILDREN of the old
          // node to root; that is removeDest's own long-standing rule
          // (§73 recorded and pinned it) and is unchanged here — the new
          // node has already taken the old one's parent slot, so nothing
          // is orphaned upward.
          addDest(f);
          removeDest(path);
          render();
        });
      }

      // "Cascade from…" — Hedge's own non-drag path, mirrored here for the
      // same accessibility reason the drag fallback exists at all.
      // Item 4 — never offered on the source card. Cascading is
      // destination-to-destination: a chain reads FROM a verified
      // destination, so "cascade from…" on the source is meaningless and
      // was appearing purely because this block had no role guard.
      const candidates = role === "source" ? [] : destNodes.filter(
        (n) => n.path !== path && n.parentId === null && !destNodes.some((c) => c.parentId === n.id)
      );
      if (candidates.length) {
        menu.appendChild(el("div", { class: "sep" }));
        menu.appendChild(el("div", { class: "label", text: "Cascade from…" }));
        for (const c of candidates) {
          add(`  ${entryFor(c.path).name}`, () => cascadeFrom(path, c.id));
        }
      }

      // §65b — the rename affordance is gone entirely: from the tile name,
      // from this menu, and as a modal. "Reset to real name" deliberately
      // stays, because a label set before that removal would otherwise be
      // permanent with nothing left able to clear it.
      if (displayNames[path]) {
        menu.appendChild(el("div", { class: "sep" }));
        add("Reset to real name", () => setDisplayName(path, ""));
      }

      // Item 1 — eject/disconnect. Only for real volumes (a picked folder
      // has nothing to eject), never for the internal drive, and never
      // mid-copy. The main process refuses internal independently.
      const vol = volumes.find((v) => v.mountPoint === path);
      if (vol && vol.type !== "internal") {
        menu.appendChild(el("div", { class: "sep" }));
        const isNetwork = vol.type === "network";
        const inUseBySource = isBusy(path);
        add(
          isNetwork ? "Disconnect" : "Eject",
          () => ejectVolume(vol),
          // Disabled during any copy; the source of an in-flight copy is
          // called out separately because that's the one people will
          // actually try to do.
          inUseBySource
        );
      }

      // §59: source only. A destination is swapped via "Choose a different
      // folder…" above rather than cleared to empty — the user's explicit
      // ask, and it removes the state where the Destinations column is
      // empty because someone reached for Remove meaning "change this".
      //
      // §85 — DELIBERATELY UNGATED, and it has been wrongly guarded with
      // isBusy() twice before. Do not add a third.
      //
      // A running job is independent of what Source/Destination currently
      // shows: this is the menu equivalent of dragging the card out, and it
      // is how sequential jobs are queued — assign, Start, immediately
      // reassign to the next card, Start again, while the first keeps
      // copying underneath. Clearing the tile of a running job is the
      // intended outcome, not a mistake to prevent. Eject above is a
      // different concern (do not physically unmount mid-transfer) and
      // stays gated.
      if (role === "source") {
        menu.appendChild(el("div", { class: "sep" }));
        add("Remove", () => {
          sourcePath = null; sourceFiles = null;
          pruneExtraFolder(path);
          render();
        });
      }

      menu.style.display = "block";
      menu.style.left = `${Math.min(e.clientX, window.innerWidth - 210)}px`;
      menu.style.top = `${Math.min(e.clientY, window.innerHeight - menu.offsetHeight - 10)}px`;
    }
    const closeMenu = () => { menu.style.display = "none"; };

    /**
     * §65b — the only remaining writer, and it only ever writes "".
     *
     * Setting a label is gone (see the tile name and the context menu);
     * CLEARING one is not, because a label stored before that removal
     * would otherwise be permanent. Reading stays too: the tiles and the
     * Settings hide-list both still show a stored override.
     */
    async function setDisplayName(mountPoint, name) {
      displayNames = await window.freeframe.setDisplayName(mountPoint, name);
      render();
    }

    /** Eject or disconnect, surfacing diskutil's own reason on failure —
     *  "volume in use" names the app to quit, which "eject failed" doesn't. */
    async function ejectVolume(vol) {
      const res = await window.freeframe.ejectVolume(vol.mountPoint);
      if (res && res.ok) {
        // No refresh here: the /Volumes watcher fires when the mount
        // actually disappears. Refreshing now would just race it.
        if (sourcePath === vol.mountPoint) { sourcePath = null; sourceFiles = null; }
        for (const n of destNodes.filter((n) => n.path === vol.mountPoint)) removeDest(n.path, true);
        render();
        return;
      }
      showEjectError(vol, res && res.error);
    }

    function showEjectError(vol, message) {
      const box = $("summary");
      box.replaceChildren(
        el("div", { class: "head" }, [
          el("h3", { class: "bad", text: `Couldn't eject ${vol.name}` }),
        ]),
        el("div", { class: "verdict bad", text: message || "diskutil reported no reason." })
      );
      box.style.display = "block";
    }
    window.addEventListener("mousedown", (e) => {
      if (!menu.contains(e.target)) closeMenu();
      const card = $("daily-card");
      if (card && !card.contains(e.target) && e.target !== $("daily-btn")
          && !$("daily-btn").contains(e.target)) closeDaily();
    });

    // ── Rendering ──
    function statusLabel(s) {
      return { pending: "Waiting", copying: "Copying", verifying: "Verifying", verified: "Verified", failed: "Failed", skipped: "Skipped" }[s] || "Ready";
    }

    /** Square tile — now the only card renderer (§22f). Structure mirrors
     *  apps/web's asset-card.tsx: media area with a centered icon tile,
     *  then a compact info block.
     *
     *  `role`/`node` are set when the tile sits in Sources or Destinations,
     *  which is what the list view used to be needed for: a destination has
     *  a status and a progress bar, a plain volume has neither. */
    function makeTile(entry, { role, node } = {}) {
      const st = node ? (nodeStatus.get(node.id) || {}) : {};
      const status = st.status || (node ? "pending" : null);

      // Roles are resolved through deviceFor, so a drive shows as source
      // and/or destination when a folder INSIDE it holds that role — the
      // whole point of this view: the highlight belongs on the drive you
      // have to keep plugged in, not on a subfolder of it.
      //
      // A tile that IS the assignment (role set) shows its own role
      // directly instead: it already sits in that column, and deriving it
      // would make a source folder's tile also claim its drive's roles.
      const derived = roleFor(entry.mountPoint);
      const isSource = role ? role === "source" : derived.isSource;
      const isDest = role ? role === "dest" : derived.isDest;
      const selfAssigned = role ? false : derived.selfAssigned;

      // A project gets apps/web's own card treatment — poster, or the
      // project's deterministic gradient — rather than the icon-in-a-box
      // used for drives. A drive has no artwork to show and the glyph is
      // the whole point; a project has one, and rendering a generic box
      // instead was the reason the FreeFrame side didn't look like
      // FreeFrame.
      const media = el("div", { class: "tile-media" });
      if (entry.kind === "freeframe") {
        const poster = mediaUrl(entry.posterUrl);
        if (poster) {
          const img = el("img", { class: "tile-poster" });
          img.alt = "";
          // §24b — an <img> is natively draggable with NO attribute set,
          // which is why grepping this file for `draggable` found nothing.
          // Pressing on the poster can therefore start the browser's own
          // image drag and swallow the pointer events this app's custom
          // drag system needs. Only project tiles have a poster, which
          // matches the report that dragging a PROJECT misbehaves while
          // drives are fine.
          //
          // Not proven to be the user's bug: synthetic mouse events cannot
          // trigger native drag (the same reason this app uses pointer
          // events at all), so no harness can demonstrate it either way.
          // Turned off regardless — nothing here ever wants a native image
          // drag, so this costs nothing and removes a real interception
          // path.
          img.draggable = false;
          // A dead/expired proxy token would otherwise leave a broken-image
          // glyph; fall back to the gradient the project would have had.
          img.addEventListener("error", () => {
            img.remove();
            media.style.backgroundImage = projectGradient(entry.projectId);
          });
          img.src = poster;
          media.appendChild(img);
        } else {
          media.style.backgroundImage = projectGradient(entry.projectId);
        }
        // Same bottom scrim project-card.tsx puts under its title, so the
        // badges stay legible over an arbitrary poster.
        media.appendChild(el("div", { class: "tile-scrim" }));
      } else {
        const iconTile = el("div", { class: "tile-icon" });
        iconTile.appendChild(icon(typeIcon(entry.type)));
        media.appendChild(iconTile);
      }
      // No Source/Dest text badge (§59): the coloured border says the same
      // thing, and the badge said it a second time on top of a poster.
      // Removed in every column, not just Volumes — a tile sitting IN the
      // Sources column labelled "Source" was the most redundant of the
      // three. The border colours themselves are untouched.
      media.appendChild(el("span", { class: "tile-badge", text: typeLabel(entry) }));


      // §65b — plain text now. It was click-to-rename since §22e; the
      // rename it opened only ever changed a label inside this app, and
      // reading as though it renamed the drive was worse than the
      // convenience was worth. The mousedown guard went with it, so the
      // name is part of the tile's drag target again rather than a hole
      // in the middle of it.
      const nameEl = el("div", { class: "tile-name", text: entry.name, title: entry.name });

      // §66 — computed first so the class can follow the content: only the
      // both-figures case needs two lines, and forcing every tile to wrap
      // would let a long mount point push the tile taller than its
      // neighbours in the same grid row.
      const metaText = entry.kind === "freeframe"
        ? ((entry.folderLabels && entry.folderLabels.length)
            ? entry.folderLabels.join(" · ")
            : `${entry.assetCount} asset${entry.assetCount === 1 ? "" : "s"}`)
        : entry.fileList
          ? entry.fileList
          : storageMeta(entry, role);

      const info = el("div", { class: "tile-info" }, [
        nameEl,
        el("div", {
          class: metaText.includes("\n") ? "tile-meta two-line" : "tile-meta",
          text: metaText,
          title: entry.mountPoint,
        }),
      ]);

      // Status and progress belong to an assigned destination only. This is
      // the part the list view carried and the grid did not, and the reason
      // both renderers existed at all.
      if (status) {
        info.appendChild(el("div", { class: "tile-status" }, [
          el("span", { class: `dot ${status}` }),
          el("span", { class: `status-text ${status}`, text: statusLabel(status) }),
        ]));
      }

      const tile = el("div", {
        // Role colouring applies only to the middle column: a tile already
        // sitting in Sources/Destinations carries its own badge and doesn't
        // need a second signal for the role it literally is.
        class: `tile${!role ? roleClass(entry.mountPoint) : ""}${selfAssigned ? " self-assigned" : ""}`,
        dataset: node
          ? { destId: node.id, path: entry.mountPoint, role: role || "" }
          : { path: entry.mountPoint, role: role || "" },
        title: entry.mountPoint,
      }, [media, info]);

      if (node) {
        const pct = st.percent != null ? st.percent : 0;
        tile.appendChild(el("div", { class: "node-bar" }, [
          el("div", { class: status === "verified" ? "verified" : status === "failed" ? "failed" : "", style: `width:${pct}%` }),
        ]));
      }

      // Visible menu trigger, over the media area where the reference
      // layout puts it. Additive: right-click still works.
      const tileKebab = el("button", {
        class: "tile-menu",
        title: "More…",
        onClick: (e) => {
          e.stopPropagation();
          const r = e.currentTarget.getBoundingClientRect();
          openMenu({ preventDefault() {}, clientX: r.right - 4, clientY: r.bottom + 2 }, entry.mountPoint, role);
        },
      });
      tileKebab.appendChild(icon("kebab"));
      tileKebab.addEventListener("mousedown", (e) => e.stopPropagation());
      media.appendChild(tileKebab);

      // §76 — a VISIBLE eject, since the existing one is a context-menu
      // entry nobody finds. Same `ejectVolume()` the menu calls: a second
      // implementation of the unmount-and-report path is how the two would
      // drift.
      //
      // Rendered only where there is something to eject: a real volume that
      // is not the boot drive. A project has no mount point, and main
      // refuses internal independently — a permanently-disabled button on
      // the machine's own disk would be UI for an action that can never
      // succeed.
      // Volumes column only (§76's wording), which `role` being unset is
      // exactly what identifies — makeTile draws all three columns. A tile
      // in the Source or Destination column holds a role by definition, so
      // its button could never be anything but disabled: a permanently dead
      // control on every assigned card.
      const ejectVol = role
        ? null
        : volumes.find((v) => v.mountPoint === entry.mountPoint);
      if (ejectVol && ejectVol.type !== "internal") {
        const isNetwork = ejectVol.type === "network";
        const verb = isNetwork ? "Disconnect" : "Eject";
        // The SAME signal the tile's own outline uses, via deviceFor —
        // not an exact path match. §76 shipped the exact match and it made
        // the two disagree: assigning a card's DCIM directory (the normal
        // case, not the drive root) outlined the tile as held while leaving
        // its eject button live. A button that contradicts the border drawn
        // around it is worse than either rule on its own.
        const heldAsSource = derived.isSource;
        const heldAsDest = derived.isDest;
        const busy = isBusy(entry.mountPoint);
        // §76 tightens this beyond the context menu's mid-copy-only gate.
        // ejectVolume() silently drops a held role on success; reaching that
        // from a button labelled "Eject" would unassign a card with no
        // warning, so this refuses instead and says what to do. The old menu
        // entry is deliberately left as it was.
        // Names what is actually held. §59's role-both case — two folders
        // on one RAID, one each way — is easy to reach now that the check
        // is device-level, and a title saying "Source" while a Destination
        // is also on the drive sends someone to remove the wrong one.
        // Hoisted out of the title rather than nested a third level deep.
        const heldRoles = heldAsSource && heldAsDest
          ? "Source and Destination roles"
          : heldAsSource ? "Source role" : "Destination role";
        const ejectBtn = el("button", {
          class: "tile-menu tile-eject",
          title: busy
            ? `${verb} unavailable while a job is using this drive`
            : heldAsSource || heldAsDest
              ? `Remove this drive's ${heldRoles} before ejecting`
              : verb,
          onClick: (e) => {
            e.stopPropagation();
            ejectVolume(ejectVol);
          },
        });
        ejectBtn.disabled = busy || heldAsSource || heldAsDest;
        ejectBtn.appendChild(icon("eject"));
        ejectBtn.addEventListener("mousedown", (e) => e.stopPropagation());
        media.appendChild(ejectBtn);
      }

      tile.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        beginDrag(e, entry.mountPoint, role);
      });
      tile.addEventListener("contextmenu", (e) => openMenu(e, entry.mountPoint, role));
      return tile;
    }

    function render() {
      // §22g — whichever source is assigned owns the values now, so rebind
      // before anything reads them.
      syncPresetValues();

      // Sources column
      zoneSource.replaceChildren();
      if (sourcePath) {
        zoneSource.appendChild(makeTile(entryFor(sourcePath), { role: "source" }));
        if (sourceReleased) {
          zoneSource.appendChild(el("div", {
            class: "hint",
            style: "color:var(--status-success);padding:6px 8px",
            text: "✓ Card can be ejected — the cascade now reads from the local copy.",
          }));
        }
      } else {
        zoneSource.appendChild(el("div", { class: "hint", text: "Drag a volume here, or right-click one → Set as Source." }));
      }

      // Center column — split into Drives and FreeFrame Projects (§22a).
      // Merged into one flat list, a cloud project and a physical disk were
      // separated only by a poster and a type word, which is not enough to
      // tell them apart at a glance when both are drop targets.
      zoneVolumes.replaceChildren();
      const entries = volumesColumnEntries();
      if (!entries.length) {
        zoneVolumes.appendChild(el("div", {
          class: "hint",
          text: "No volumes mounted. Use “Choose folder…” to pick one.",
        }));
      } else {
        const projects = entries.filter((e) => e.kind === "freeframe");
        const drives = entries.filter((e) => e.kind !== "freeframe");
        // Only labelled once there is something to tell apart: a machine
        // with no projects signed in should not grow a "Drives" heading
        // over the only list on screen.
        const labelled = projects.length > 0 && drives.length > 0;
        for (const [label, group] of [["Drives", drives], ["FreeFrame Projects", projects]]) {
          if (!group.length) continue;
          if (labelled) zoneVolumes.appendChild(el("div", { class: "zone-group", text: label }));
          const grid = el("div", { class: "grid-view" });
          for (const e of group) grid.appendChild(makeTile(withDisplayName(e)));
          zoneVolumes.appendChild(grid);
        }
      }

      // Destinations column, grouped into chains.
      zoneDest.replaceChildren();
      if (!destNodes.length) {
        zoneDest.appendChild(el("div", {
          class: "hint",
          text: "Drag volumes here to copy in parallel.\n\nDrop one onto another to cascade — it will copy from that destination instead of the card, once the first leg verifies.",
          style: "white-space:pre-line",
        }));
      } else {
        const roots = destNodes.filter((n) => n.parentId === null);
        for (const root of roots) {
          const chain = el("div", { class: "chain" });
          chain.appendChild(el("div", { class: "chain-from" }, [
            el("span", { text: sourcePath ? entryFor(sourcePath).name : "Source" }),
            el("span", { class: "arrow", text: "→" }),
            el("span", { text: entryFor(root.path).name }),
          ]));
          chain.appendChild(makeTile(entryFor(root.path), { role: "dest", node: root }));

          const kids = destNodes.filter((n) => n.parentId === root.id);
          for (const kid of kids) {
            const wrap = el("div", { class: "cascaded" });
            wrap.appendChild(el("div", { class: "chain-from" }, [
              el("span", { text: entryFor(root.path).name }),
              el("span", { class: "arrow", text: "→" }),
              el("span", { text: entryFor(kid.path).name }),
            ]));
            wrap.appendChild(makeTile(entryFor(kid.path), { role: "dest", node: kid }));
            chain.appendChild(wrap);
          }
          zoneDest.appendChild(chain);
        }
      }

      // §22b — a job running no longer disables Start. Only submitting
      // the SAME source/destination set twice is refused, which is the
      // thing that was actually worth preventing.
      // §22g — required fields are visible in the panel now, so an
      // unfilled one disables Start there rather than ambushing the user
      // with a modal after they press it.
      const ready = Boolean(sourcePath) && destNodes.length > 0
        && !currentJobPending() && missingRequired().length === 0;
      $("start").disabled = !ready;
      // §92 — two counts, not one mixed total.
      //
      // The old label read `(2, 1 cascaded)` for one direct copy plus one
      // hop, because destNodes.length counted both kinds together. The
      // leading number was the one people read, and it was answering a
      // question nobody asked: how many NODES, rather than how many drives
      // the card is being written to.
      //
      // A straight arrow means "also copy here" (parallel); the turning
      // arrow means "and then on from there" (a cascade hop). Each carries
      // its own number, and each is omitted when it has nothing to say.
      const parallel = destNodes.filter((n) => n.parentId === null).length;
      const cascades = destNodes.filter((n) => n.parentId !== null).length;
      setStartLabel(parallel, cascades);
      // Refresh only re-lists volumes; it never touches a job, so there is
      // no reason for a running copy to disable it.
      $("refresh").disabled = false;

      // §22g. Rebuilt from state each time so it cannot show one card's
      // values above another card's name.
      renderFieldsPanel();
    }

    // Which page the switcher is on (§60b). Declared here rather than beside
    // setPage() because refresh() reads it, and refresh() runs a long way
    // above that — a `let` further down is a temporal-dead-zone throw
    // waiting for the first volumes:changed event that arrives early.
    let currentPage = "offload";

    async function refresh() {
      // §64 — on the FreeFrame page, "Refresh" means the thing on screen.
      // Re-listing drives the page is not showing would look like a button
      // that does nothing.
      if (currentPage === "freeframe") {
        await window.freeframe.reloadWebView();
        return;
      }
      try {
        volumes = await window.freeframe.listVolumes();
      } catch (err) {
        volumes = [];
        zoneVolumes.replaceChildren(el("div", { class: "hint", text: `Couldn't load volumes: ${String(err.message || err)}` }));
        return;
      }
      render();
    }

    /**
     * §71 — the Progress column is gone; the Log row is the only live view.
     *
     * What survives here is the state the DESTINATION TILES read
     * (`nodeStatus`, `sourceReleased`), which nothing else computes. The
     * phase/percent/rate text this used to write into `#p-*` is already in
     * the Log row, rendered by panel.js from the queue snapshot — it was
     * being shown twice.
     */
    function onProgress(p) {
      if (p.phase === "node-status") {
        const prev = nodeStatus.get(p.node.id) || {};
        nodeStatus.set(p.node.id, { ...prev, status: p.node.status, filesVerified: p.node.filesVerified });
        if (p.node.status === "verified") nodeStatus.get(p.node.id).percent = 100;
        render();
      } else if (p.phase === "bytes") {
        // §85 — the ONE branch that must not call render().
        //
        // "bytes" fires many times a second for the whole length of a copy,
        // and render() does zoneVolumes.replaceChildren() — tearing down and
        // rebuilding every tile, every kebab and every eject button. A click
        // spans mousedown → render → click, so by the time `click` fired the
        // button it started on no longer existed: the context menu simply
        // did nothing, drag lost the element under the pointer, and the
        // column flashed, for the entire duration of every job.
        //
        // Nothing else on screen changes on a byte tick. Status, busy-state
        // and the source-released hint all arrive on their own events, and
        // free-space figures do not move per tick — so writing the width
        // straight onto the existing bar is the complete update, not a
        // partial one.
        let missing = false;
        for (const id of p.nodeIds || []) {
          const prev = nodeStatus.get(id) || {};
          nodeStatus.set(id, { ...prev, percent: p.percent });
          // querySelectorAll, not querySelector: a node id appearing twice
          // would otherwise leave the second bar frozen while the first
          // moved, which reads as a stalled destination.
          const bars = document.querySelectorAll(`[data-dest-id="${id}"] .node-bar > div`);
          if (!bars.length) { missing = true; continue; }
          for (const bar of bars) bar.style.width = `${p.percent != null ? p.percent : 0}%`;
        }
        // A tile that should have a bar and doesn't means the DOM and
        // nodeStatus have diverged — correctness over speed in the rare
        // case, speed in the overwhelmingly common one. Once per tick, not
        // once per missing id.
        if (missing) render();
      } else if (p.phase === "source-released") {
        // The actual payoff of cascading: the card is free before the whole
        // chain finishes. Surfaced on the Source tile itself (see render),
        // which is where someone about to pull the card is looking.
        sourceReleased = true;
        render();
      }
    }

    // §71 — renderSummary moved to panel.js, which renders it INTO the
    // finished job's own Log row. It used to fill a separate #summary card
    // below the Log, saying the same thing in a second place. #summary
    // itself survives for two unrelated notices (an eject failure, a
    // same-project conflict) that have nothing to do with a completed job.

    async function startCopy(allowFragileRename = false) {
      if (!sourcePath || !destNodes.length || currentJobPending()) return;

      // A required field left blank would otherwise render as a literal
      // {token} in a folder name on someone's drive — visible only hours
      // later. Main re-checks this; the dialog just means you find out
      // now, with the fields in front of you.
      if (missingRequired().length) {
        openValuesDialog((ok) => { if (ok) startCopy(); });
        const err = $("values-error");
        err.textContent = `Fill in ${missingRequired().join(", ")} — used in the folder name.`;
        // A Choice field's control is a <select>, not an <input> — matching
        // on the data attribute rather than the tag keeps both marked.
        for (const input of document.querySelectorAll("#values-grid [data-key]")) {
          const preset = activePreset();
          const field = preset && preset.fields.find((f) => f.key === input.dataset.key);
          if (field && field.required && !String(presetValues[field.key] ?? "").trim()) {
            input.classList.add("missing");
          }
        }
        return;
      }
      // §71 — claim the card number HERE, and only when this job actually
      // renames. Awaited before the payload is built below, so the job
      // carries the number it just claimed rather than a stale one.
      //
      // The predicate comes from main, which is the same function the
      // engine uses for its own §23d guard — asking rather than
      // re-deriving is what stops a job renaming without advancing the
      // counter, or advancing it without renaming.
      const naming = namingPayload();
      if (naming) {
        let renames = false;
        try {
          const r = await window.freeframe.renamesFiles(naming.fileTemplate, naming.disabledFields);
          renames = Boolean(r && r.renames);
        } catch { /* treated as "does not rename": never burn a number on an error */ }
        // §75 — claim once per source assignment. A retry after a failed
        // start reuses the number already claimed for this same card
        // rather than burning the next one.
        if (renames && claimedForPath !== sourcePath) {
          await claimSourceCounter();
          claimedForPath = sourcePath;
        }
      }

      copying = true;
      sourceReleased = false;
      nodeStatus = new Map();
      let blockedByFragileRename = null;
      $("summary").style.display = "none";
      render();

      try {
        const projectNodes = destNodes.filter((n) => isProject(n.path));
        const localNodes = destNodes.filter((n) => !isProject(n.path));

        let summary = null;
        if (localNodes.length) {
          // Item 3 — sourcePath may be `freeframe://<id>`, in which case
          // main builds a FreeFrame source provider for the engine instead
          // of reading a local directory. Everything downstream of that —
          // the single fan-out read, the hashing, the verify-by-re-reading
          // each destination from disk — is unchanged.
          summary = await window.freeframe.startCopy(
            isFileSet(sourcePath) ? null : sourcePath,
            localNodes.map((n) => ({ id: n.id, path: n.path, parentId: n.parentId })),
            algorithm,
            // Reading as a SOURCE, so the source-role folder (§24a).
            isProject(sourcePath) ? uploadFolderIdFor(projectIdOf(sourcePath), "source") : null,
            sourceFiles,
            namingPayload(),
            concurrencyMode,
            allowFragileRename
          );
          // §23d. Returned rather than thrown, because unlike a disk error
          // this is a question with an answer: nothing has been copied, and
          // the same job re-runs unchanged if the user accepts the risk.
          // Handled after the finally below, so the retry starts from a
          // fully reset state rather than nested inside this attempt.
          if (summary && summary.blocked === "RENAME_FRAGILE") {
            blockedByFragileRename = summary.message;
            return;
          }
          // §71 — no card to render: the job's own Log row now carries
          // this summary, from the queue snapshot main already broadcasts.
        }
        // Uploads run after the local legs, and one project at a time —
        // main refuses a second job while one is active. Sequential rather
        // than parallel is the honest first-pass behaviour.
        for (const node of projectNodes) {
          const projectId = projectIdOf(node.path);
          // Item 2 — was hardcoded null, which is why every upload landed
          // at the project root no matter what. The IPC handler and the
          // preload bridge already accepted and threaded this argument.
          const up = await window.freeframe.freeframeUpload(
            isFileSet(sourcePath) ? null : sourcePath,
            projectId,
            // Uploading INTO the project, so the destination-role folder.
            uploadFolderIdFor(projectId, "destination"),
            sourceFiles,
            concurrencyMode
          );
          void up;
        }
      } catch (err) {
        const box = $("summary");
        box.replaceChildren(
          el("div", { class: "head" }, [el("h3", { class: "bad", text: "Copy failed to start" })]),
          el("div", { class: "verdict bad", text: String(err.message || err) })
        );
        box.style.display = "block";
      } finally {
        copying = false;
        render();
      }

      // Outside the try/finally on purpose: the retry is a fresh attempt
      // from a fully reset state, not a continuation nested inside the one
      // that was refused.
      if (blockedByFragileRename) {
        if (await openFragileDialog(blockedByFragileRename)) await startCopy(true);
      }
    }

    // ── Wiring ──
    paintStaticIcons();

    /**
     * §65.12 — Copy & Verify left the header.
     *
     * Created once here and MOVED between the two zones rather than
     * rendered twice: every existing caller reaches it as $("start"), and
     * two elements sharing that id would hand half of them a stale one.
     */
    (() => {
      const btn = el("button", { class: "primary", text: "Copy & Verify" });
      btn.id = "start";
      btn.disabled = true;
      $("start-zone-columns").appendChild(btn);
    })();

    /**
     * §92 — the Copy & Verify label, as icon+count groups rather than text.
     *
     * A single destination with no cascade shows no count at all: "→ 1" is
     * noise, and the button already says what it does.
     *
     * The icons are decorative and marked so; the button carries an
     * aria-label spelling the same thing out, because two glyphs and two
     * digits announce as "Copy & Verify 2 1" otherwise — the old text at
     * least said "cascaded" out loud, and losing that to a prettier button
     * would be a straight downgrade for anyone not looking at it.
     */
    function setStartLabel(parallel, cascades) {
      const btn = $("start");
      if (!btn) return;
      const kids = [el("span", { text: "Copy & Verify" })];
      const group = (name, n, title) => {
        const wrap = el("span", { class: "start-count", title });
        wrap.setAttribute("aria-hidden", "true");
        wrap.appendChild(icon(name));
        wrap.appendChild(el("span", { text: String(n) }));
        return wrap;
      };
      // Only when there is more than one: a lone destination needs no
      // number beside a button that already names the action.
      if (parallel > 1) kids.push(group("arrowRight", parallel, "Destinations copied to in parallel"));
      if (cascades > 0) kids.push(group("cascade", cascades, "Cascade hops — copied on from another destination"));
      btn.replaceChildren(...kids);

      const parts = [];
      if (parallel > 1) parts.push(`${parallel} destinations`);
      if (cascades > 0) parts.push(`${cascades} cascaded ${cascades === 1 ? "hop" : "hops"}`);
      if (parts.length) btn.setAttribute("aria-label", `Copy & Verify — ${parts.join(", ")}`);
      else btn.removeAttribute("aria-label");
    }

    /** Put it under the card when the card is showing, under the columns
     *  when it is not. */
    function placeStartButton() {
      const btn = $("start");
      if (!btn) return;
      const showingCard = !$("fields-panel").classList.contains("hidden");
      document.body.classList.toggle("has-naming-card", showingCard);
      const zone = $(showingCard ? "start-zone-card" : "start-zone-columns");
      if (btn.parentElement !== zone) zone.appendChild(btn);
    }

    window.freeframe.onCopyProgress(onProgress);
    on("refresh", "click", refresh);
    // Wrapped, not passed directly: a click handler receives the MouseEvent
    // as its first argument, which would land in startCopy's
    // allowFragileRename parameter and quietly waive the §23d guard.
    on("start", "click", () => startCopy());
    for (const btn of document.querySelectorAll("[data-choose]")) {
      btn.addEventListener("click", async () => {
        const which = btn.dataset.choose;
        if (which === "source") {
          await pickSource({ title: "Choose a source folder or files" });
          return;
        }
        const folder = await pickFolder({
          title: "Choose a destination folder",
        });
        if (!folder) return;
        // The general picker can land anywhere, so attribute the result to
        // whichever device it turned out to be on — that's what makes it
        // show up in that drive's own submenu later. The role comes from
        // which button was pressed, so it files under the right heading.
        const dev = deviceFor(folder);
        if (dev) rememberRecent(dev, which === "source" ? "source" : "destination", folder);
        if (which === "source") { setSource(folder); return; }
        // §69's narrowing used to be written out here. It moved into
        // addDest() in §73, so this is a plain add again — two copies of one
        // rule is what let the bug survive at eight other call sites.
        //
        // §89 — INHERIT. This is the Destinations column's own "Choose
        // folder…", i.e. "the destination is that folder", so the
        // replacement keeps whatever place in the chain it replaced. It
        // reproduces §89's bug identically if left as an explicit root.
        addDest(folder);
      });
    }

    // ── Naming presets (§10 / §18b) ──────────────────────────────────────
    //
    // Local-only: presets live in a JSON file in userData, no login, no
    // server. Values feed the destination folder/file names at copy time
    // and nothing else — deliberately NOT written into FreeFrame's asset
    // metadata, which §10 scopes as a separate future addition.

    let presetStore = { presets: [], history: {}, sourceCounter: 1 };
    /** §22h — what the NEXT source assigned will be numbered. Mirrored from
     *  the store so the editable field has something to show before any
     *  source exists. */
    let nextSourceCounter = 1;
    let activePresetId = null;

    /**
     * §22g — per-transfer field values, kept PER SOURCE.
     *
     * Previously one global object, filled by a modal that only appeared
     * when a required field was blank at Start time. Keyed by source path
     * now so swapping cards back and forth restores what was typed for
     * each, the same way {sourcecounter} remembers its number per card.
     *
     * `disabled` is deliberately transient and never written back into the
     * saved preset: it answers "this transfer doesn't use that field",
     * which is a property of tonight's card, not of the preset.
     */
    const valuesBySource = new Map();   // path -> { values: {}, disabled: Set }

    /**
     * §80 — which card was looked at last, so a brand-NEW one can start
     * from its values instead of blank. A shoot runs one or two operators
     * and mostly one content type; retyping them per card is friction, and
     * a panel that reappears empty every time reads as broken rather than
     * fresh.
     */
    let lastActiveKey = null;

    function valuesEntry(path = sourcePath) {
      const key = path || "__none__";
      if (!valuesBySource.has(key)) {
        // A COPY, never the same object. An earlier syncPresetValues() let
        // one card's edits leak into another through a shared reference —
        // see the warning below — and seeding is exactly the shape that
        // reintroduces it. `disabled` is deliberately NOT carried over: it
        // says "this card doesn't use that field", which is a fact about
        // the card in front of you, not a habit.
        const seed = key !== "__none__" && lastActiveKey && valuesBySource.has(lastActiveKey)
          ? { ...valuesBySource.get(lastActiveKey).values }
          : {};
        valuesBySource.set(key, { values: seed, disabled: new Set() });
      }
      // AFTER the seed decision, or a new card would seed from itself.
      if (key !== "__none__") lastActiveKey = key;
      return valuesBySource.get(key);
    }

    // Points at the current source's values object — the same reference the
    // map holds, so a write through either is seen by both. Re-pointed by
    // syncPresetValues() at the top of every render, which is the one place
    // every state change already funnels through.
    //
    // A Proxy over the map was the first attempt and was a mistake: it has
    // to be `const`, and an existing harness assigns `presetValues = {...}`
    // directly. Clever, and it broke a test that had every right to keep
    // working.
    let presetValues = {};

    function syncPresetValues() {
      // Deliberately a plain re-point, with no attempt to adopt whatever
      // presetValues happened to be pointing at. The first version did
      // adopt, to keep a harness that assigns `presetValues = {...}`
      // working — and that quietly copied one card's values onto the next
      // card, which is the exact isolation this feature exists to provide.
      // A wholesale assignment still works for a caller that uses it and
      // then reads namingPayload() without an intervening render, which is
      // what that harness does.
      presetValues = valuesEntry().values;
    }

    /** Field keys switched off for the current source. */
    const disabledFields = () => [...valuesEntry().disabled];
    let editingPreset = null;   // the preset open in the editor

    const activePreset = () => presetStore.presets.find((p) => p.id === activePresetId) || null;

    /**
     * §62 — which preset the quick switch turns back ON.
     *
     * Naming "off" is the absence of a selection, not a flag on the preset,
     * so switching off has to remember what it switched off FROM or the
     * switch would be a one-way trip back into the menu — which is the
     * detour it exists to remove.
     */
    let lastPresetId = null;

    function updatePresetLabel() {
      const label = $("preset-label");
      if (!label) return;
      const p = activePreset();
      label.textContent = p ? p.name : "No naming preset";

      const sw = $("preset-toggle");
      if (sw) {
        // A preset that no longer exists is not something to offer turning
        // back on — reloadPresets() drops the active id in that case, and
        // the remembered one has to follow.
        if (lastPresetId && !presetStore.presets.some((x) => x.id === lastPresetId)) lastPresetId = null;
        const target = activePresetId || lastPresetId;
        // Nothing to switch between until a preset has been chosen once.
        sw.hidden = !target;
        sw.setAttribute("aria-pressed", activePresetId ? "true" : "false");
        sw.title = activePresetId
          ? "Turn naming off — keeps this preset selected"
          : `Turn naming back on (${(presetStore.presets.find((x) => x.id === lastPresetId) || {}).name || ""})`;
      }
      // §22g — the panel lists the ACTIVE preset's fields, so it has to
      // follow every path that changes which preset that is: picking one,
      // saving an edit, and deleting the active one.
      renderFieldsPanel();
      $("start").disabled = !(Boolean(sourcePath) && destNodes.length > 0
        && !currentJobPending() && missingRequired().length === 0);
    }

    /** The one place activePresetId changes, so the quick switch and the
     *  menu cannot drift on what "the last preset" was. */
    function setActivePreset(id) {
      if (id) lastPresetId = id;
      activePresetId = id;
      updatePresetLabel();
      render();
    }

    async function reloadPresets() {
      presetStore = (await window.freeframe.listPresets()) || { presets: [], history: {}, sourceCounter: 1 };
      nextSourceCounter = presetStore.sourceCounter || 1;
      if (activePresetId && !activePreset()) activePresetId = null;
      updatePresetLabel();
    }

    /**
     * §23d — a rename job whose source holds RAW/professional formats.
     *
     * Resolves true only after an explicit tick plus an explicit click. The
