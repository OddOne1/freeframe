<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FreeFrame Desktop (name TBD)</title>
  <!-- Canonical colors from packages/design-tokens, copied here by
       scripts/sync-tokens.js on predev/prebuild. Generated + gitignored —
       edit the package, not this copy. Same for icons.js (lucide@0.511.0,
       the exact release apps/web pins via lucide-react). -->
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="forms.css" />
  <script src="icons.js"></script>
  <script src="panel.js" defer></script>
  <style>
    /* Colors come from tokens.css (linked above). Only the aliases this
       renderer needs on top of the shared set live here — the shared file
       names its border tokens --border-primary/--border-secondary, and this
       UI referred to a single --border throughout. */
    :root {
      --border: var(--border-primary);
      --accent-2: var(--status-turquoise);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      display: flex; align-items: center; gap: 8px;
      /* §25b — wrap instead of clipping. There are no media queries in
         this file; these two rows are the only ones dense enough to
         overflow, and they did so by overlapping rather than reflowing.
         Matters even after §25a raises the window floor, because the
         fields and job panels can still squeeze them. */
      flex-wrap: wrap; row-gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
      flex-shrink: 0;
    }
    header h1 { font-size: 13px; font-weight: 600; margin: 0; }
    /* §60b — segmented page switcher, styled off the existing .mode pill
       so it reads as the same family of control rather than new chrome. */
    .pages { display: inline-flex; gap: 2px; -webkit-app-region: no-drag; }
    .page-tab {
      font: inherit; font-size: 12px; font-weight: 600;
      padding: 4px 10px; border-radius: 6px;
      border: 1px solid transparent; background: transparent;
      color: var(--muted); cursor: pointer;
    }
    .page-tab:hover { color: var(--fg); }
    .page-tab.active {
      background: var(--panel-2, rgba(255,255,255,.06));
      border-color: var(--border); color: var(--fg);
    }
    /* The embedded view is a native child of the window, not an element,
       so the Offload UI is hidden rather than covered — leaving it laid
       out underneath would keep it doing layout work forever. */
    body.page-web .workspace,
    body.page-web #jobs-panel,
    body.page-web #progress,
    /* §64 — these three are about a copy job, which the FreeFrame page has
       nothing to do with. Refresh stays, and reloads the embedded app
       instead. WORKFLOW CONSEQUENCE, stated rather than discovered: login
       lives in Settings now, so it is only reachable from the Offload page.
       That stays coherent because the FreeFrame tab is itself hidden while
       logged out — a logged-out user is always on Offload, where Settings
       is. The cost is a logged-in user on the FreeFrame page having to
       switch back to open Settings. */
    body.page-web #settings-btn,
    /* §65.12 moved Copy & Verify out of the header into #start-bar and
       deleted Clear outright, so the rule follows them. §70 removed
       #fields-show along with the panel's own Hide, so there is nothing
       left here to name for the naming card. */
    body.page-web #start-bar { display: none !important; }
    header .spacer { flex: 1; }
    header .mode {
      -webkit-app-region: no-drag;
      font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-tertiary); border: 1px solid var(--border);
      padding: 0 10px; height: 22px; border-radius: 999px;
      background: transparent; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
    }
    /* Item 7 — this was reading as a static status badge, so nobody tried
       clicking it. A caret plus a real hover state is what makes it look
       like a control rather than a label. */
    header .mode:hover {
      color: var(--text-primary);
      border-color: var(--text-secondary);
      background: var(--bg-elevated);
    }
    header .mode .caret svg { height: 11px; width: 11px; }
    header .mode .caret { display: inline-flex; opacity: .7; transition: transform 120ms; }
    header .mode:hover .caret { opacity: 1; }
    header .mode.open .caret { transform: rotate(180deg); }
    /* §62 — a one-click on/off for the active preset, so turning naming
       off for one card does not mean reopening the menu twice. Shares the
       pill's border with the button beside it rather than sitting as a
       second control with its own outline. */
    .mode-group {
      display: inline-flex; align-items: stretch;
      -webkit-app-region: no-drag;
    }
    .mode-group > .mode { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: none; }
    .mode-switch {
      display: inline-flex; align-items: center;
      padding: 0 6px; border: 1px solid var(--border);
      border-top-left-radius: 999px; border-bottom-left-radius: 999px;
      background: var(--bg-elevated); cursor: pointer;
    }
    .mode-switch:hover { background: var(--bg-hover); }
    .mode-switch .knob {
      width: 22px; height: 12px; border-radius: 999px;
      background: var(--bg-tertiary); border: 1px solid var(--border);
      position: relative; transition: background 120ms;
    }
    .mode-switch .knob::after {
      content: ""; position: absolute; top: 1px; left: 1px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-tertiary); transition: transform 120ms, background 120ms;
    }
    .mode-switch[aria-pressed="true"] .knob { background: var(--accent); border-color: var(--accent); }
    .mode-switch[aria-pressed="true"] .knob::after { transform: translateX(10px); background: #fff; }
    button {
      -webkit-app-region: no-drag;
      background: var(--bg-elevated); color: var(--text-primary);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-size: 12px; cursor: pointer; white-space: nowrap;
      font-family: inherit;
    }
    button:hover:not(:disabled) { background: var(--bg-hover); }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #08080b; font-weight: 600; }
    button.primary:hover:not(:disabled) { filter: brightness(1.12); }

    /* ── Three-zone layout: Sources | volumes | Destinations ── */
    /* minmax(0,1fr), not 1fr: a plain 1fr column refuses to shrink below its
       content's min-content width, so one long volume path was blowing the
       center column out and pushing the Destinations zone off-screen
       entirely. min-width:0 down the chain is the other half of the same
       fix — without it the flex children re-introduce the same floor. */
    /* Volumes (middle) takes 60% — it's where all real browsing happens,
       while Sources/Destinations are short lists of assigned items. */
    /* §22g — .columns keeps exactly three tracks; the fields panel is a
       sibling in this row, not a fourth grid column. Adding a track would
       have changed what §18a's ratio assertions measure. */
    .workspace { flex: 1; display: flex; min-height: 0; min-width: 0; }
    .workspace > .columns { flex: 1; }
    /* §65.10 — a gutter holding a content-sized card, not a column.
       It stays a flex sibling so it PUSHES the columns rather than
       overlaying them: the mockup this replaces was absolutely positioned
       and sat on top of the Destination drop zone, which is the one thing
       the spec rules out. Scrolls itself if the card outgrows the window. */
    #fields-panel {
      flex: 0 0 auto; display: flex; align-items: flex-start;
      min-height: 0; overflow-y: auto; padding: 10px;
      background: var(--bg-primary); border-left: 1px solid var(--border);
    }
    #fields-panel.hidden { display: none; }
    .naming-card {
      width: 246px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--bg-elevated); box-shadow: 0 8px 24px rgba(0,0,0,.28);
      overflow: hidden;
    }
    .naming-card-head {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .naming-card-head h2 { margin: 0; font-size: 11px; font-weight: 600; }
    .naming-card-head .spacer { flex: 1; }
    #fields-body { padding: 10px; }

    /* §65.12 — the start bar. The two zones mirror .workspace's own split,
       so "centred under the card" and "centred under the columns" are the
       same rule applied to whichever zone is showing. */
    #start-bar {
      display: flex; flex-shrink: 0; padding: 10px 0;
      border-top: 1px solid var(--border); background: var(--bg-primary);
    }
    .start-zone { display: flex; align-items: center; justify-content: center; }
    #start-zone-columns { flex: 1; }
    /* Matches the gutter's own width so the button lands under the card,
       not beside it. Hidden with the card, which puts the button back in
       the columns zone. */
    #start-zone-card { display: none; flex: 0 0 auto; width: 266px; }
    body.has-naming-card #start-zone-card { display: flex; }
    #start {
      height: 34px; padding: 0 22px; font-size: 13px; font-weight: 600;
    }
    .fv-empty { font-size: 11px; color: var(--text-tertiary); line-height: 1.6; }
    .fv-source {
      font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-tertiary); margin-bottom: 8px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .fv-field { margin-bottom: 10px; }
    .fv-label { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
    .fv-label span { font-size: 11px; color: var(--text-secondary); min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fv-label .req { color: var(--status-warning); flex-shrink: 0; }
    .fv-toggle { margin-left: auto; flex-shrink: 0; }
    .fv-field input[type="text"] {
      width: 100%; box-sizing: border-box; height: 28px; border-radius: 6px;
      padding: 0 8px; font-size: 12px; font-family: inherit;
      background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .fv-field.off input[type="text"] { opacity: .4; }
    .fv-field input.missing { border-color: var(--status-error); }
    /* §65.3 — Choice fields render as a select, with an "Other…" input
       revealed beside that field alone rather than in a shared area. */
    .fv-control { display: flex; flex-direction: column; gap: 4px; }
    .fv-select, .fv-other {
      height: 28px; border-radius: 6px; padding: 0 8px; width: 100%;
      box-sizing: border-box; font-size: 12px; font-family: inherit;
      background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .fv-select.missing, .fv-other.missing { border-color: var(--status-error); }
    .fv-control input[type="text"] {
      height: 28px; border-radius: 6px; padding: 0 8px; width: 100%;
      box-sizing: border-box; font-size: 12px; font-family: inherit;
      background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .fv-note { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
    .fv-preview {
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
      font-family: ui-monospace, monospace; font-size: 10px;
      color: var(--text-tertiary); word-break: break-all; line-height: 1.5;
    }
    .fv-preview.bad { color: var(--status-error); }
    /* §65.4/.11 — the card's own footer: the number this card renders as,
       and the only Clear button left in the app. */
    .fv-counter {
      display: flex; align-items: center; gap: 8px;
      margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border);
    }
    .fv-counter label { font-size: 11px; color: var(--text-secondary); flex: 1; }
    .fv-counter input {
      width: 72px; height: 26px; border-radius: 6px; padding: 0 8px;
      font-size: 12px; font-family: inherit; box-sizing: border-box;
      background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-primary);
    }
    /* §78 — same footer family as .fv-counter above; only the control
       widths differ, since a date needs more room than a card number. */
    .fv-date { border-top: none; padding-top: 0; margin-top: 6px; }
    /* §81 — .fv-counter is display:flex, so hiding needs its own rule: the
       only .hidden in this file is scoped to #fields-panel, and a bare
       class toggle would have been silently inert. */
    .fv-counter.hidden { display: none; }
    .fv-date input { width: 130px; }
    .fv-date button {
      height: 26px; padding: 0 10px; border-radius: 6px;
      font-size: 12px; font-family: inherit; cursor: pointer;
      background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-primary);
    }
    .fv-date button:hover { background: var(--bg-hover); }
    .fv-date button:disabled { opacity: .38; cursor: default; }
    .fv-date button:disabled:hover { background: var(--bg-secondary); }
    .fv-clear-row { display: flex; justify-content: flex-end; margin-top: 8px; }

    .columns { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) minmax(0,3fr) minmax(0,1fr); gap: 1px; background: var(--border); min-height: 0; }
    .col { background: var(--bg-primary); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .col-head {
      display: flex; align-items: center; gap: 6px;
      /* §25b, deviating from the brief on this one row, deliberately.
         Adding flex-wrap here was tried and reverted: flex breaks lines
         using items' CONTENT-based sizes before any shrink applies, so the
         title's ellipsis cannot prevent a wrap — the Destinations button
         dropped to a second line, that header became 56.5px against its
         neighbours' 41px, and the three border-bottoms stopped lining up.
         That alignment has its own test and its own history (§22f).

         The reported symptom was controls clipping and overlapping, and
         that is fixed instead by letting the TITLE ellipsize (below) while
         the button keeps its full width. The top header still wraps — it
         has no such alignment constraint. */
      padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .col-head h2 {
      margin: 0; font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em; color: var(--text-secondary);
      /* Gives way before the controls do, so a narrow column ellipsizes its
         title rather than pushing "Choose folder…" onto a second line and
         knocking its header out of line with the other two. */
      min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .col-head .spacer { flex: 1; }
    /* Item 2 — both header controls pinned to one explicit height.
       Previously the "Choose folder…" button landed at ~21px (11px font +
       3px padding + 1px border) while the Volumes column's .view-toggle
       came to ~24px (a 14px icon + 3px button padding + 2px wrapper
       padding). Same row, different tallest child, so the border-bottom
       under Volumes sat ~3px lower than under the other two columns.
       Pinning beats keeping two padding sums coincidentally equal. */
    /* 41px, not 40: the other two columns' 24px buttons plus padding and
       the border come to 41, and after §22f the Volumes header has no
       control of its own to match them. Pinning to the taller of the two
       keeps the three border-bottoms on one line. */
    /* min-height, not height: a wrapped second row has to be able to
       grow past the pinned floor rather than be cut off. */
    .col-head { min-height: 41px; }
    /* Never squeezed or clipped: the title gives way instead. */
    .col-head button { padding: 0 7px; font-size: 11px; height: 24px; flex-shrink: 0; }
    .col-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px; min-width: 0; }

    /* Item 4 — overlay scrollbars.
       The default Chromium bar is a solid light track that fights the dark
       theme. This is the macOS overlay convention: nothing visible until
       you're actually in the scrolling area. No JS needed for "only when
       there's overflow" — overflow-y:auto already handles that; the :hover
       rule handles "only when you're looking at it". */
    .col-body::-webkit-scrollbar { width: 10px; }
    .col-body::-webkit-scrollbar-track { background: transparent; }
    .col-body::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 999px;
      /* Transparent border + background-clip is what makes the visible
         thumb narrower than the hit area — a 4px-wide bar you can't grab
         is worse than no bar. */
      border: 3px solid transparent;
      background-clip: content-box;
      transition: background-color 150ms;
    }
    .col-body:hover::-webkit-scrollbar-thumb { background-color: rgba(148, 148, 158, .45); }
    .col-body:hover::-webkit-scrollbar-thumb:hover { background-color: rgba(148, 148, 158, .75); }
    .col-body::-webkit-scrollbar-corner { background: transparent; }

    .zone { min-height: 100%; border-radius: 8px; }
    /* Drop affordance while a drag is in flight. */
    .zone.drop-ready { outline: 1px dashed var(--border); outline-offset: -4px; }
    .zone.drop-active { outline: 2px solid var(--accent); outline-offset: -4px; background: rgba(91,141,239,.06); }
    /* Item 6 — a drop coming from Finder rather than from inside the app.
       Same affordance as drop-active deliberately: to the user it's the
       same gesture, and two different highlights for "you may drop here"
       would be noise. */
    .zone.os-drop { outline: 2px solid var(--accent); outline-offset: -4px; background: rgba(91,141,239,.06); }

    .hint { color: var(--text-tertiary); font-size: 11px; text-align: center; padding: 20px 8px; line-height: 1.5; }

    /* ── Cards ── */
    .card {
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--bg-elevated); padding: 8px 10px; margin-bottom: 8px;
      cursor: grab;
    }
    .card:active { cursor: grabbing; }
    .card .name { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .meta { color: var(--text-secondary); font-size: 10px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card .row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    /* List view gets the same three states — the screenshot was grid, but
       the gap is identical here. A left rail rather than a full border,
       since these rows are wide and a full outline reads as noise. */
    .card.role-src { border-left: 3px solid var(--accent); }
    .card.role-dst { border-left: 3px solid var(--status-turquoise); }
    .card.role-both {
      border-left: 3px solid transparent;
      background-image:
        linear-gradient(var(--bg-elevated), var(--bg-elevated)),
        linear-gradient(180deg, var(--accent) 0 50%, var(--status-turquoise) 50% 100%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
    }
    .card.self-assigned { opacity: .45; }

    /* A destination card that will accept a cascade drop — the blue outline
       from Hedge's documented mechanic. */
    .card.cascade-target { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(91,141,239,.14); }

    .badge {
      font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      padding: 2px 6px; border-radius: 999px; border: 1px solid var(--border);
      color: var(--text-secondary); flex-shrink: 0;
    }
    .badge.src { color: var(--accent); border-color: var(--accent); background: rgba(91,141,239,.12); }
    .badge.dst { color: var(--accent-2); border-color: var(--accent-2); background: rgba(45,212,191,.12); }

    /* Status dot — semantic colors, mapped per the roadmap. */
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--status-draft); }
    .dot.copying, .dot.verifying { background: var(--status-info); animation: pulse 1s ease-in-out infinite; }
    .dot.verified { background: var(--status-success); }
    .dot.failed { background: var(--status-error); }
    .dot.skipped { background: var(--status-warning); }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }

    .status-text { font-size: 10px; color: var(--text-secondary); }
    .status-text.verified { color: var(--status-success); }
    .status-text.failed { color: var(--status-error); }
    .status-text.skipped { color: var(--status-warning); }
    .status-text.copying, .status-text.verifying { color: var(--status-info); }

    /* ── Cascade chain rendering ── */
    .chain { margin-bottom: 10px; }
    .chain-from {
      display: flex; align-items: center; gap: 6px;
      font-size: 10px; color: var(--text-tertiary); padding: 0 2px 4px;
    }
    .arrow { color: var(--accent); font-size: 13px; line-height: 1; }
    /* §92 — the two count groups on Copy & Verify. Inherit the button's
       colour rather than picking their own: on .primary's accent ground,
       an accent-coloured icon would vanish. */
    .start-count {
      display: inline-flex; align-items: center; gap: 3px;
      margin-left: 8px; font-variant-numeric: tabular-nums;
    }
    .start-count svg { height: 13px; width: 13px; }
    .cascaded { margin-left: 18px; border-left: 2px solid var(--accent); padding-left: 10px; position: relative; }
    .cascaded::before {
      content: "↳"; position: absolute; left: -10px; top: 6px;
      color: var(--accent); font-size: 12px;
    }

    /* Per-node progress bar inside a card. */
    .node-bar { height: 3px; border-radius: 999px; background: var(--bg-primary); overflow: hidden; margin-top: 6px; }
    .node-bar > div { height: 100%; width: 0%; background: var(--status-info); transition: width 120ms linear; }
    .node-bar > div.verified { background: var(--status-success); }
    .node-bar > div.failed { background: var(--status-error); }

    /* ── Square (grid) view for the Volumes column ──
       Deliberately matched to apps/web/components/projects/asset-card.tsx
       rather than approximated, so a desktop tile and a web asset tile read
       as the same component family:
         group flex flex-col rounded-lg overflow-hidden
         transition-all duration-150 cursor-pointer
         border-2 border-transparent hover:border-border-focus
         (selected → border-accent bg-accent/5 shadow-lg shadow-accent/10)
         image area: aspect-[16/10] bg-bg-tertiary, centered fallback tile
                     h-14 w-14 rounded-2xl bg-bg-hover text-text-secondary
                     with a h-7 w-7 icon
         info: px-2 pt-2 pb-1.5, gap-1, title text-sm font-medium leading-tight
       Tailwind values translated to plain CSS: rounded-lg = 8px,
       rounded-2xl = 16px, border-2 = 2px, h-14 = 56px, h-7 = 28px,
       text-sm = 14px, px-2 = 8px, pt-2 = 8px, pb-1.5 = 6px, gap-1 = 4px. */
    .grid-view {
      display: grid;
      /* 118px, not 150px: this column is only ~300px wide, and two 150px
         tracks plus the gap overflow it — auto-fill then collapses to a
         single full-width tile whose 16:10 media area is enormous. At 118px
         two tiles fit comfortably with room for the gap. */
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 10px;
      align-content: start;
    }
    .tile {
      display: flex; flex-direction: column;
      border-radius: 8px; overflow: hidden;
      border: 2px solid transparent;
      transition: all 150ms;
      cursor: grab;
      background: transparent;
    }
    .tile:hover { border-color: var(--border-focus); }
    .tile:active { cursor: grabbing; }
    /* Role-specific highlight. The border says WHICH role, so a drive
       holding a source subfolder and a destination subfolder is
       distinguishable at a glance rather than just "involved somehow".
       Blue = source (unchanged from before), turquoise = destination
       (same token .tile-role.dst already uses for its badge). */
    .tile.role-src {
      border-color: var(--accent);
      background: rgba(91, 141, 239, .05);
      box-shadow: 0 10px 15px -3px rgba(91,141,239,.10), 0 4px 6px -4px rgba(91,141,239,.10);
    }
    .tile.role-dst {
      border-color: var(--status-turquoise);
      background: rgba(45, 212, 191, .05);
      box-shadow: 0 10px 15px -3px rgba(45,212,191,.10), 0 4px 6px -4px rgba(45,212,191,.10);
    }
    /* Both roles on one drive — barrier-tape diagonal stripes (§59), not
       the half-and-half split this used to be: a two-colour split reads as
       one border that changed its mind halfway, while a repeating stripe
       reads as "both at once" at a glance.

       Still the two-layer background trick, NOT `border-image` — which the
       original spec suggested and which does work for stripes, but
       DISABLES border-radius outright, squaring off the corners of a tile
       whose whole visual language is 8px rounded. Painting into the border
       box and masking the interior with a padding-box layer keeps the
       radius, and swapping the gradient for a repeating one was the only
       change needed. */
    .tile.role-both {
      border-color: transparent;
      background-image:
        linear-gradient(var(--bg-primary), var(--bg-primary)),
        repeating-linear-gradient(
          135deg,
          var(--accent) 0 8px,
          var(--status-turquoise) 8px 16px
        );
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 10px 15px -3px rgba(91,141,239,.10), 0 4px 6px -4px rgba(45,212,191,.10);
    }
    /* Dimming still means "this exact path is placed somewhere", which is
       now distinct from "a folder inside it is" — the drive itself stays
       assignable in the latter case, so it shouldn't look spent. */
    .tile.self-assigned { opacity: .55; }
    /* Same blue-outline cascade affordance the list cards use. */
    .tile.cascade-target { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 6px rgba(91,141,239,.14); }

    .tile-media {
      position: relative; width: 100%;
      aspect-ratio: 16 / 10;
      /* Capped because the Sources and Destinations columns are narrow but
         not 118px narrow (§22f): one tile spanning a ~200px column would
         otherwise get a ~125px-tall poster and push its own name out of
         sight. The cap is above what a Volumes-column tile ever reaches, so
         the grid is unaffected. */
      max-height: 96px;
      background: var(--bg-tertiary);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .tile-icon {
      height: 56px; width: 56px;
      border-radius: 16px;
      background: var(--bg-hover);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      transition: transform 200ms;
    }
    .tile:hover .tile-icon { transform: scale(1.02); }
    /* Two classes, not one: the generic `.icon svg { 14px }` rule below has
       equal specificity and is defined later, so a plain `.tile-icon svg`
       loses to it and these render at half size (asset-card.tsx's fallback
       glyph is h-7 w-7 = 28px). */
    .tile-icon .icon svg { height: 28px; width: 28px; }

    /* Project artwork fills the media box the way apps/web's project card
       does — object-cover, not contain: a letterboxed poster with bars
       either side reads as a broken image, not as artwork. */
    .tile-poster {
      width: 100%; height: 100%; object-fit: cover; display: block;
      /* §24b — belt and braces alongside img.draggable = false. */
      -webkit-user-drag: none; user-select: none;
    }
    /* Same bottom scrim project-card.tsx layers under its title. Here it
       keeps the type badge readable over an arbitrary poster rather than
       carrying text itself. */
    .tile-scrim {
      position: absolute; inset-inline: 0; bottom: 0; height: 60%;
      background: linear-gradient(to top, rgba(0,0,0,.70), rgba(0,0,0,.30) 45%, transparent);
      pointer-events: none;
    }

    /* Bottom-right, not top-right: the kebab trigger added in the last
       pass sits top-right and was overlapping this badge, clipping every
       type label to "NETWO▮" / "REMOVAB▮". */
    .tile-badge {
      position: absolute; bottom: 8px; right: 8px;
      border-radius: 4px;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(4px);
      padding: 2px 6px;
      font-size: 9px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: rgba(255,255,255,.85);
    }
    /* .tile-roles / .tile-role are gone with §59 — the border is the whole
       signal now. Kept out rather than left unused so a future reader does
       not resurrect the badge by finding a class that still styles. */

    .tile-info { display: flex; flex-direction: column; gap: 4px; padding: 8px 8px 6px; }
    .tile-name {
      font-size: 14px; font-weight: 500; color: var(--text-primary);
      line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tile-meta { font-size: 10px; color: var(--text-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* §66 — the unassigned tile shows BOTH figures, and the pair does not
       fit on one line in the Volumes column, whose tiles are capped at
       118px (§22f). Measured: ~29 characters wanting ~150px of a 111px
       box, so it ellipsised away the free figure entirely. Two lines
       rather than a shorter, vaguer wording: the tile has the vertical
       room, and "used"/"free" are the words that make the numbers mean
       anything. */
    .tile-meta.two-line { white-space: pre-line; line-height: 1.35; }
    /* §22e — the name is a control now, so it has to look like one on
       hover. Without this it reads as plain text and nobody clicks it. */
    /* §22f — a destination tile carries what only the list view used to:
       its status, and the progress bar underneath. */
    .tile-status { display: flex; align-items: center; gap: 5px; }
    /* Section headings in the Volumes column (§22a). */
    .zone-group {
      font-size: 10px; text-transform: uppercase; letter-spacing: .05em;
      color: var(--text-tertiary); padding: 2px 2px 4px;
    }
    .zone-group:not(:first-child) { margin-top: 12px; }

    /* View toggle in the Volumes column header. */
    .view-toggle { display: flex; align-items: center; gap: 2px; background: var(--bg-tertiary); border-radius: 6px; padding: 2px; height: 24px; }
    .view-toggle button {
      border: none; background: transparent; padding: 0 6px; border-radius: 4px;
      color: var(--text-tertiary); display: flex; align-items: center; height: 20px;
    }
    .view-toggle button.active { background: var(--bg-elevated); color: var(--text-primary); }
    .view-toggle button svg { height: 14px; width: 14px; }

    /* Inline icons in list rows / buttons. */
    .icon { display: inline-flex; align-items: center; justify-content: center; }
    .icon svg { height: 14px; width: 14px; }
    .icon.sm svg { height: 12px; width: 12px; }
    .card-grip { color: var(--text-tertiary); flex-shrink: 0; opacity: .5; }
    .card:hover .card-grip { opacity: 1; }

    /* ── Drag ghost ── */
    #ghost {
      position: fixed; pointer-events: none; z-index: 999;
      background: var(--bg-elevated); border: 1px solid var(--accent);
      border-radius: 8px; padding: 6px 10px; font-size: 12px; font-weight: 600;
      opacity: .95; box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none;
    }

    /* ── Item 5: dual-role conflict modal ── */
    .field { margin-bottom: 10px; }
    .field label {
      display: block; font-size: 10px; text-transform: uppercase;
      letter-spacing: .05em; color: var(--text-tertiary); margin-bottom: 4px;
    }
    .field input {
      width: 100%; height: 30px; border-radius: 6px; padding: 0 9px;
      background: var(--bg-secondary); border: 1px solid var(--border);
      color: var(--text-primary); font-size: 12px; font-family: inherit;
    }
    .field input:focus { outline: none; border-color: var(--border-focus); }
    .ff-error { font-size: 11px; color: var(--status-error); min-height: 14px; margin-bottom: 8px; }

    /* ── Item 2: in-project folder picker ── */
    #ffdir-backdrop {
      position: fixed; inset: 0; z-index: 1100; display: none;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    #ffdir-backdrop.open { display: flex; }
    .ffdir-modal { width: 420px; max-width: calc(100vw - 40px); }
    .ffdir-tree {
      max-height: 300px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg-secondary);
      padding: 4px 0; margin: 10px 0 8px;
    }
    .ffdir-row {
      display: flex; align-items: center; gap: 8px;
      padding-top: 5px; padding-bottom: 5px; padding-right: 10px;
      font-size: 12px; color: var(--text-primary);
      cursor: default; user-select: none;
    }
    .ffdir-row:hover { background: var(--bg-hover); }
    .ffdir-row.selected { background: var(--accent-muted); }
    .ffdir-row.selected .ffdir-name { color: var(--text-primary); font-weight: 500; }
    .ffdir-glyph { color: var(--text-tertiary); flex-shrink: 0; }
    .ffdir-row.selected .ffdir-glyph { color: var(--accent); }
    .ffdir-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* tabular-nums so the counts form a straight column rather than
       jittering with digit width. */
    .ffdir-count {
      font-size: 10px; color: var(--text-tertiary);
      font-variant-numeric: tabular-nums; flex-shrink: 0;
    }
    .ffdir-empty, .ffdir-error { padding: 10px; font-size: 11px; color: var(--text-tertiary); }
    .ffdir-error { color: var(--status-error); }
    .ffdir-chosen { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; }
    .ffdir-chosen span { color: var(--text-primary); }

    /* ── Naming presets (§10 / §18b) ── */

    /* Item 3 — persistent per-card menu trigger. Right-click still works;
       this makes the same menu discoverable without knowing it's there. */
    .card-menu, .tile-menu {
      -webkit-app-region: no-drag;
      background: transparent; border: none; padding: 0;
      width: 20px; height: 20px; border-radius: 5px;
      color: var(--text-tertiary);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; cursor: pointer;
    }
    .card-menu:hover, .tile-menu:hover { background: var(--bg-hover); color: var(--text-primary); }
    .card-menu svg, .tile-menu svg { height: 14px; width: 14px; }
    .tile-menu {
      position: absolute; top: 6px; right: 6px; z-index: 2;
      background: rgba(0,0,0,.55); color: rgba(255,255,255,.85);
      backdrop-filter: blur(4px);
    }
    .tile-menu:hover { background: rgba(0,0,0,.8); color: #fff; }

    /* §76 — eject, top-LEFT, deliberately the same chip as the kebab in the
       opposite corner rather than a new visual idea. Shares .tile-menu's
       rules above; only the corner differs. */
    .tile-eject { left: 6px; right: auto; }
    /* Disabled means "not now", not "not a thing" — it stays legible and
       keeps its tooltip, which is the only place the reason is written. */
    .tile-eject:disabled { opacity: .38; cursor: not-allowed; }
    .tile-eject:disabled:hover { background: rgba(0,0,0,.55); color: rgba(255,255,255,.85); }

    /* Algorithm picker — a menu, not a bare <select>, because each option
       carries a paragraph of explanation. Somebody choosing between MD5,
       SHA-1, xxHash and C4 from four names alone will just pick the first
       one or whatever they've heard of. */
    /* .ff-backdrop carries no styles -- every backdrop in this file is
       styled by id. Matching that rather than introducing a shared class
       only this one would use. */
    #values-backdrop {
      position: fixed; inset: 0; z-index: 1100; display: none;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    #values-backdrop.open { display: flex; }
    /* §23d. Same shape as the values backdrop above; styled by id and
       toggled with .open, matching every other modal in this file. Without
       its own rule it would inherit nothing and sit permanently on screen. */
    #fragile-backdrop {
      position: fixed; inset: 0; z-index: 1200; display: none;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    #fragile-backdrop.open { display: flex; }
    /* Its own rule, not the shared class: .ff-backdrop carries no styles,
       and a backdrop relying on it alone sits permanently over the app with
       nothing thrown (§23d's own finding). */
    .progress-rate { font-size: 11px; color: var(--text-tertiary); margin-top: 2px; }
    /* ── Docked job panel (§18c) ── */
    #jobs-tab {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 12px; border-top: 1px solid var(--border);
      background: var(--bg-secondary); flex-shrink: 0; font-size: 11px;
    }
    #jobs-tab .spacer { flex: 1; }
    #jobs-tab button {
      border: none; background: transparent; color: var(--text-tertiary);
      font-family: inherit; font-size: 11px; padding: 2px 6px; border-radius: 4px;
    }
    #jobs-tab button:hover { background: var(--bg-hover); color: var(--text-primary); }
    #jobs-toggle { color: var(--text-primary); font-weight: 500; display: flex; align-items: center; gap: 5px; }
    /* Drag handle on the panel's top edge. Sits outside #jobs-panel on
       purpose — the panel scrolls, and a handle inside it would scroll
       away the moment there were enough rows to want to resize for. */
    #jobs-resize {
      display: none; flex-shrink: 0; height: 7px; cursor: ns-resize;
      border-top: 1px solid var(--border); background: var(--bg-secondary);
    }
    #jobs-resize.open { display: block; }
    #jobs-resize::after {
      content: ""; display: block; width: 34px; height: 3px; margin: 2px auto 0;
      border-radius: 999px; background: var(--border-primary);
    }
    #jobs-resize:hover::after, #jobs-resize.dragging::after { background: var(--accent); }
    /* No text selection anywhere while dragging the splitter. */
    body.resizing-jobs, body.resizing-jobs * { user-select: none !important; cursor: ns-resize !important; }

    #jobs-panel {
      display: none; flex-shrink: 0;
      border-top: 1px solid var(--border); background: var(--bg-secondary);
      overflow-y: auto; height: 180px;
    }
    #jobs-panel.open { display: block; }
    /* §71 — one column. §65.14 put Progress beside the Log, and in use
       they showed the same run twice: the Log's own row already carries a
       bar, a rate and an ETA. The Log is the only live view now. */
    #jobs-cols { display: block; min-height: 0; }
    #jobs-log-col { min-width: 0; }
    /* The handle replaces the panel's own top border when it's showing. */
    #jobs-resize.open + #jobs-panel { border-top: none; }
    #jobs-detached-note {
      display: none; padding: 10px 12px; font-size: 11px; color: var(--text-tertiary);
    }
    #jobs-panel.detached #jobs-list { display: none; }
    #jobs-panel.detached #jobs-detached-note { display: block; }

    #modal-backdrop {
      position: fixed; inset: 0; z-index: 1100; display: none;
      background: rgba(0,0,0,.55); backdrop-filter: blur(2px);
      align-items: center; justify-content: center;
    }
    #modal-backdrop.open { display: flex; }
    .modal {
      width: 420px; max-width: calc(100vw - 40px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 18px;
      box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }
    .modal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .modal-head .icon svg { height: 18px; width: 18px; }
    .modal-head .icon { color: var(--status-warning); }
    .modal h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .modal p { margin: 0 0 14px; font-size: 12px; color: var(--text-secondary); line-height: 1.5; }
    .modal p b { color: var(--text-primary); font-weight: 600; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; }
    .modal-actions .row2 { display: flex; gap: 8px; }
    .modal-actions .row2 button { flex: 1; justify-content: center; }
    .modal-actions button { display: flex; align-items: center; gap: 6px; }
    .modal-chosen { font-size: 11px; color: var(--status-success); }

    /* ── Context menu (non-drag fallback) ── */
    #menu {
      position: fixed; z-index: 1000; display: none;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px; min-width: 190px;
      box-shadow: 0 12px 32px rgba(0,0,0,.6);
    }
    #menu button {
      display: block; width: 100%; text-align: left; border: none;
      background: transparent; padding: 6px 10px; font-size: 12px; border-radius: 5px;
    }
    #menu button:hover:not(:disabled) { background: var(--bg-hover); }
    #menu .sep { height: 1px; background: var(--border); margin: 4px 0; }
    #menu .label { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-tertiary); padding: 5px 10px 3px; }

    /* §72 — the daily overview card. Same positioning family as #menu
       (fixed, anchored under its button), just wider and with structure
       inside instead of a list of actions. */
    #daily-card {
      position: fixed; z-index: 1000; display: none;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 10px; width: 460px; max-width: calc(100vw - 24px);
      box-shadow: 0 16px 40px rgba(0,0,0,.6); overflow: hidden;
    }
    #daily-card.open { display: block; }
    .dov-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); }
    .dov-title { display: flex; align-items: baseline; gap: 8px; }
    .dov-title h3 { margin: 0; font-size: 13px; font-weight: 600; }
    .dov-title .spacer { flex: 1; }
    .dov-sub { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
    /* Amber, matching the app's own reset/caution treatment rather than
       --status-error: this clears a view, it does not delete footage. */
    .dov-reset {
      border: 1px solid var(--status-warning); background: transparent;
      color: var(--status-warning); font-family: inherit; font-size: 10px;
      height: 22px; padding: 0 8px; border-radius: 6px; cursor: pointer;
    }
    .dov-reset:hover { background: var(--status-warning); color: #1a1a1a; }
    .dov-stats {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .dov-stat .k { font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-tertiary); }
    .dov-stat .v { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .dov-list { max-height: 260px; overflow-y: auto; }
    .dov-row {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 12px; font-size: 11px; border-bottom: 1px solid var(--border);
    }
    .dov-row:last-child { border-bottom: none; }
    .dov-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
    .dov-badge {
      font-size: 9px; padding: 1px 5px; border-radius: 999px; flex-shrink: 0;
      color: var(--text-tertiary); border: 1px solid var(--border);
    }
    .dov-num { color: var(--text-secondary); flex-shrink: 0; font-variant-numeric: tabular-nums; }
    .dov-ok { color: var(--status-success); flex-shrink: 0; }
    .dov-bad { color: var(--status-error); flex-shrink: 0; }
    .dov-empty { padding: 16px 12px; font-size: 11px; color: var(--text-tertiary); text-align: center; }
    .dov-foot {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-top: 1px solid var(--border); background: var(--bg-secondary);
    }
    .dov-foot .spacer { flex: 1; }
    .dov-hint { font-size: 10px; color: var(--text-tertiary); }

    /* ── Submenus ("Source Folder ▸" / "Destination Folder ▸") ── */
    #menu .has-sub { position: relative; }
    /* The trigger is a row, not a plain label: the caret has to sit hard
       right regardless of how long the label is. */
    #menu .sub-trigger { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #menu .has-sub:hover > .sub-trigger { background: var(--bg-hover); }
    #menu .sub-trigger .icon { color: var(--text-tertiary); }
    #menu .submenu {
      position: absolute; top: -4px; left: 100%;
      display: none; z-index: 1001;
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px; min-width: 190px; max-width: 280px;
      box-shadow: 0 12px 32px rgba(0,0,0,.6);
    }
    #menu .submenu.open { display: block; }
    /* Flipped to the other side when it would leave the window — applied
       from JS, which is the only place the measurement exists. */
    #menu .submenu.flip { left: auto; right: 100%; }
    /* Long folder names shouldn't widen the panel indefinitely. */
    #menu .submenu button { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Footer: progress + summary ── */
    footer { border-top: 1px solid var(--border); background: var(--bg-secondary); flex-shrink: 0; }
    .progress { padding: 10px 14px; display: none; }
    .progress-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; margin-bottom: 6px; }
    .bar { height: 5px; border-radius: 999px; background: var(--bg-primary); overflow: hidden; }
    .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 120ms linear; }
    .progress-file { color: var(--text-tertiary); font-size: 10px; margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .released {
      margin-top: 6px; font-size: 11px; color: var(--status-success);
      display: none;
    }

    .summary { padding: 10px 14px; display: none; max-height: 210px; overflow-y: auto; }
    .summary .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .summary h3 { margin: 0; font-size: 13px; }
    .summary h3.ok { color: var(--status-success); }
    .summary h3.bad { color: var(--status-error); }
    .summary .stats { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 11px; color: var(--text-secondary); }
    .summary .stats b { color: var(--text-primary); font-weight: 600; }
    .summary ul { margin: 6px 0 0; padding-left: 16px; font-size: 10px; color: var(--status-error); }
    .summary .verdict { margin-top: 8px; font-size: 11px; }
    .verdict.ok { color: var(--status-success); }
    .verdict.bad { color: var(--status-error); }
    /* An upload that completed but is not verified — genuinely neither
       green nor red, and the palette already has a word for that. */
    .verdict.warn { color: var(--status-warning); }
  </style>
</head>
<body>
  <header>
    <!-- §60b — page switcher. Lives in the header because the header is
         the one strip the embedded web view is told not to cover; a
         switcher anywhere else would be underneath it and unreachable. -->
    <div class="pages" id="pages" role="tablist" aria-label="Page">
      <button class="page-tab active" id="page-offload" role="tab" aria-selected="true">Offload</button>
      <button class="page-tab" id="page-freeframe" role="tab" aria-selected="false" hidden>FreeFrame</button>
    </div>
    <!-- Naming preset (§10 / §18b). Sits beside the checksum pill because

  </header>

  <div class="workspace">
  <div class="columns">

  <!-- §22g — per-transfer values for the active preset's custom fields.

  <!-- Modelled on apps/web's actual sign-in screen (app/(auth)/layout.tsx

  <!-- §23d. Shown when a rename job's source holds formats whose clip name
       is referenced from inside the file or a card-level index. Not a

       break and decides, per job. -->

  <!-- §58. Same shape as every other modal in this file: an id-specific
       backdrop rule (the shared .ff-backdrop class carries no styles — see
       the note above), .open to show it. -->

  <div id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <span class="icon" data-icon="warning"></span>

      </div>
      <p id="modal-body"></p>
      <div class="modal-actions">
        <div class="row2">
          <button id="modal-src">Choose Source Folder…</button>
          <button id="modal-dst">Choose Destination Folder…</button>
        </div>
        <div id="modal-chosen" class="modal-chosen"></div>
        <div class="row2">
          <button id="modal-cancel">Cancel</button>
          <button id="modal-done" class="primary" disabled>Done</button>
        </div>

  <div id="ghost"></div>
  <div id="menu"></div>
  <!-- §72 — a dropdown anchored under its button, not a window: this is a
       glance at today, and a BrowserWindow would make it a destination. -->
  <div id="daily-card"></div>

  <script>
    // No Node access here (contextIsolation + sandbox: true in main.js) —
    // window.freeframe is the only thing preload.js exposes.

    const $ = (id) => document.getElementById(id);

    /**
     * Attach a listener by element id, tolerating a missing element.
     *
     * This exists because of a real outage, not defensively-in-general:
     * a bare `getElementById("account").addEventListener(...)` was
     * written against a button
     * that wasn't in the markup. That throws on null, and because it sat
     * in top-level script code every statement after it — the login
     * modal's wiring, the algorithm picker, and the bootstrap refresh()
     * at the very end — never ran. One typo blanked the whole app on
     * launch. A missing element should cost you that one control, not
     * everything below it.
     */
    function on(id, event, handler, opts) {
      const node = $(id);
      if (!node) {
        console.error(`[wiring] #${id} is missing — "${event}" not attached. ` +
          `Everything else stays wired.`);
        return false;
      }
      node.addEventListener(event, handler, opts);
      return true;
    }

    /** Run an init step in isolation, so one failure can't cascade into
     *  the next. Same reasoning as `on` above. */
    function initStep(name, fn) {
      try { fn(); } catch (err) { console.error(`[init] ${name} failed:`, err); }
    }
    const zoneSource = $("zone-source");
    const zoneVolumes = $("zone-volumes");
    const zoneDest = $("zone-dest");
    const ghost = $("ghost");
    const menu = $("menu");

    // ── State ──
    let volumes = [];            // from volumes:list
    let extraFolders = [];       // added via Choose folder…
    let sourcePath = null;
    // Item 5 — when the source is individually-chosen files rather than a
    // directory, this holds them and `sourcePath` holds a synthetic
    // `fileset://` key so everything that indexes state by path (cards,
    // drag, menus, role highlighting) keeps working untouched. A SINGLE
    // file needs none of this: its own path is a perfectly good key, and
    // the engine treats a file path as a one-file set.
    let sourceFiles = null;
    /** Destination tree. parentId null = copies from the original source;
     *  a parentId = cascades from that node. Same shape the engine takes,
     *  so nothing has to be translated at the IPC boundary. */
    let destNodes = [];          // [{ id, path, parentId, status, copiedBytes }]
    /** Latest job-queue snapshot from main. Declared here rather than with
     *  the panel code because busyPaths() below reads it, and that governs
     *  the whole three-column UI, not just the panel. */
    let jobSnapshot = [];

    // True while THIS window is awaiting a job it started, purely so the
    // legacy single-job progress footer knows to show itself. It is
    // deliberately NOT a UI lock any more (§22b) — see busyPaths below.
    let copying = false;

    /**
     * Which specific paths a running or queued job is holding (§22b).
     *
     * `copying` used to gate almost every mutation in this file, so any job
     * anywhere froze the entire UI — including the context menu, the only
     * route to Rename. That contradicted the queue built in §18c, which
     * exists precisely so unrelated jobs can run at once.
     *
     * The queue's own snapshot is the source of truth. Deriving from it
     * rather than tracking a second, parallel "busy" set is what stops the
     * two disagreeing about what is in use.
     *
     * Queued jobs count, not just running ones: a queued job has already
     * been told which paths it will read and write, and pulling one out
     * from under it means it starts later against something that moved.
     */
    function busyPaths() {
      const set = new Set();
      for (const j of jobSnapshot) {
        if (j.status !== "running" && j.status !== "queued") continue;
        if (j.sourcePath) set.add(j.sourcePath);
        for (const p of j.destPaths || []) set.add(p);
      }
      return set;
    }

    function isBusy(p) {
      return Boolean(p) && busyPaths().has(p);
    }

    /** Is the exact job now configured already running or queued? Used
     *  instead of a global flag so Start blocks a duplicate submission
     *  without blocking a different one. */
    function currentJobPending() {
      const dests = destNodes.map((n) => n.path).sort().join("|");
      return jobSnapshot.some((j) =>
        (j.status === "running" || j.status === "queued") &&
        j.sourcePath === sourcePath &&
        [...(j.destPaths || [])].sort().join("|") === dests);
    }
    let nodeStatus = new Map();  // id -> { status, copiedBytes, filesVerified }
    let sourceReleased = false;

    /** FreeFrame session + projects. Projects appear in the centre column
     *  alongside physical drives and are usable as destinations. Using one
     *  as a SOURCE is deliberately out of scope for this pass — the roadmap
     *  only ever specified upload-as-destination, and nothing here can read
     *  files back down. */
    let ffStatus = { loggedIn: false, user: null, baseUrl: "" };
    let ffProjects = [];

    /** Item 8 — cosmetic label overrides, keyed by mountPoint. Display
     *  only; the real name on disk is never touched. */
    let displayNames = {};

    /** Checksum algorithm for the next job. Defaults to xxHash64, so
     *  nothing changes for anyone who never opens the picker. */
    let algorithms = [];
    let algorithm = "xxhash64";

    /** Item 6 — recent folder per device, mirrored from the main process so
     *  it survives a restart. Keyed by mountPoint. */
    let recentFolders = {};

    /** §60a — mirrored from settings.json so the filter is synchronous.
     *  Names for drives, ids for projects. */
    let hiddenVolumeNames = [];
    let hiddenProjectIds = [];

    let nextId = 1;
    const newId = () => `d${nextId++}`;

    // ── Checksum algorithm picker ──
    // ── Icons ──
    // window.FF_ICONS comes from the generated icons.js (lucide@0.511.0,
    // the same release apps/web pins). Inserted as innerHTML deliberately:
    // the values are static markup from a build-time codegen step, never
    // user input — unlike volume names, which stay text nodes throughout.
    function icon(name) {
      const span = document.createElement("span");
      span.className = "icon";
      span.innerHTML = (window.FF_ICONS && window.FF_ICONS[name]) || "";
      return span;
    }
    function paintStaticIcons(root = document) {
      for (const holder of root.querySelectorAll("[data-icon]")) {
        const svg = window.FF_ICONS && window.FF_ICONS[holder.dataset.icon];
        if (svg) holder.innerHTML = svg;
      }
    }
    /** Volume type → icon key. Falls back to the generic drive icon rather
     *  than rendering an empty box for a type we don't recognize.
     *
     *  `freeframe` was missing here, so every project fell through to the
     *  default and rendered as the internal-drive laptop glyph — a project
     *  looked like this Mac. */
    const typeIcon = (t) =>
      ({
        removable: "removable", internal: "internal", external: "external",
        network: "network", folder: "folder", freeframe: "freeframe",
        file: "file",
      }[t] || "internal");

    /** Human label for the corner type badge. The raw enum value is fine
     *  for drives ("removable"/"network") but "freeframe" reads as noise on
     *  a card that is already, visibly, a FreeFrame project. */
    const typeLabel = (entry) => (entry.kind === "freeframe" ? "project" : entry.type);

    // ── FreeFrame poster / gradient ──
    //
    // Deliberately the same two-branch treatment as apps/web's
    // project-card.tsx: the poster image when there is one, and otherwise a
    // gradient picked deterministically from the project id — NOT a generic
    // glyph. Reusing both the preset list and the hash means a given
    // project is the same colour in the desktop app as it is in the browser.
    //
    // The web presets are Tailwind class names (`from-violet-600 via-…`),
    // which mean nothing without Tailwind, so they're resolved here to the
    // hex values of those exact palette entries.
    const PROJECT_GRADIENTS = [
      ["#7c3aed", "#9333ea", "#d946ef"], // violet-600  → purple-600 → fuchsia-500
      ["#2563eb", "#4f46e5", "#8b5cf6"], // blue-600    → indigo-600 → violet-500
      ["#059669", "#0d9488", "#06b6d4"], // emerald-600 → teal-600   → cyan-500
      ["#f97316", "#f59e0b", "#eab308"], // orange-500  → amber-500  → yellow-500
      ["#e11d48", "#db2777", "#d946ef"], // rose-600    → pink-600   → fuchsia-500
      ["#06b6d4", "#3b82f6", "#6366f1"], // cyan-500    → blue-500   → indigo-500
      ["#0ea5e9", "#22d3ee", "#2dd4bf"], // sky-500     → cyan-400   → teal-400
      ["#ec4899", "#f43f5e", "#fb923c"], // pink-500    → rose-500   → orange-400
    ];
    /** Byte-for-byte the same hash as apps/web's getGradientForProject, so
     *  the two apps agree on which preset a project gets. */
    function projectGradient(projectId) {
      const hash = String(projectId).split("").reduce((a, c) => a + c.charCodeAt(0), 0);
      const [from, via, to] = PROJECT_GRADIENTS[hash % PROJECT_GRADIENTS.length];
      // bg-gradient-to-br is 135deg; the radial overlay is the same
      // highlight project-card.tsx layers over its gradient.
      return `radial-gradient(circle at 30% 40%, rgba(255,255,255,.10), transparent 60%),` +
        ` linear-gradient(135deg, ${from} 0%, ${via} 50%, ${to} 100%)`;
    }

    /** Absolute URL for an API-relative media path. Mirrors apps/web's
     *  resolveApiMediaUrl, except the base is the signed-in server rather
     *  than a build-time env var — poster_url comes back as a relative,
     *  token-carrying proxy path (`/media/...?token=…`), which resolves
     *  against the page in a browser but against `file://` here. */
    function mediaUrl(url) {
      if (!url) return null;
      if (!url.startsWith("/")) return url;
      const base = (ffStatus.baseUrl || "").replace(/\/+$/, "");
      return base ? base + url : null;
    }

    // ── Helpers ──
    function formatBytes(bytes) {
      if (bytes == null) return "—";
      const u = ["B", "KB", "MB", "GB", "TB"];
      let i = 0, n = bytes;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i += 1; }
      return `${n.toFixed(1)} ${u[i]}`;
    }
    const baseName = (p) => p.split("/").filter(Boolean).pop() || p;

    /**
     * §66 — what a drive's tile says about its storage depends on the role
     * it is holding.
     *
     * A source is a card you are pulling FROM: what matters is how much it
     * holds, because that is what is about to be copied. A destination is a
     * drive you are writing TO: what matters is how much room is left. With
     * no role assigned yet, neither question has been asked, so both
     * figures are shown.
     *
     * Falls back to the mount point whenever a figure it needs is missing,
     * matching the guard this replaces — a network volume reports no sizes,
     * and "— used" reads like a bug.
     */
    function storageMeta(entry, role) {
      const { totalBytes: total, freeBytes: free } = entry;
      if (free == null) return entry.mountPoint;
      if (role === "dest") return `${formatBytes(free)} free`;
      if (total == null) return entry.mountPoint;
      const used = Math.max(0, total - free);
      if (role === "source") return `${formatBytes(used)} used`;
      // Two lines, not a separator — see .tile-meta.two-line for why.
      return `${formatBytes(used)} used\n${formatBytes(free)} free`;
    }

    // User-supplied volume and file names land in the DOM, and this renderer
    // is deliberately the untrusted side of the IPC boundary — build text
    // nodes, never innerHTML with interpolated names.
    function el(tag, opts = {}, children = []) {
      const n = document.createElement(tag);
      if (opts.class) n.className = opts.class;
      // §65 — `id` was silently ignored here, so every el(..., { id })
      // produced an element $() could never find again. #fields-preview is
      // built that way, which means the naming panel's preview has never
      // rendered: updateFieldsPreview() looked it up, got null, and
      // returned early without a sound. preset-editor.js's own el() already
      // supports this; index.html's did not.
      if (opts.id) n.id = opts.id;
      if (opts.text != null) n.textContent = opts.text;
      if (opts.title) n.title = opts.title;
      if (opts.dataset) for (const [k, v] of Object.entries(opts.dataset)) n.dataset[k] = v;
      if (opts.style) n.setAttribute("style", opts.style);
      if (opts.onClick) n.addEventListener("click", opts.onClick);
      if (opts.disabled) n.disabled = true;
      for (const c of children) if (c) n.appendChild(c);
      return n;
    }

    function allEntries() {
      return [
        ...volumes.map((v) => ({ ...v })),
        // Projects use the same card/tile treatment as drives; `kind`
        // marks them so the destination path can branch.
        ...ffProjects.map((p) => ({
          kind: "freeframe",
          projectId: p.id,
          name: p.name,
          mountPoint: `freeframe://${p.id}`,
          type: "freeframe",
          totalBytes: p.storage_limit_bytes ?? null,
          freeBytes: null,
          assetCount: p.asset_count ?? 0,
          // Returned by GET /projects all along and simply never read —
          // which is why every project rendered as a bare icon box.
          posterUrl: p.poster_url || null,
          // Item 2 — which folder inside the project this job uses. Null
          // means the root, which is what every project meant before.
          // The folder for each role the project is CURRENTLY holding
          // (§24a for the two labels, §24c for the "currently" part).
          // Showing a configured-but-unused selection read as though it
          // were in effect — which is what made a source-only pick look
          // like it was also being used as an upload target.
          folderLabels: (() => {
            const mountPoint = `freeframe://${p.id}`;
            const held = {
              source: sourcePath === mountPoint,
              destination: destNodes.some((n) => n.path === mountPoint),
            };
            const out = [];
            for (const [role, short] of [["source", "from"], ["destination", "to"]]) {
              if (!held[role]) continue;
              const sel = projectFolderFor(p.id, role);
              if (sel && sel.id !== "root") out.push(`${short} ${sel.path || sel.name}`);
            }
            return out;
          })(),
        })),
        ...extraFolders.map((p) => ({
          name: baseName(p), mountPoint: p, type: "folder",
          totalBytes: null, freeBytes: null,
        })),
      ];
    }
    /**
     * What the middle column actually lists.
     *
     * A folder chosen inside a real volume is deliberately NOT given its
     * own tile: it already appears in Sources or Destinations, and the
     * volume that contains it carries the role highlight (see roleFor
     * below). Listing it here as well made the same choice visible three
     * times, and put the highlight on `Prints` rather than on the drive
     * the user actually has to keep plugged in.
     *
     * A folder with no resolvable parent volume still gets a tile —
     * that's rare, but losing sight of it entirely would be worse than
     * the redundancy this removes.
     */
    function volumesColumnEntries() {
      return allEntries().filter((e) => {
        // §60a — hidden in Settings. Only this column filters: the
        // Source/Dest columns render from sourcePath/destNodes directly and
        // are deliberately untouched, so hiding a drive that is currently
        // assigned declutters the browse view without quietly dismantling a
        // configured job.
        if (isHiddenEntry(e)) return false;
        const isPickedFolder = e.type === "folder" && extraFolders.includes(e.mountPoint);
        if (!isPickedFolder) return true;
        return deviceFor(e.mountPoint) === null;
      });
    }

    /** Drives by name (nothing more stable exists — see settings.js),
     *  projects by their real id. */
    function isHiddenEntry(entry) {
      if (entry.kind === "freeframe") {
        return hiddenProjectIds.includes(entry.projectId);
      }
      // Only real volumes are hideable: a picked folder is already removed
      // by the caller when its drive resolves, and hiding one by name would
      // match every folder that happens to share a basename.
      const isVolume = volumes.some((v) => v.mountPoint === entry.mountPoint);
      return isVolume && hiddenVolumeNames.includes(entry.name);
    }

    /**
     * Which roles a real volume is involved in — directly, or through any
     * folder inside it.
     *
     * This is what moves the highlight from the subfolder to the drive.
     * `deviceFor` resolves a path to its containing volume, so a source
     * of /Volumes/RB_Padel/PROG and a destination of
     * /Volumes/RB_Padel/Prints both resolve to RB_Padel, which then shows
     * as both.
     */
    function roleFor(mountPoint) {
      const owns = (p) => p === mountPoint || deviceFor(p) === mountPoint;
      return {
        isSource: Boolean(sourcePath) && owns(sourcePath),
        isDest: destNodes.some((n) => owns(n.path)),
        // The volume itself holding a role is different from merely
        // containing one: only the former should be dimmed as
        // "already placed", since the drive stays assignable otherwise.
        selfAssigned: isAssigned(mountPoint),
      };
    }

    /** Role → CSS modifier, shared by both views so they can't drift. */
    function roleClass(mountPoint) {
      const { isSource, isDest } = roleFor(mountPoint);
      if (isSource && isDest) return " role-both";
      if (isSource) return " role-src";
      if (isDest) return " role-dst";
      return "";
    }

    /** Applied at the single point every card, tile, chain label and menu
     *  title reads a name from, so an override shows up everywhere at once
     *  rather than in whichever places got updated. */
    function withDisplayName(entry) {
      const override = displayNames[entry.mountPoint];
      return override ? { ...entry, name: override, realName: entry.name } : entry;
    }

    const entryFor = (p) => withDisplayName(
      allEntries().find((e) => e.mountPoint === p)
      || (p === FILESET
        ? {
            name: `${(sourceFiles || []).length} files`,
            mountPoint: p, type: "file",
            // The card's second line lists what was actually picked, since
            // "3 files" alone says nothing about which.
            fileList: (sourceFiles || []).map(baseName).join(", "),
            totalBytes: null, freeBytes: null,
          }
        : { name: baseName(p), mountPoint: p, type: pathLooksLikeFile(p) ? "file" : "folder", totalBytes: null, freeBytes: null })
    );

    /** A chosen path with an extension is treated as a file for display
     *  purposes only — the engine stats it for real. Extensionless files
     *  simply show the folder glyph, which is cosmetic and not worth an
     *  async round trip per render. */
    const pathLooksLikeFile = (p) => /\.[A-Za-z0-9]{1,6}$/.test(String(p || ""));

    const isAssigned = (p) => sourcePath === p || destNodes.some((n) => n.path === p);

    // ── Assignment ──
    const isProject = (p) => typeof p === "string" && p.startsWith("freeframe://");

    const projectIdOf = (p) => (isProject(p) ? p.slice("freeframe://".length) : null);

    /**
     * Which `sourcePath` the current `sourceCounter` was claimed for, or
     * null when nothing is claimed for the current assignment. §75 — see
     * the long note on `sourceCounter` below for what it is for.
     *
     * Declared HERE, above every function that assigns it, rather than
     * beside `sourceCounter` where it belongs by subject: `setSourceFiles`
     * writes it, and a `let` below its own writer is a TDZ throw waiting on
     * call order (§64 hit exactly that with `currentPage`).
     */
    let claimedForPath = null;

    /**
     * §78 — the date every date token renders from, or null for the live
     * clock. Session-only, deliberately: unlike {sourcecounter} this is not
     * a per-card fact worth remembering, and a stale override silently
     * surviving a relaunch would misdate a whole day's cards.
     */
    let dateOverride = null;

    /**
     * §81 — whether the active preset's patterns render date/time tokens at
     * all. Answered by main (presets:preview), not by a regex here: a
     * second tokenizer in the renderer would drift from naming.js's the
     * first time the syntax changed.
     *
     * Both start false, so a panel shows neither row until the round trip
     * that decides comes back. That is a brief absence rather than a wrong
     * row, and the round trip already happens on every panel render.
     */
    let patternUses = { date: false, time: false };

    function applyDateTimeRows() {
      const d = $("fv-date-row"), t = $("fv-time-row");
      if (d) d.classList.toggle("hidden", !patternUses.date);
      if (t) t.classList.toggle("hidden", !patternUses.time);
    }

    const FILESET = "fileset://selected";
    const isFileSet = (p) => p === FILESET;

    /**
     * Use a set of individually-chosen files as the source.
     *
     * One file keeps its own real path as the key — no synthetic entry, and
     * the card reads as that file. Several get the synthetic key, because
     * there is no single path that means "these three".
     */
    function setSourceFiles(files) {
      if (!files || !files.length) return;
      // Only the source being REPLACED needs protecting (§22b).
      if (isBusy(sourcePath)) return;
      if (files.length === 1) { sourceFiles = null; setSource(files[0]); return; }
      sourceFiles = [...files];
      // §75 — every multi-file selection is the SAME sentinel path, so the
      // path comparison in setSource cannot see that the selection changed.
      // Cleared here instead: two genuinely different file sets are two
      // sources, and must not share one card number.
      claimedForPath = null;
      setSource(FILESET);
    }

    /**
     * §22h/§71 — the number this job renders as `{sourcecounter}`.
     *
     * §22h claimed it the moment a path became the Source. §71 moved that
     * to job start, and only for a job that actually renames: assigning a
     * card and then copying it plainly was burning a number nothing used,
     * so the folders skipped.
     *
     * §75 then added back ONE piece of memory, and only one: which source
     * path the current `sourceCounter` was claimed for. §71's own comment
     * here used to say nothing was remembered per path and that the
     * removal was the point — that was right for the problem §71 solved
     * and wrong for this one, so it is corrected rather than left
     * standing. §71's rule survives intact: a job that does not rename
     * still never claims.
     *
     * What changes is a retry. A job can fail at start — a naming
     * collision, a fragile-rename refusal — having copied nothing. The
     * card is still sitting in Source; pressing Start again is the same
     * card's first real attempt, not its second, and it must not skip a
     * number. So a claim is reused for as long as the SAME source
     * assignment stands.
     *
     * The reuse window is one `setSource()` call to the next, not the
     * lifetime of a path string: re-picking the same physical card is a
     * new card as far as this is concerned, and claims normally. Editing
     * the Card # by hand also ends it, or the retry would quietly ignore
     * the number just typed.
     */
    let sourceCounter = 1;

    /** Claim one number for the job about to start. Awaited by startCopy,
     *  so the payload it builds carries the claimed value rather than a
     *  stale one. */
    async function claimSourceCounter() {
      const claimed = await window.freeframe.bumpSourceCounter();
      sourceCounter = claimed;
      // Keeps the editable field honest without re-reading the store.
      nextSourceCounter = claimed + 1;
      return claimed;
    }

    function setSource(p) {
      // Replacing a source a job is reading would pull the card out from
      // under it; replacing any other source is fine while it runs.
      if (isBusy(sourcePath)) return;
      // A project CAN now be a source (item 3) — copy-engine has a
      // FreeFrame source provider. What it still can't be is both sides of
      // the same job: the dual-role modal resolves that by picking two
      // native subfolders, which is meaningless for a project, so this
      // combination is refused outright rather than half-handled.
      if (isProject(p) && destNodes.some((n) => n.path === p)) {
        showProjectConflict(p);
        return;
      }
      // Any source that isn't the file set drops the file set, or a stale
      // list would be sent alongside an unrelated path.
      if (p !== FILESET) sourceFiles = null;
      const previous = sourcePath;
      const previousClaim = claimedForPath;
      sourcePath = p;
      // §71 — assigning a source no longer claims a number. A plain copy
      // with no renaming must not consume one, and which job it is cannot
      // be known until Start is pressed.
      //
      // §75 — a genuinely different assignment ends the previous claim's
      // reuse window. Cleared only here, after the guards above have let
      // the reassignment through, so a REFUSED setSource (busy source,
      // project on both sides) leaves the claim alone — the card it was
      // claimed for is still the one in Source.
      if (p !== previous) claimedForPath = null;
      // Item 5: holding both roles is legitimate — copying between two
      // folders on one big RAID is a real workflow. What's *not* legitimate
      // is the bare volume root on both sides, which would copy a folder
      // into itself. So don't silently evict it from Destinations any more;
      // surface the conflict and make the user resolve it with subfolders.
      if (destNodes.some((n) => n.path === p)) {
        // Reverting the assignment reverts the claim with it, or the card
        // that is back in Source would be told to claim a second number.
        openDualRoleModal(p, () => {
          sourcePath = previous;
          claimedForPath = previousClaim;
          render();
        });
      }
      render();
    }
    /**
     * The existing top-level destination that adding `p` should REPLACE
     * rather than sit beside, or null to add normally. §73.
     *
     * Only top-level nodes on either side. A cascaded node copies FROM
     * another destination rather than from the source, so narrowing one
     * would silently restructure the chain — and a cascaded child being
     * added must not evict the parent whose device it necessarily shares.
     *
     * Projects are excluded in BOTH directions, and that exclusion is
     * load-bearing rather than tidiness: deviceFor() falls back to the
     * internal volume for any path it cannot place, so a `freeframe://id`
     * URI resolves to a real mount point. Without this, assigning a project
     * would evict a destination folder on the boot drive, and vice versa.
     */
    function narrowingTarget(p, parentId) {
      // An EXPLICIT cascade parent means the caller is building a chain,
      // not editing which folder a device points at — cascadeFrom is the
      // only such caller. Keyed off a named parent, not off the
      // inherit-sentinel: `undefined` reaches here as `null` (see addDest).
      if (parentId !== null) return null;
      if (isProject(p)) return null;
      const dev = deviceFor(p);
      if (!dev) return null;
      // `n.path !== p` is unreachable from addDest — its own exact-match
      // guard returns before this runs — and kept only so the helper is
      // correct if it is ever called from somewhere else. §69's version
      // WAS reachable, because it ran outside addDest: the early return
      // skipped the add while the caller went on to remove the node it had
      // matched, emptying the column. That shape is gone with the caller.
      //
      // §89 — CASCADE CHILDREN COUNT. This used to require
      // `n.parentId === null`, so a device whose only destination was a
      // cascade child looked empty: narrowing found nothing, and addDest
      // built a second, independent root destination beside a chain that
      // already used that drive. One device holds one destination folder
      // wherever it sits in the chain, so where it sits is not a reason to
      // ignore it.
      return destNodes.find(
        (n) => !isProject(n.path) && n.path !== p && deviceFor(n.path) === dev
      ) || null;
    }

    /**
     * @param {string} p
     * @param {string|null|undefined} parentId
     *   A node id cascades from that node. `null` means ROOT, explicitly.
     *   `undefined` — the default — means "wherever the destination this
     *   replaces already sat", which is root when it replaces nothing.
     *
     *   §89 — those last two used to be the same value, and that is half
     *   of what the bug was: narrowing a cascade child rebuilt it with the
