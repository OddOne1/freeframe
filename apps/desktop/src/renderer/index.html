<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FreeFrame Desktop (name TBD)</title>
  <style>
    /* Same dark-theme tokens as apps/web/app/globals.css, kept in sync by
       hand for now — no shared design-token package between the two apps
       yet. If this file and the web app's palette drift, that's a real
       follow-up (a small shared @freeframe/tokens package), not urgent
       for a first scaffold. */
    :root {
      --bg-primary: #0d0d10;
      --bg-elevated: #24242c;
      --bg-hover: #2a2a34;
      --border: #33333d;
      --text-primary: #f2f2f5;
      --text-secondary: #9a9aa5;
      --accent: #5b8def;
      --accent-hover: #7aa3f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }

    button {
      -webkit-app-region: no-drag;
      background: var(--bg-elevated);
      color: var(--text-primary);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover { background: var(--bg-hover); }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .empty {
      color: var(--text-secondary);
      padding: 24px 0;
      text-align: center;
    }

    .volume {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      background: var(--bg-elevated);
    }

    .volume .name { font-weight: 600; }
    .volume .meta { color: var(--text-secondary); font-size: 11px; margin-top: 2px; }

    .badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      padding: 3px 8px;
      border-radius: 999px;
      color: var(--accent);
      border: 1px solid var(--accent);
      background: rgba(91, 141, 239, 0.12);
    }
  </style>
</head>
<body>
  <header>
    <h1>Volumes</h1>
    <button id="refresh">↻ Refresh</button>
  </header>
  <main id="list">
    <div class="empty">Loading…</div>
  </main>

  <script>
    // No Node access here (contextIsolation + sandbox: true in main.js) —
    // window.freeframe is the only thing preload.js exposes.
    const listEl = document.getElementById("list");
    const refreshBtn = document.getElementById("refresh");

    function formatBytes(bytes) {
      if (bytes == null) return "—";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      let n = bytes;
      while (n >= 1024 && i < units.length - 1) {
        n /= 1024;
        i += 1;
      }
      return `${n.toFixed(1)} ${units[i]}`;
    }

    function render(volumes) {
      if (!volumes.length) {
        listEl.innerHTML = '<div class="empty">No volumes found.</div>';
        return;
      }
      listEl.innerHTML = volumes
        .map(
          (v) => `
        <div class="volume">
          <div>
            <div class="name">${v.name}</div>
            <div class="meta">${v.mountPoint} · ${formatBytes(v.freeBytes)} free of ${formatBytes(v.totalBytes)}</div>
          </div>
          <span class="badge">${v.type}</span>
        </div>
      `
        )
        .join("");
    }

    async function refresh() {
      listEl.innerHTML = '<div class="empty">Loading…</div>';
      const volumes = await window.freeframe.listVolumes();
      render(volumes);
    }

    refreshBtn.addEventListener("click", refresh);
    refresh();
  </script>
</body>
</html>
