     * choice is per job and is never stored: a decision made for one card
     * shouldn't quietly apply to the next one.
     */
    function openFragileDialog(message) {
      return new Promise((resolve) => {
        const backdrop = $("fragile-backdrop");
        const ack = $("fragile-ack");
        const go = $("fragile-go");
        $("fragile-body").textContent = message;
        ack.checked = false;
        go.disabled = true;
        backdrop.classList.add("open");

        const onAck = () => { go.disabled = !ack.checked; };
        function close(result) {
          backdrop.classList.remove("open");
          ack.removeEventListener("change", onAck);
          go.removeEventListener("click", onGo);
          $("fragile-cancel").removeEventListener("click", onCancel);
          resolve(result);
        }
        const onGo = () => close(true);
        const onCancel = () => close(false);

        ack.addEventListener("change", onAck);
        go.addEventListener("click", onGo);
        $("fragile-cancel").addEventListener("click", onCancel);
      });
    }

    /** Per-job field values, asked for before the copy starts. */
    function openValuesDialog(onDone) {
      const preset = activePreset();
      if (!preset) { onDone(true); return; }

      $("values-sub").textContent = `${preset.name} — used to name folders on each destination.`;
      $("values-error").textContent = "";
      const grid = $("values-grid");
      grid.replaceChildren();

      for (const f of preset.fields) {
        grid.appendChild(el("label", { text: f.label + (f.required ? " *" : "") }));
        const control = buildFieldControl(f, presetValues[f.key] ?? "", (value, node) => {
          presetValues[f.key] = value;
          node.classList.remove("missing");
          updateValuesPreview();
        }, { dataset: { key: f.key } });
        grid.appendChild(control.wrap);
      }

      updateValuesPreview();
      valuesDone = onDone;
      $("values-backdrop").classList.add("open");
    }

    let valuesDone = null;

    async function updateValuesPreview() {
      const preset = activePreset();
      const out = $("values-preview");
      if (!preset || !out) return;
      const res = await window.freeframe.previewNaming(
        preset.folderTemplate, preset.fileTemplate, presetValues,
        sourcePath && !isProject(sourcePath) ? sourcePath : "",
        undefined,
        { autoSuffix: preset.autoSuffix || null,
          dateOverride: dateOverride ? dateOverride.toISOString() : null },
      );
      renderScopedPreview(out, res);
    }

    /**
     * §65.8/.9 — a preview scoped to what the templates actually produce.
     *
     * The source's own subtree (`DCIM/100MEDIA/`) sits between the folder
     * and the file in the real path and is preserved by design, produced by
     * neither template. Showing it invited reading it as something the
     * pattern had made.
     *
     * An auto-appended `_0001` (§65.5) is marked amber, because it is text
     * the user did not write. That treatment is the standing one for
     * anything inferred or auto-corrected in a preview, not a one-off here.
     */
    function renderScopedPreview(box, res) {
      box.classList.toggle("bad", !res.ok);
      box.replaceChildren();
      if (!res.ok) { box.textContent = res.error; return; }
      if (res.folder) box.appendChild(el("div", { text: `${res.folder}/` }));
      const line = el("div");
      const auto = res.autoCounter ? String(res.file).match(/_(\d{4})(\.[^.]*)?$/) : null;
      if (auto) {
        const cut = res.file.length - auto[0].length;
        line.appendChild(document.createTextNode(res.file.slice(0, cut)));
        line.appendChild(el("span", { class: "auto-fix", text: `_${auto[1]}`,
          title: "Added automatically: the pattern numbers nothing, so files would otherwise collide" }));
        if (auto[2]) line.appendChild(document.createTextNode(auto[2]));
      } else {
        line.textContent = res.file;
      }
      box.appendChild(line);
    }

    /** The naming payload for a job, or null when no preset is active. */
    function namingPayload() {
      const preset = activePreset();
      if (!preset) return null;
      return {
        folderTemplate: preset.folderTemplate,
        fileTemplate: preset.fileTemplate,
        fields: preset.fields,
        values: presetValues,
        // §23c. Null for every preset that hasn't opened the filtering
        // section, which main treats as "no filtering at all".
        filters: preset.filters || null,
        // §22h. The number claimed when this source was assigned; main
        // clamps it before it reaches a folder name.
        sourceCounter,
        // §22g. Fields switched off for THIS transfer. Main strips their
        // tokens from the templates rather than substituting empty
        // strings, which would leave the separator behind.
        disabledFields: disabledFields(),
        // §77. Whether the auto-suffix is a counter or the source's own
        // filename, and which end it goes on. Main re-normalizes it.
        autoSuffix: preset.autoSuffix || null,
        // §78. A manually-set date, or null for the live clock. Serialized,
        // because a Date does not survive the structured clone across IPC
        // as anything main can rely on.
        dateOverride: dateOverride ? dateOverride.toISOString() : null,
      };
    }

    /** Names of required fields with nothing in them.
     *
     *  A field switched off for this transfer is exempt: the toggle means
     *  "this card doesn't use that field", and a required field that can
     *  never be skipped would make the toggle useless precisely where it
     *  earns its place (a preset whose Talent field is required, applied to
     *  a card of B-roll). */
    function missingRequired() {
      const preset = activePreset();
      if (!preset) return [];
      const off = valuesEntry().disabled;
      return preset.fields
        .filter((f) => f.required && !off.has(f.key) && !String(presetValues[f.key] ?? "").trim())
        .map((f) => f.label || f.key);
    }

    // ── §22g — per-transfer field values panel ───────────────────────────


    /**
     * Show/hide state, and the rule that outranks it (§25c).
     *
     * With no preset active the panel has nothing to show but its own
     * explanation of why it is empty, and the reopen button offers to
     * bring that back. Both are removed entirely instead — an empty region
     * explaining its own emptiness is worse than no region.
     *
     * `activePreset()` is the same check missingRequired() uses; the
     * manual Hide state is kept underneath, so a preset chosen later
     * restores whatever the user had.
     */
    /**
     * §70 — the card is visible exactly when a preset is active, and there
     * is no second control that hides it.
     *
     * There used to be a "Hide" on the card and a "Naming Fields" button in
     * the header to bring it back, both flipping a display-only flag. That
     * flag was a trap: hiding the panel left every required field STILL
     * required, so a job could refuse to start with the explanation of why
     * hidden behind the thing that was hidden. The header's preset toggle
     * already removes the panel and the requirement together, which is the
     * only removal that is actually safe.
     */
    function applyFieldsPanelVisibility() {
      $("fields-panel").classList.toggle("hidden", !activePreset());
      // §65.12 — Copy & Verify follows the card, so it moves on the same
      // signal rather than needing every caller to remember to move it.
      placeStartButton();
    }

    /**
     * One input per field the active preset defines, for the source
     * currently assigned.
     *
     * Rebuilt from state on every render rather than patched, so it cannot
     * drift from the source it claims to describe — the failure this is
     * most likely to have is showing card A's values above card B's name.
     */
    /**
     * §65.1/.3 — the control for one field's runtime value.
     *
     * Text is an <input>. Choice is a <select> of the authored options,
     * substituting the picked option's Token (or its Label when the Token
     * is blank) wherever that field's placeholder sits in the pattern —
     * the same substitution every other token uses, so nothing in
     * renderTemplate had to learn about it.
     *
     * "Other…" appears only when the field's own allowOther is set, and
     * reveals an input beside THAT field alone. With it off, the list is
     * closed on purpose: a client-approved roster has no escape hatch.
     */
    function buildFieldControl(f, current, onValue, opts = {}) {
      const wrap = el("div", { class: "fv-control" });
      if (f.type !== "choice") {
        const input = el("input", { dataset: opts.dataset || {} });
        input.type = "text";
        input.value = current ?? "";
        if (opts.disabled) input.disabled = true;
        input.placeholder = opts.placeholder ?? `{${f.key}}`;
        input.addEventListener("input", () => onValue(input.value, input));
        wrap.appendChild(input);
        return { wrap, focusable: input };
      }

      const options = Array.isArray(f.options) ? f.options : [];
      const tokenOf = (o) => (o.token || o.label);
      const known = options.map(tokenOf);
      // A stored value that is not on the list can only have come from
      // "Other…", so the control reopens in that state rather than
      // silently snapping the value back to option one.
      const isOther = Boolean(current) && !known.includes(current);

      const select = el("select", { class: "fv-select", dataset: opts.dataset || {} });
      if (opts.disabled) select.disabled = true;
      const blank = el("option", { text: options.length ? "—" : "No options defined" });
      blank.value = "";
      select.appendChild(blank);
      for (const o of options) {
        const opt = el("option", { text: o.label });
        opt.value = tokenOf(o);
        if (!isOther && current === opt.value) opt.selected = true;
        select.appendChild(opt);
      }
      const OTHER = "\u0000other";
      if (f.allowOther) {
        const opt = el("option", { text: "Other…" });
        opt.value = OTHER;
        if (isOther) opt.selected = true;
        select.appendChild(opt);
      }
      wrap.appendChild(select);

      const other = el("input", { class: "fv-other" });
      other.type = "text";
      other.placeholder = "One-off value";
      other.value = isOther ? current : "";
      other.hidden = !isOther;
      if (opts.disabled) other.disabled = true;
      other.addEventListener("input", () => onValue(other.value, other));
      wrap.appendChild(other);

      select.addEventListener("change", () => {
        if (select.value === OTHER) {
          other.hidden = false;
          other.focus();
          onValue(other.value, other);
        } else {
          other.hidden = true;
          other.value = "";
          onValue(select.value, select);
        }
      });
      return { wrap, focusable: select };
    }

    function renderFieldsPanel() {
      const host = $("fields-body");
      if (!host) return;
      applyFieldsPanelVisibility();
      host.replaceChildren();

      // §25c — the panel is hidden outright without a preset, so this
      // branch only guards against rendering into a hidden host.
      const preset = activePreset();
      if (!preset) return;
      if (!sourcePath) {
        host.appendChild(el("div", { class: "fv-empty",
          text: `“${preset.name}” is active. Assign a source to fill in its fields — values are kept per card, so swapping back restores what you typed.` }));
        return;
      }
      if (!preset.fields.length) {
        host.appendChild(el("div", { class: "fv-empty",
          text: `“${preset.name}” defines no custom fields. Add some in the preset editor if you want to type values per card.` }));
        return;
      }

      const entry = valuesEntry();
      host.appendChild(el("div", { class: "fv-source", text: entryFor(sourcePath).name, title: sourcePath }));

      for (const f of preset.fields) {
        const off = entry.disabled.has(f.key);
        const wrap = el("div", { class: `fv-field${off ? " off" : ""}` });

        const labelRow = el("div", { class: "fv-label" }, [
          el("span", { text: f.label || f.key, title: `{${f.key}}` }),
          f.required && !off ? el("span", { class: "req", text: "*" }) : null,
        ]);
        const toggle = el("input", { class: "fv-toggle" });
        toggle.type = "checkbox";
        toggle.checked = !off;
        toggle.title = "Use this field for this transfer";
        toggle.addEventListener("change", () => {
          if (toggle.checked) entry.disabled.delete(f.key);
          else entry.disabled.add(f.key);
          renderFieldsPanel();
          updateFieldsPreview();
        });
        labelRow.appendChild(toggle);
        wrap.appendChild(labelRow);

        const control = buildFieldControl(f, entry.values[f.key] ?? "", (value, node) => {
          entry.values[f.key] = value;
          node.classList.remove("missing");
          updateFieldsPreview();
          // Start may become available the moment a required field is filled.
          $("start").disabled = !(Boolean(sourcePath) && destNodes.length > 0
            && !currentJobPending() && missingRequired().length === 0);
        }, {
          dataset: { fvKey: f.key },
          disabled: off,
          placeholder: off ? "not used for this transfer" : `{${f.key}}`,
        });
        wrap.appendChild(control.wrap);

        if (off) {
          wrap.appendChild(el("div", { class: "fv-note",
            text: `{${f.key}} is removed from the names for this transfer.` }));
        }
        host.appendChild(wrap);
      }

      host.appendChild(el("div", { id: "fields-preview", class: "fv-preview" }));
      host.appendChild(renderCardNumber());
      // §81 — built hidden and revealed by updateFieldsPreview() once main
      // reports which token kinds the patterns use. Built rather than
      // skipped so the reveal is a class toggle, not a re-render that would
      // re-enter this function.
      host.appendChild(renderCardDate());
      host.appendChild(renderCardTime());
      host.appendChild(renderCardClear());
      applyDateTimeRows();
      updateFieldsPreview();
    }

    /**
     * §65.4 — {sourcecounter}, editable where the job is actually started.
     *
     * Backend already existed (presets.js's setSourceCounter, and
     * claimSourceCounter here); nothing surfaced it outside Settings.
     *
     * It shows THIS card's number once a source is assigned, because that
     * is the number about to be rendered — showing the store's "next" one
     * beside a card it does not describe would be worse than not showing
     * it. Typing a value therefore sets this card's number AND pushes the
     * store one past it, so the next card follows on rather than repeating.
     */
    function renderCardNumber() {
      const wrap = el("div", { class: "fv-counter" });
      // §71 — always the store's NEXT value, whether or not a source is
      // assigned. The claim happens at job start now, so there is no
      // per-card number to show before then, and the number displayed is
      // by construction the number the next renaming job will use.
      wrap.appendChild(el("label", { text: "Next card #",
        title: "What {sourcecounter} renders as on the next renaming job" }));
      const input = el("input", { id: "fv-counter-input" });
      input.type = "number";
      input.min = "1";
      input.value = String(nextSourceCounter);
      input.addEventListener("change", async () => {
        const n = Math.max(1, Math.floor(Number(input.value) || 1));
        nextSourceCounter = await window.freeframe.setSourceCounter(n);
        input.value = String(nextSourceCounter);
        // §75 — typing a number here has to win over a claim already made
        // for the current source, or a retry would reuse the old value and
        // silently ignore what was just typed. Ending the reuse window
        // makes the next renaming job claim afresh, which is exactly this
        // number.
        claimedForPath = null;
        updateFieldsPreview();
      });
      wrap.appendChild(input);
      return wrap;
    }

    /** Local YYYY-MM-DD, which is what <input type="date"> speaks.
     *  toISOString() would be wrong here — it converts to UTC first, so an
     *  evening in a positive-offset zone reports tomorrow's date. */
    function dateInputValue(d) {
      const pad2 = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    /** Local HH:MM, matching dateInputValue's reasoning about time zones. */
    function timeInputValue(d) {
      const pad2 = (n) => String(n).padStart(2, "0");
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    /** What the job will actually render from right now. */
    const effectiveNow = () => dateOverride || new Date();

    /**
     * §78/§81 — the date and time the job's date/time tokens render from.
     *
     * ONE Date, two editable views onto it. Date edits Y/M/D, Time edits
     * h/m; both feed the single `now` buildRelMapper receives, because
     * that is what a Date already is.
     *
     * Defaults to live: the fields show the clock and nothing is
     * overridden until one is changed, so the common case needs no
     * interaction. The reason it exists is offloading after midnight, or a
     * card handed over the next morning — the shoot's date is not the
     * clock's.
     *
     * §81 — each row appears only when the patterns actually use a token
     * it controls. A Date row above a preset that renders no date is an
     * offer to change something that will not appear anywhere.
     */
    function renderCardDate() {
      const wrap = el("div", { class: "fv-counter fv-date", id: "fv-date-row" });
      wrap.appendChild(el("label", { text: "Date",
        title: "What {date}/{YYYY}/{YY}/{MM}/{DD} render as. Defaults to today." }));

      const input = el("input", { id: "fv-date-input" });
      input.type = "date";
      input.value = dateInputValue(effectiveNow());
      input.addEventListener("change", () => {
        // Parsed as LOCAL midnight, not UTC: `new Date("2026-08-28")` is
        // UTC midnight, which renders as the 27th anywhere west of
        // Greenwich — the date tokens would be a day off for half the
        // world.
        const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(input.value);
        if (!m) { input.value = dateInputValue(effectiveNow()); return; }
        // The time half is carried over, not reset: editing one view must
        // not silently discard what the other one says.
        const base = effectiveNow();
        dateOverride = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]),
                                base.getHours(), base.getMinutes());
        renderFieldsPanel();
      });
      wrap.appendChild(input);

      const now = el("button", { id: "fv-date-now", text: "Now",
        title: "Use today's date", onClick: () => {
          const live = new Date();
          const base = effectiveNow();
          dateOverride = new Date(live.getFullYear(), live.getMonth(), live.getDate(),
                                  base.getHours(), base.getMinutes());
          dropOverrideIfLive();
          renderFieldsPanel();
        } });
      // Disabled when it would do nothing, so the button itself says
      // whether THIS row is currently overriding anything.
      now.disabled = !dateOverride || dateInputValue(dateOverride) === dateInputValue(new Date());
      wrap.appendChild(now);
      return wrap;
    }

    /** §81 — the time half of the same value. */
    function renderCardTime() {
      const wrap = el("div", { class: "fv-counter fv-date", id: "fv-time-row" });
      wrap.appendChild(el("label", { text: "Time",
        title: "What {hh}/{mm} render as. Defaults to the current time." }));

      const input = el("input", { id: "fv-time-input" });
      input.type = "time";
      input.value = timeInputValue(effectiveNow());
      input.addEventListener("change", () => {
        const m = /^(\d{2}):(\d{2})$/.exec(input.value);
        if (!m) { input.value = timeInputValue(effectiveNow()); return; }
        const base = effectiveNow();
        dateOverride = new Date(base.getFullYear(), base.getMonth(), base.getDate(),
                                Number(m[1]), Number(m[2]));
        renderFieldsPanel();
      });
      wrap.appendChild(input);

      const now = el("button", { id: "fv-time-now", text: "Now",
        title: "Use the current time", onClick: () => {
          const live = new Date();
          const base = effectiveNow();
          dateOverride = new Date(base.getFullYear(), base.getMonth(), base.getDate(),
                                  live.getHours(), live.getMinutes());
          dropOverrideIfLive();
          renderFieldsPanel();
        } });
      now.disabled = !dateOverride || timeInputValue(dateOverride) === timeInputValue(new Date());
      wrap.appendChild(now);
      return wrap;
    }

    /**
     * Once neither half differs from the clock any more, stop overriding
     * at all — otherwise a value pinned to "now" would freeze there and
     * quietly stop tracking, which is the opposite of what pressing Now
     * asks for.
     */
    function dropOverrideIfLive() {
      if (!dateOverride) return;
      const live = new Date();
      if (dateInputValue(dateOverride) === dateInputValue(live)
        && timeInputValue(dateOverride) === timeInputValue(live)) dateOverride = null;
    }

    /**
     * §65.11 — Clear, in its new and only home.
     *
     * It resets the values typed for THIS source and nothing else. It must
     * not touch the numbering, which keeps advancing per card regardless —
     * a card's number is a fact about which card it is, not a value someone
     * entered. It also no longer clears the source/destination selection:
     * that was the header button's job, and drag-and-drop does not need an
     * undo affordance (§65.11).
     */
    function renderCardClear() {
      const row = el("div", { class: "fv-clear-row" });
      row.appendChild(el("button", {
        id: "fields-clear",
        text: "Clear",
        title: "Reset the values entered for this card. The card number is unaffected.",
        onClick: () => {
          const entry = valuesEntry();
          for (const k of Object.keys(entry.values)) delete entry.values[k];
          entry.disabled.clear();
          renderFieldsPanel();
          updateFieldsPreview();
          render();
        },
      }));
      return row;
    }

    async function updateFieldsPreview() {
      const preset = activePreset();
      const out = $("fields-preview");
      if (!preset || !out) return;
      const off = disabledFields();
      const res = await window.freeframe.previewNaming(
        preset.folderTemplate, preset.fileTemplate, valuesEntry().values,
        sourcePath && !isProject(sourcePath) ? sourcePath : "",
        off,
        // §77/§78 — the preview has to run the job's own suffix rule and
        // clock, or it quietly promises a name the job will not produce.
        { autoSuffix: preset.autoSuffix || null,
          dateOverride: dateOverride ? dateOverride.toISOString() : null },
      );
      const box = $("fields-preview");
      if (!box) return;   // re-rendered while awaiting
      // §81 — same round trip, so no extra channel and no second tokenizer.
      patternUses = { date: Boolean(res && res.usesDate), time: Boolean(res && res.usesTime) };
      applyDateTimeRows();
      renderScopedPreview(box, res);
    }

    // ── Job panel + concurrency mode (§18c) ──────────────────────────────
    //
    // Job state lives in the MAIN process and arrives as a whole snapshot
    // on every change. The renderer keeps none of its own — that is what
    // stops the docked panel and the detached window disagreeing about
    // what is running.

    let panelDetached = false;

    // Panel height is a real drag-resized dimension now, not a two-state
    // Expand/Shrink toggle. Clamped so the splitter can neither collapse
    // the panel to an invisible sliver nor push the columns off screen.
    const JOBS_MIN_H = 46;   // roughly one row, so the top row stays legible
    const jobsMaxH = () => Math.max(JOBS_MIN_H, Math.round(window.innerHeight * 0.7));
    let jobsPanelH = 180;

    function setJobsPanelHeight(px) {
      jobsPanelH = Math.round(Math.min(jobsMaxH(), Math.max(JOBS_MIN_H, px)));
      $("jobs-panel").style.height = `${jobsPanelH}px`;
    }

    function setJobsPanelOpen(open) {
      // The handle and the panel are siblings, so their visibility is
      // toggled together rather than each caller remembering both.
      $("jobs-panel").classList.toggle("open", open);
      $("jobs-resize").classList.toggle("open", open);
      if (open) setJobsPanelHeight(jobsPanelH);
    }

    // Shrinking the window must not leave the panel taller than the clamp
    // now allows.
    window.addEventListener("resize", () => {
      if ($("jobs-panel")?.classList.contains("open")) setJobsPanelHeight(jobsPanelH);
    });

    // Which other jobs this one tolerates. Default "source": a second
    // offload of the SAME card can run alongside, anything else waits.
    // The conservative default of the three, since it's the one where
    // concurrent access is provably the same device already being read.
    let concurrencyMode = "source";
    // §63 — OffShoot's own names, verbatim. The old labels described the
    // rule from the running job's point of view ("Runs alone"), which read
    // backwards next to a queueing setting: what the user is choosing is
    // what the app is allowed to do at once, not what one job does.
    const CONC_LABELS = {
      free: "Off",
      source: "Single Source",
      destination: "Single Destination",
      exclusive: "Single Transfer",
    };
    const CONC_OPTIONS = [
      ["source", "Single Source",
        "Another offload of this same card can run at the same time. Anything else waits."],
      ["destination", "Single Destination",
        "Another job writing to this same drive can run at the same time. Anything else waits."],
      ["exclusive", "Single Transfer",
        "One job at a time, whatever it is reading or writing. Everything else queues."],
      ["free", "Off",
        "No restriction. Two jobs may end up contending for one disk — that is allowed on purpose."],
    ];

    function updateConcLabel() {
      const l = $("conc-label");
      if (l) l.textContent = CONC_LABELS[concurrencyMode] || concurrencyMode;
    }

    function drawJobs() {
      const host = $("jobs-list");
      if (!host || !window.JobPanel) return;
      window.JobPanel.renderJobs(host, jobSnapshot, {
        onCancel: (id) => window.freeframe.cancelCopy(id),
        onOpenLog: (id) => window.freeframe.openJobLog(id),
        onRemove: (id) => window.freeframe.removeJob(id),
      });

      const running = jobSnapshot.filter((j) => j.status === "running").length;
      const queued = jobSnapshot.filter((j) => j.status === "queued").length;
      const label = $("jobs-tab-label");
      if (label) {
        label.textContent = running || queued
          ? `Transfers — ${running} running${queued ? `, ${queued} queued` : ""}`
          : "Transfers";
      }
    }

    // ── Item 6: native OS drag-and-drop from Finder ──
    //
    // Entirely separate from the in-app pointer drag (beginDrag/mousemove/
    // mouseup), which only moves cards that already exist in the UI and is
    // untouched by this. Different trigger, same downstream setSource /
    // setSourceFiles / addDest calls.
    //
    // The renderer can't turn a dropped File into a path — webUtils lives
    // in electron, which the sandbox forbids requiring — so preload does
    // that and hands back plain strings.
    function wireOsDrop(zoneId, role) {
      const zone = $(zoneId);
      if (!zone) return;

      const over = (e) => {
        // Only for real file drops. Without this check an in-app drag
        // would light up the zone twice, in two different styles.
        if (!e.dataTransfer || !Array.from(e.dataTransfer.types || []).includes("Files")) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "copy";
        zone.classList.add("os-drop");
      };
      zone.addEventListener("dragover", over);
      zone.addEventListener("dragenter", over);
      zone.addEventListener("dragleave", (e) => {
        // dragleave fires when crossing onto a child too; ignore those.
        if (e.relatedTarget && zone.contains(e.relatedTarget)) return;
        zone.classList.remove("os-drop");
      });

      zone.addEventListener("drop", async (e) => {
        if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
        e.preventDefault();
        zone.classList.remove("os-drop");
        // Dropping onto a zone whose current occupant is mid-job would
        // replace it underneath the job; any other drop is fine.
        if (zone.dataset.zone === "source" && isBusy(sourcePath)) return;

        const paths = [];
        for (const f of e.dataTransfer.files) {
          const p = window.freeframe.pathForFile(f);
          if (p) paths.push(p);
        }
        if (!paths.length) return;

        // main stats them: only it can tell a folder from a file, and the
        // two mean different things on the source side.
        const sel = await window.freeframe.classifyPaths(paths);
        if (!sel) return;

        if (role === "source") {
          applySourceSelection(sel);
        } else {
          // A destination has to be a directory to write into. Dropping
          // files here is a mistake worth naming rather than ignoring.
          if (sel.kind !== "dir") {
            const box = $("summary");
            box.replaceChildren(
              el("div", { class: "head" }, [el("h3", { class: "bad", text: "That can't be a destination" })]),
              el("div", {
                class: "verdict bad",
                text: "A destination has to be a folder to copy into. Drop a folder here, or drop those files on Sources instead.",
              })
            );
            box.style.display = "block";
            return;
          }
          const folder = sel.paths[0];
          if (!extraFolders.includes(folder) && !volumes.some((v) => v.mountPoint === folder)) {
            extraFolders.push(folder);
          }
          const dev = deviceFor(folder);
          if (dev) rememberRecent(dev, "destination", folder);
          // §89 — INHERIT. Deliberately NOT special-cased away from the
          // menu paths: consistency across entry points is the whole
          // lesson of §69 → §73 → §89.
          addDest(folder);
        }
      });
    }

    // The window itself must refuse drops, or dropping a file anywhere
    // outside a zone makes Electron navigate the whole page to that file —
    // the app is simply gone, with no way back.
    for (const ev of ["dragover", "drop"]) {
      window.addEventListener(ev, (e) => {
        if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) e.preventDefault();
      });
    }

    initStep("os drag-and-drop", () => {
      wireOsDrop("zone-source", "source");
      wireOsDrop("zone-dest", "dest");
    });

    // ── Item 5: modal buttons ──
    on("modal-src", "click", async () => {
      if (!modalState) return;
      const f = await pickFolder({ title: "Choose a source folder", device: modalState.volumePath, role: "source" });
      if (!f) return;
      modalState.src = f;
      updateModalChosen();
    });
    on("modal-dst", "click", async () => {
      if (!modalState) return;
      const f = await pickFolder({ title: "Choose a destination folder", device: modalState.volumePath, role: "destination" });
      if (!f) return;
      modalState.dst = f;
      updateModalChosen();
    });
    on("modal-cancel", "click", () => {
      // Reverts only the assignment that caused the conflict, leaving the
      // pre-existing one alone — cancelling shouldn't undo work the user
      // didn't just do.
      const revert = modalState?.onCancel;
      closeModal();
      revert?.();
    });
    on("modal-done", "click", () => {
      if (!modalState || !modalState.src || !modalState.dst) return;
      const root = modalState.volumePath;
      const { src, dst } = modalState;
      closeModal();
      // Replace the bare volume root on both sides with the chosen
      // subfolders. Done as a swap rather than an add so the root doesn't
      // linger in either role.
      if (sourcePath === root) sourcePath = src;
      const node = destNodes.find((n) => n.path === root);
      if (node) node.path = dst;
      else destNodes.push({ id: newId(), path: dst, parentId: null });
      pruneExtraFolder(root);
      render();
    });

    // ── Item 1: live volume detection ──
    // No polling — the main process watches /Volumes and pushes. The
    // renderer just re-lists, rather than trusting a diff computed
    // elsewhere.
    window.freeframe.onVolumesChanged(() => { refresh(); });

    // ── FreeFrame account ──
    /**
     * §64 — the account button is gone from the header; login lives in the
     * Settings window. What is left here is the consequence of a sign-in
     * state, not a control for it: the FreeFrame page tab exists only while
     * signed in, because the embedded app has nothing to show otherwise and
     * landing on its own login page is exactly what the gating prevents.
     */
    function updateAccountUi() {
      const tab = $("page-freeframe");
      if (tab) tab.hidden = !ffStatus.loggedIn;
    }

    async function loadProjects() {
      if (!ffStatus.loggedIn) { ffProjects = []; render(); return; }
      const res = await window.freeframe.freeframeProjects();
      ffProjects = res && res.ok ? (res.projects || []) : [];
      render();
    }

    async function refreshAccount() {
      ffStatus = await window.freeframe.freeframeStatus();
      updateAccountUi();
      await loadProjects();
    }

    // ── Bootstrap ──
    // Each step is independent and isolated. Previously these ran as bare
    // top-level statements, so the first thrown exception silently killed
    // every step after it — including the refresh() that populates the
    // whole window. Ordering here is presentation only; nothing below
    // depends on anything above completing.
    initStep("account", () => {
      refreshAccount().catch(() => {});
      // §64 — login moved to the Settings window, so this window hears about
      // it from main rather than from a form it ran itself.
      window.freeframe.onAccountChanged(async (st) => {
        ffStatus = st || { loggedIn: false };
        updateAccountUi();
        if (!ffStatus.loggedIn) {
          ffProjects = [];
          // Main destroys the embedded view on logout, so leaving the
          // FreeFrame page selected would show a blank window under a tab
          // that is about to disappear.
          if (currentPage === "freeframe") await setPage("offload");
          render();
        } else {
          await loadProjects();
        }
      });
    });

    // §61 — the toolbar picker is gone; the algorithm is a Settings value
    // now, read here at load and whenever Settings writes it. There is no
    // per-job override any more: a job captures whatever this holds when it
    // starts.
    initStep("checksum algorithm", () => {
      window.freeframe.getAlgorithms().then(async ({ algorithms: list, default: def }) => {
        algorithms = list || [];
        algorithm = def || "xxhash64";
        // The saved default wins over the built-in one, but only if it is
        // still a real algorithm — a stale id from an older build would
        // otherwise leave the picker showing nothing selected (§58).
        try {
          const saved = await window.freeframe.getSettings();
          const wanted = saved && saved.liveChecksumAlgo;
          if (wanted && algorithms.some((a) => a.id === wanted)) algorithm = wanted;
          hiddenVolumeNames = (saved && saved.hiddenVolumeNames) || [];
          hiddenProjectIds = (saved && saved.hiddenProjectIds) || [];
          render();
        } catch { /* no settings yet — the built-in default stands */ }
      }).catch(() => {});

      // Settings is another window now, so its writes arrive as a
      // broadcast rather than as a local re-render.
      window.freeframe.onSettingsChanged((saved) => {
        const wanted = saved && saved.liveChecksumAlgo;
        if (wanted && algorithms.some((a) => a.id === wanted)) algorithm = wanted;
        hiddenVolumeNames = (saved && saved.hiddenVolumeNames) || [];
        hiddenProjectIds = (saved && saved.hiddenProjectIds) || [];
        render();
      });
    });

    // §61 — Settings is a real window now (see settings.html). The modal
    // that used to live here, its hide-list rendering and its algorithm
    // <select> all moved there; the button only opens the window.
    initStep("settings", () => {
      on("settings-btn", "click", () => { void window.freeframe.openSettingsWindow(); });
    });

    initStep("recent folders", () => {
      window.freeframe.getRecentFolders().then((r) => { recentFolders = r || {}; }).catch(() => {});
    });

    initStep("project folder picker", () => {
      on("ffdir-cancel", "click", closeFolderPicker);
      on("ffdir-save", "click", () => {
        if (!folderPickerState) return;
        const { projectId, role, selected } = folderPickerState;
        // Root means "no selection" for this role only — the other role
        // keeps whatever it had (§24a).
        setProjectFolder(projectId, role, selected.id === "root" ? null : selected);
        if (selected.id !== "root") {
          // Remembered per project AND per role, keyed by the same
          // `freeframe://<id>` string every other path-keyed structure in
          // this file uses for a project.
          rememberRecent(`freeframe://${projectId}`, role, selected);
        }
        closeFolderPicker();
        // §24c — choosing the root still means "use this project for this
        // role", it just means at the top level. Assigning only for a
        // non-root pick would make the root option silently do nothing.
        assignProjectRole(projectId, role);
        render();
      });
      on("ffdir-backdrop", "keydown", (e) => { if (e.key === "Escape") closeFolderPicker(); });
    });

    initStep("job panel", () => {
      on("jobs-toggle", "click", () => setJobsPanelOpen(!$("jobs-panel").classList.contains("open")));

      // Drag-resize, replacing the old Expand/Shrink button. Taller shows
      // more rows; dragging down collapses toward the tab strip.
      $("jobs-resize").addEventListener("mousedown", (e) => {
        e.preventDefault();
        const startY = e.clientY;
        const startH = $("jobs-panel").getBoundingClientRect().height;
        $("jobs-resize").classList.add("dragging");
        document.body.classList.add("resizing-jobs");
        // Dragging UP (a smaller clientY) makes the panel taller.
        const move = (ev) => setJobsPanelHeight(startH + (startY - ev.clientY));
        const up = () => {
          $("jobs-resize").classList.remove("dragging");
          document.body.classList.remove("resizing-jobs");
          window.removeEventListener("mousemove", move);
          window.removeEventListener("mouseup", up);
        };
        window.addEventListener("mousemove", move);
        window.addEventListener("mouseup", up);
      });

      on("jobs-detach", "click", () => window.freeframe.detachPanel());
      // Finished rows only — the queue refuses anything still in flight, so
      // this cannot become a way to kill a running transfer (§59).
      on("jobs-clear", "click", () => window.freeframe.clearFinishedJobs());
      on("jobs-redock", "click", () => window.freeframe.dockPanel());

      window.freeframe.onJobsChanged((snapshot) => {
        jobSnapshot = snapshot;
        drawJobs();
        // Open the panel the first time something is actually running, so
        // a job never runs with no visible sign of it.
        if (snapshot.some((j) => j.status === "running" || j.status === "queued")) {
          setJobsPanelOpen(true);
        }
      });
      window.freeframe.onPanelDockChanged((detached) => {
        panelDetached = detached;
        $("jobs-panel").classList.toggle("detached", detached);
        $("jobs-detach").textContent = detached ? "Detached" : "Detach";
        $("jobs-detach").disabled = detached;
        if (detached) setJobsPanelOpen(true);
      });
      window.freeframe.listJobs().then((s) => { jobSnapshot = s; drawJobs(); }).catch(() => {});
    });

    initStep("concurrency mode", () => {
      updateConcLabel();
      on("conc-btn", "click", (e) => {
        e.stopPropagation();
        menu.replaceChildren();
        menu.appendChild(el("div", { class: "label", text: "Queueing" }));
        for (const [value, title, desc] of CONC_OPTIONS) {
          const b = el("button", {
            onClick: () => { concurrencyMode = value; updateConcLabel(); closeMenu(); },
          });
          b.appendChild(el("div", { text: (value === concurrencyMode ? "✓ " : "") + title }));
          b.appendChild(el("div", {
            style: "font-size:10px;color:var(--text-tertiary);white-space:normal;max-width:260px;line-height:1.4",
            text: desc,
          }));
          menu.appendChild(b);
        }
        const r = e.currentTarget.getBoundingClientRect();
        menu.style.display = "block";
        menu.style.left = `${Math.min(r.left, window.innerWidth - 300)}px`;
        menu.style.top = `${r.bottom + 4}px`;
      });
    });

    // ── §72 — the daily overview ────────────────────────────────────────
    //
    // A dropdown, not a window: this is a glance at what has landed today,
    // and a BrowserWindow would make it a destination. Anchored like #menu.
    let dailyOpen = false;

    const closeDaily = () => { dailyOpen = false; $("daily-card").classList.remove("open"); };

    function dailyRow(c) {
      const verifiedAll = c.status === "verified";
      return el("div", { class: "dov-row" }, [
        el("span", { class: "dov-name",
          text: c.isNamedCard ? `Card ${c.label}` : c.label,
          title: c.isNamedCard ? `{sourcecounter} ${c.label}` : c.label }),
        // A plain copy still appears — it just never claimed a number, and
        // saying so is better than implying it did.
        c.isNamedCard ? null : el("span", { class: "dov-badge", text: "no preset" }),
        el("span", { class: "dov-num", text: c.firstCompletedAt
          ? new Date(c.firstCompletedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : "—" }),
        el("span", { class: "dov-num", text: `${c.files} files` }),
        el("span", { class: "dov-num", text: formatBytes(c.bytes) }),
        el("span", { class: verifiedAll ? "dov-ok" : "dov-bad",
          text: verifiedAll ? "Verified" : `${c.verifiedFiles}/${c.totalFileCopies}`,
          title: verifiedAll ? "Every copy was re-read and matched" : "Not every copy verified" }),
      ]);
    }

    async function drawDaily() {
      const host = $("daily-card");
      if (!host) return;
      const { dayBoundary, day } = await window.freeframe.dailyOverview();
      if (!dailyOpen) return;   // closed while awaiting
      host.replaceChildren();

      const cards = day.cards || [];
      const totals = cards.reduce((a, c) => ({
        files: a.files + c.files, bytes: a.bytes + c.bytes,
        verified: a.verified + c.verifiedFiles, copies: a.copies + c.totalFileCopies,
      }), { files: 0, bytes: 0, verified: 0, copies: 0 });

      const head = el("div", { class: "dov-head" });
      const title = el("div", { class: "dov-title" }, [
        el("h3", { text: `Today — ${new Date().toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" })}` }),
        el("span", { class: "spacer" }),
        el("button", { class: "dov-reset", text: "Reset now",
          title: "Clear today's overview. Does not touch any files, any log, or the card number.",
          onClick: async () => { await window.freeframe.resetDailyOverview(); drawDaily(); } }),
      ]);
      head.appendChild(title);
      head.appendChild(el("div", { class: "dov-sub",
        text: `Resets at ${dayBoundary} · ${cards.length} card${cards.length === 1 ? "" : "s"} so far` }));
      host.appendChild(head);

      const stats = el("div", { class: "dov-stats" });
      for (const [k, v] of [
        ["Cards", String(cards.length)],
        ["Files", String(totals.files)],
        ["Data", formatBytes(totals.bytes)],
        ["Verified", totals.copies ? `${totals.verified}/${totals.copies}` : "—"],
      ]) {
        stats.appendChild(el("div", { class: "dov-stat" }, [
          el("div", { class: "k", text: k }), el("div", { class: "v", text: v }),
        ]));
      }
      host.appendChild(stats);

      const list = el("div", { class: "dov-list" });
      if (!cards.length) {
        list.appendChild(el("div", { class: "dov-empty", text: "Nothing offloaded yet today." }));
      } else {
        // Earliest first: the order the day actually happened in.
        for (const c of [...cards].sort((a, b) => a.firstCompletedAt - b.firstCompletedAt)) {
          list.appendChild(dailyRow(c));
        }
      }
      host.appendChild(list);

      const foot = el("div", { class: "dov-foot" });
      foot.appendChild(el("button", {
        text: "Export as CSV",
        onClick: async () => {
          const res = await window.freeframe.exportDailyOverview();
          const note = $("daily-export-note");
          if (note) note.textContent = res && res.ok ? `Saved to ${res.path}` : (res && res.error) || "Export failed";
        },
      }));
      foot.appendChild(el("span", { class: "spacer" }));
      // A hint, not a control — the setting itself lives in Settings (§72).
      foot.appendChild(el("span", { class: "dov-hint", text: "Day boundary: Settings → General" }));
      host.appendChild(foot);
      host.appendChild(el("div", { id: "daily-export-note", class: "dov-hint",
        style: "padding:0 12px 8px;word-break:break-all" }));
    }

    initStep("daily overview", () => {
      on("daily-btn", "click", async (e) => {
        e.stopPropagation();
        // Captured before the await, per §65c: currentTarget is only valid
        // during synchronous dispatch, and reading it after yielding is
        // what made the preset pill silently do nothing.
        const btn = e.currentTarget;
        if (dailyOpen) { closeDaily(); return; }
        dailyOpen = true;
        const host = $("daily-card");
        host.classList.add("open");
        await drawDaily();
        const r = btn.getBoundingClientRect();
        host.style.left = `${Math.max(8, Math.min(r.left, window.innerWidth - host.offsetWidth - 8))}px`;
        host.style.top = `${r.bottom + 6}px`;
      });
      // Redrawn on the same broadcast the completion point fires, so a job
      // finishing while the card is open updates it rather than going stale.
      window.freeframe.onDailyOverviewChanged(() => { if (dailyOpen) drawDaily(); });
    });

    initStep("naming presets", () => {
      // §61 — the editor moved to the Settings window, but this pill was
      // the ONLY way to choose an active preset: there was no selector,
      // saving one in the editor is what made it active. Removing the
      // trigger without replacing it would have left the app with no way
      // to pick a preset at all. So the pill now does what its caret has
      // always promised — it selects — and hands editing to Settings.
      // One click, no menu: off keeps the selection so on can restore it.
      on("preset-toggle", "click", (e) => {
        e.stopPropagation();
        setActivePreset(activePresetId ? null : lastPresetId);
      });

      on("preset-btn", "click", async (e) => {
        e.stopPropagation();
        // Captured BEFORE the await. `currentTarget` is only valid during
        // synchronous dispatch — the browser nulls it once the handler
        // yields, so reading it after `await reloadPresets()` threw a
        // TypeError on every click. The menu's contents were appended
        // first, so the buttons existed in the DOM and only the line that
        // makes the menu visible never ran: the pill looked inert while
        // anything inspecting the DOM saw a fully-built menu.
        const btn = e.currentTarget;
        await reloadPresets();
        menu.replaceChildren();
        menu.appendChild(el("div", { class: "label", text: "Naming preset" }));

        const pick = (id) => { setActivePreset(id); closeMenu(); };
        menu.appendChild(el("button", {
          text: (activePresetId ? "" : "✓ ") + "No naming preset",
          onClick: () => pick(null),
        }));
        for (const p of presetStore.presets) {
          menu.appendChild(el("button", {
            text: (p.id === activePresetId ? "✓ " : "") + p.name,
            onClick: () => pick(p.id),
          }));
        }
        menu.appendChild(el("div", { class: "label", text: "" }));
        menu.appendChild(el("button", {
          text: "Manage presets…",
          onClick: () => { closeMenu(); void window.freeframe.openSettingsWindow("presets"); },
        }));

        const r = btn.getBoundingClientRect();
        menu.style.display = "block";
        menu.style.left = `${Math.min(r.left, window.innerWidth - 300)}px`;
        menu.style.top = `${r.bottom + 4}px`;
      });

      // The editor is in another window; its saves and deletes arrive as a
      // broadcast. reloadPresets() already drops an active id that no
      // longer exists, so deleting the active preset there clears it here.
      window.freeframe.onPresetsChanged(() => { void reloadPresets(); });

      on("values-cancel", "click", () => {
        $("values-backdrop").classList.remove("open");
        const done = valuesDone; valuesDone = null;
        if (done) done(false);
      });
      on("values-save", "click", () => {
        if (missingRequired().length) {
          $("values-error").textContent = `Fill in ${missingRequired().join(", ")} — used in the folder name.`;
          return;
        }
        $("values-backdrop").classList.remove("open");
        const done = valuesDone; valuesDone = null;
        if (done) done(true);
      });

      reloadPresets().catch(() => {});
    });

    initStep("display names", () => {
      window.freeframe.getDisplayNames().then((n) => { displayNames = n || {}; render(); }).catch(() => {});
    });

    // Last, and deliberately outside any conditional: if this doesn't run,
    // the app shows an empty window, which is the symptom that started
    // this whole pass.
    // §60b — page switcher for the embedded FreeFrame web view.
    //
    // The view is a native child of the window rendered by the main
    // process, so this side owns two things only: which tab looks active,
    // and where the app's own header ends. The header WRAPS (§25b), so its
    // height is measured rather than assumed — a hardcoded offset would
    // slice the top off the embedded page the moment the header went to
    // two rows.

    function headerBottom() {
      const h = document.querySelector("header");
      return h ? Math.round(h.getBoundingClientRect().height) : 0;
    }

    async function setPage(page) {
      const next = page === "freeframe" ? "freeframe" : "offload";
      currentPage = next;
      const web = next === "freeframe";
      document.body.classList.toggle("page-web", web);
      const tabs = { offload: $("page-offload"), freeframe: $("page-freeframe") };
      for (const [key, node] of Object.entries(tabs)) {
        if (!node) continue;
        node.classList.toggle("active", key === next);
        node.setAttribute("aria-selected", key === next ? "true" : "false");
      }
      try {
        if (web) await window.freeframe.showWebView(headerBottom());
        else await window.freeframe.hideWebView();
      } catch (err) {
        console.error("[webview]", err);
      }
    }

    initStep("page switcher", () => {
      on("page-offload", "click", () => { void setPage("offload"); });
      on("page-freeframe", "click", () => { void setPage("freeframe"); });

      // A header that reflows (a longer preset name, a narrower window)
      // moves the boundary the embedded view was positioned against.
      const header = document.querySelector("header");
      if (header && typeof ResizeObserver === "function") {
        let last = 0;
        new ResizeObserver(() => {
          const h = headerBottom();
          if (h === last || currentPage !== "freeframe") { last = h; return; }
          last = h;
          window.freeframe.setWebViewInset(h).catch(() => {});
        }).observe(header);
      }
    });

    initStep("initial volume load", () => { refresh(); });
  </script>
</body>
</html>
